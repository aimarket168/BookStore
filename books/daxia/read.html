了，要在琅兒面前被蠻族小鬼的手扣到潮吹了，哦……朕的美豆哦好美齁齁要去了……”\n\n黃豐聽命的大力扣動騷穴，目視著一切的少琅，不爭氣地要緊牙關，眼神露出欣然之色。\n\n瞧著琅兒模樣的女帝，鳳眸撇撇，繼而腰肢猛地一顫，雙腿蜷緊，筍足點在秋千上，畫出優美弧線，她沒有壓抑體內焚燒的浴火，再隨著噗嗤一聲，她忘我地啃食起黃豐的舌頭，一股滾燙淫水唰地一下跟後噴射到了少琅的臉上。\n\n恥辱，無盡的恥辱。\n\n最終女帝全身癱軟倒在黃豐身上，鳳眸再刮掃向少琅時，唯有落寞。\n\n但作為大夏女帝，龍氣和靈氣雙修的至強者的體魄，又怎可能僅此變得萎靡不起，很快她便冷冷瞪了瞪黃豐，呵到：“手，伸出來。”\n\n黃豐深知還不能違逆這個女人，再度從命，僅而再見兩根遍佈淫水的手指從女帝穴戶緩緩伸出，帶出一條條細密黏漿後。\n\n女帝偏手挑起上半身松垮的鳳袍，悠悠站起走到少琅身前，淺金色鳳眸居高臨上地望著他，紅唇蔑地張開：“廢物！！”\n\n聞言，姬少琅黯然低下頭，瞧著視線內母后腿根處淫水源源不斷的滑落，內心一陣竊喜與悲痛。\n\n“你過來！”見勢女帝螓首微搖，半轉過臉落在黃豐身上，再隨著黃豐走到她身邊後，她竟在琅兒面前主動挽起了黃豐的手，又帶著絕高上位者的語氣，呵斥道：“永遠不要背著朕，做是不該做的事，否則……呵。”\n\n女帝說著，紅唇勾勒：“但既然琅兒喜歡看，那你就在這待著吧，放心！朕會讓你看個痛快！！”\n\n說罷。\n\n女帝邁動玉柱長腿，筍足隔著黑絲輕輕壓過少琅跪著的大腿面上，高挑的身姿牽動矮小低劣的黃豐，徐徐步入廂房。\n\n朝望間東側廂房房門隨即關閉，姬少琅被迫跪在了門外，少年眼中看不出悲與喜，他只知道即將有著更多的刺激，在等著自己。\n\n但諾大的城主府，如今內部的風雨真的只有這麼少嗎？\n\n就在姬少琅好奇房中會發生什麼的時候？\n\n其背後梧桐樹下，又有一袂鳳袍，邁動長腿徐徐走到了他身邊，銀白長髮於風中搖曳，隨即她金眸斜撇，紅唇微微張開：“琅兒，你讓母后很失望。”\n\n聽著耳旁傳來的聲音，姬少琅身體震了震，旋而再見抬抬頭望去：“母后？”\n\n望著琅兒驚訝模樣，東方嵐未有任何多餘神色，只是皓皖一翻，舉起美手：“母后問你，是否有是瞞著母后？”\n\n姬少琅露出迷茫表情，道：“母后在說什麼，琅兒不過是……呵呵……”\n\n言語道出時，少琅笑了笑：“想看到……一些事情而已。”\n\n聞言，東方嵐鳳眸片刻呆滯，緩後默默搖了搖頭，接而美手往下按壓，將一個屏障施加在了姬少琅身上，再緩緩道：“既然想看，那就好好看看吧，這個少年將會是你們這一代中最出色的。”\n\n聽到母后的話，姬少琅心中有點不是滋味，又有點忌憚。\n\n母后對黃豐的評價，居然如此之高？\n\n然就在屏障布下，葉隨風落，院外瞿竹女官的聲音，便傳了進來：“陛下，蠻族太子到了。”\n\n姬少琅瞬間凝了凝神，眸色微沉，烏木威爾怎麼也來了？\n\n而在瞿女官聲音響起後，東方嵐旋即撩起鳳袍，一甩長髮：“宣，西廂房覲見。”\n\n再即，院門外有沉重的腳步聲錯落。\n\n瞧著母后化身走進西廂房，一隻肥胖如豚，穿著金黃蟒服的異族青年，手盤著腰間玉帶，滾溜滾溜踏進院中，然後視野有些怪異地看了看空蕩蕩的院落中央，又看不出什麼蹊蹺後，便抬腳走向西廂房。\n\n同刻，由於東廂房並沒有被隔絕聲音。\n\n起初黃豐還在為與女帝獨處，姬少琅跪在院外，有種你媽光明正大和他私會的刺激感誕生，而聽到了外面的響動，表情默然一變。\n\n然就在他疑團滿腹時，身穿鳳袍的女帝，緩緩走到了屏風後，接而探手蹭了蹭內室中不知盛放了多久的澡盤邊緣，未有回頭，語氣慵懶地說道：“怎麼，看你神情，似乎並不怎麼待見自己這位兄長。”\n\n黃豐回過頭，望向屏風後曼妙的身影，道：“哪裡有？”\n\n“呵呵。”女帝輕描淡寫笑了笑，美手逐漸攀升到香肩處：“你的這些話，拿去騙騙上官玉合或許還可以，但騙朕！”\n\n言語悠悠落下，再見屏風後，女帝螓首微斜，隔著畫布投來的視線，都不免讓人感到威嚴森寒之意：“就算放棄九州一半百姓的生命，你亦活不出這處房門，天命人。”\n\n黃豐頓時感覺如墜幽暗黃泉，他苦澀一笑：“小王怎麼可能騙陛下。”\n\n聞言後，女帝鳳眸睨睨，上刻還冰冷得滲人，抖而又笑吟吟將紅唇勾起：“不過，胸無大志者焉有博朕眼球的能力。”\n\n說著，美手挑起鳳袍，徐徐落下。\n\n白皙如玉的美背在房中發出奪目光芒，女帝斜望眼神已變得有些呆滯的黃豐，紅唇翹出了個淺淺弧度，玩味笑道：“此情此景，熟悉否？”\n\n黃豐不明白女帝想做什麼，一味點頭：“熟悉。”\n\n女帝聽著，再即伸手緩慢地解開腰間繫繩：“你好奇朕在玩什麼把戲，對嗎？”\n\n難道還會有人不好奇？\n\n黃豐很想這麼說，但也只是輕輕回應了當然二字。\n\n“實際上很簡單，你饞朕的身子，而我想要你們蠻地。”女帝話語淡淡，仿佛一筆帶過很多重要的事，接而鳳眉擰蹙良久，片刻揚起：“進來。”\n\n進去，進哪去？\n\n見黃豐原地不動，女帝不可違逆的聲音再度響起：“難道還要朕重複一遍嗎？”\n\n呵呵。\n\n“不用。”還在思忖細節的黃豐，連忙回應，蹬起腳就先走進內室。\n\n想歸想，他自己又怕什麼呢？\n\n怕兄長？\n\n呵呵，開什麼玩笑！\n\n然而當黃豐轉入屏風內室，霧氣氤氳，燭光搖曳，女帝高挑妖嬈的身影，半解鳳袍，高挺傲乳如水滴般被金鏈包圍環繞，繫繩纏結地掛在腰間，空氣中淡淡的玫香，混合著淫靡的氣息，讓黃豐的喉嚨一陣乾渴。\n\n雖然女帝裸體的模樣，黃豐不是沒有見過。\n\n可目前站著的這位大夏女帝，顯然無論是神識，還是酮體，都是本尊！\n\n這種誘惑，和來源於上位者威風凜凜的氣勢，都是化身所不具備的。\n\n雖然按照上官玉合所言，身外化身和本體，實際都為同一個神識作為主導，沒有什麼區別，但本體就是就是本體，一舉一動，一顰一笑，都遠非化身能比擬的。\n\n只是，進來做什麼呢？\n\n黃豐腦海裡的疑問，很快便在女帝轉身後，得到了答案。\n\n明黃燭火色欲旖旎無度，女帝鳳袍衣料顯然是天下最精貴奢華的，然而即便用了天下最閨中的蠶絲金線，依舊無法遮掩住她龍體的豔美，隨著黃豐抬眸，飽滿傲乳懸翹於空，在剛經過一次小小高潮興奮後，蓓蕾尚在充血挺立。\n\n但把黃豐叫進來，顯然不是讓他玩弄自己美乳的。\n\n很快，女帝便再他面前攤平雙手，姿態懶洋洋眯起鳳眸，聲音雖慵懶又霸道，帶著一絲不耐：“愣著幹什麼？過來，給朕解開。”\n\n原來就為了這點小事，黃豐聽罷笑著，就伸出手，非常樂意犒勞。\n\n再見黃豐腳步有些踉蹌地靠近，他指尖顫抖地觸碰向那金線繫繩，手指不知是有意還是無意滑過她腰側的軟肉，女帝身體當即微微一顫，發出一聲低哼：“嗯????……動作快點，別磨蹭。”\n\n可就待他的手出發點明顯再奔著滑美腰肢滑上，想採擷上方倆顆熟透的奶果時，女帝冷不丁又慢條斯理輕吟道：“要是碰到什麼不該碰的，朕可不饒你。”\n\n黃豐抬起烏黑小眼：“什麼是不該碰的。”\n\n接而，女帝鳳眸微張，瞅了瞅身高尚且才到自己胸下的矮瘦蠻族少年，玩味一笑：“你說呢？”\n\n你要這麼說，那就沒什麼不該碰的地方了。\n\n想是這麼想，然黃豐還是默默咽了口唾沫，低下頭開始給女帝接開腰間的繫繩，目光之內，女帝由黑絲包裹的纖長且緊實，腰帶雖然被繫繩纏結而不能脫下，可小腹內陰影若隱若現，還是勾得他喉嚨乾癟：“陛下……有句小王不知該不該說。”\n\n女帝聞言，神色看不出喜惡道：“那就憋著。”\n\n黃豐呵呵笑了笑，帶著毫不掩飾的貪婪，直言道：“陛下本體真他娘美得像個騷氣十足。”\n\n聽著黃豐的話，女帝鳳眸微眯，紅唇勾起一抹嘲弄的弧度：“嘴巴放乾淨點。不過，既然饞了就這點能耐？按照前日你與化身的約定，朕不是還欠你一次嗎？噢不對，或者說是無數次？”\n\n肏蛋！\n\n這本體的女帝原來是這麼騷的嗎？\n\n還是說化身不過收著呢，但屢次三犯她話語瞧不起人的話，當真是令人憋屈。\n\n面對這赤裸裸的挑釁，黃豐顯然不是什麼善茬，再也沒有忍住手腳，手裡劃出靈氣隔斷纏繞的細繩。\n\n鳳袍裙褂當即完全滑落，女帝如玉柱般白皙纖美的長腿腿畔入眼，鬱鬱蔥蔥的茂密絨毛，成熟女強者的濃烈氣息，在私處溫熱的地帶悍然襲擊向黃豐面前。\n\n而以黃豐矮小的身子，微微俯下頭時，他的鼻尖幾乎都快要貼上女帝的屄戶前，再瞧到那陰絨粘濕，被自己扣得水流潺潺的唇瓣時，其心裡還是忍不住謾駡了句：“真是個騷屄。”\n\n只是未等黃豐有任何動作，他耳邊傳來的女帝一聲蔑笑，一股威壓當即便降臨到黃豐身上，轟然把他整個人完全壓到了地面。\n\n再見女帝順理成章抬起美腿，鞭掃破空而出，瞬息踹往了黃豐胸膛，直至將他整個人踢翻在地上後，女帝被黑絲包裹的筍足又斷然輕輕壓在他身上：\n\n“急什麼？朕說讓你碰了？”\n\n摔在地面上的黃豐，額頭冒著冷汗，然望著女帝雙腿間的私處，還是忍不住舔了舔嘴唇，低聲道：“陛下，我們不是說好的嗎？”\n\n“噢？”女帝冷哼著，鳳眸自上而下俯望著黃豐片刻，她紅唇略勾，美手漸漸伸下私處，手指再輕輕扯開唇瓣，將濕潤的私處徹底暴露在黃豐眼前後，內裡熱辣紅腴的軟肉，散發著淫靡的光澤，調戲道：“那你倒是來啊，別光說不練。”\n\n黃豐當然很想撲上去抓住女帝的豐臀，用力掰開，然後把舌頭舔向那濕漉漉的穴口。\n\n可被洞虛強者一腳踏下，身上的威壓不減，他又怎麼有動彈的能力。\n\n不過，起身的能力沒有！\n\n不代表著他連挪動的能力都做不到。\n\n聽著女帝撩撥人又不給肉吃的話，黃豐咬著壓忍住身上的壓力，腰間玉如意在此開始散發出微弱光芒，其被壓在地面上的兩隻手，奮力地抬起，然後捧住了女帝的筍足，繼而再往上一拉，含在了嘴裡。\n\n突發的狀況，女帝身體猛地發出一聲壓抑的呻吟，豔容仰起：“嗯????……蠻族人，果然下賤……！”\n\n話語間隙。\n\n黃豐已變得不管不顧，舌頭瘋狂舔弄，吸吮著女帝被黑絲包裹的筍足足底，油光抹亮的黑絲逐步變得水濘。\n\n未果，在女帝一聲聲呻吟聲中，他還咬破了絲襪，舌頭順著坑洞跟著插了進去，舔弄起她的粒粒分明的明珠藕趾。。\n\n而望著下方黃豐宛如忠犬般舔舐自己的腳後，女帝半咬紅唇，鳳眸半閉的神態愈發迷離，跟著情緒波動晃蕩的傲乳，都泛起誘人光澤：“朕……本以為你是把朕給嗯????……弄得爽翻天……可未曾想是這麼個弄法？”\n\n黃豐囫圇吞棗，不對，是囫圇吞足，舌頭舔舐過每一粒足趾，吸吮得嘖嘖作響：“怎麼弄，不是弄！陛下爽了就行。”\n\n“呵呵。”\n\n女帝鳳眸中閃過一絲喜意，但更多的卻是欲望，她微微抬起腳，讓自身筍足跟翹起，足漸更以一種送食的姿勢，踩伸進黃豐嘴裡：“那就舔，給朕好好的舔！”\n\n聞言，黃豐撣掃了眼有所興奮的女帝。\n\n這個大夏女帝，難不成是那種類型？\n\n那倒是有趣了！\n\n於是乎黃豐再無顧忌地張開嘴，含住她的趾頭，牙齒輕輕啃咬吸吮她趾間每一處縫隙。\n\n另一邊女帝的呻吟聲逐漸更加放蕩，鳳眸隱隱撇著窗外院落少琅跪著的方向，紅唇勾笑：“嗯????……你下賤的蠻子……嗯????舔得朕好爽……怎麼辦？嗯????……”\n\n呻吟間，女帝循序漸進地減去了威壓的重力。\n\n得到減負的黃豐，亦沒再被踩在地面，而是半跪著捧起筍足吸吮，那雙手亦漸漸攀登上了玉柱。\n\n女帝呻吟聲逐漸變得連綿，雙手壓在澡盆邊緣，身體慢慢後仰，胸部挺高，任由黃豐在她身上肆虐的姿態，顯然得到了不少愉悅。\n\n而瞧著女帝不停喘息，鳳眸半閉，滿臉潮紅的神情。\n\n黃豐又在舔了舔她足底水跡後，目光貪婪望向她濕漉漉的下體，只是當他正準備脫下褲子，手扣鳳穴，再肏女帝名器時。\n\n上一步且在迷離的女帝，卻突然睜開眼，鳳眸刮冷道：“還想做什麼？”\n\n話畢後，女帝又是一腳把他踹開，俯視著他，眼中滿是傲慢：“想肏朕？沒那麼容易。”\n\n女帝話語如冷水般潑在黃豐頭上，他心中充滿了不甘和憤怒，這個騷娘們，屢次都是這樣，給點肉吃就又把人踹一旁，還有那種眼神！！\n\n只是對於黃豐內心的小九九，女帝卻毫不在意，紅唇微啟：“你覺得朕是什麼人？是你能隨便得逞的？”\n\n黃豐喘著粗氣，盯著女帝那對飽滿挺拔的乳房，他知道女帝實力當下還遠超自己，若真要反抗，恐怕自己在不動用所有底牌的情況下，連她的衣角都碰不到。\n\n故而黃豐裝出一副苦笑面容，便道：“陛下折磨小王，又是何必呢？”\n\n女帝冷笑一聲：“折磨？呵呵，朕還沒開始呢。”\n\n她的話語中帶著一絲戲謔，黃豐隱隱感覺到，女帝在計畫著什麼，而自己應該是她計畫中的一枚棋子。\n\n隨即，在黃豐思索著女帝到底在打什麼算盤時，女帝忽轉身一步踏出，鳳手輕揮。\n\n刹那間，整個院落幾乎所有房間的牆壁，在黃豐眼中都變得透明，仿佛不存在一般。\n\n黃豐瞪大了眼，視野內甚至還清晰出現了外面的景象，如姬少琅跪在地上院內不斷擼動讓他身下小陽根的模樣，還有西廂房內，自己王兄烏木威爾與女帝的化身對坐，不知再商談什麼的情景。\n\n黃豐不免回頭：“陛下是什麼意思？”\n\n女帝鳳眉接而輕挑，柔夷指向西廂房：“瞧那！”\n\n黃豐視線遂隨著手指方向，掃向西廂房，內裡話語聲亦同步傳進耳中。\n\n只見西廂房中，女帝化身端坐於主位上，屆時她氣質的雍華高貴，與本體展露出的淫蕩形成鮮明對比。\n\n再見蠻族太子，烏木威爾肥胖的身軀微微前傾，道：“女帝，和盟一事真真假假，你我心知肚明！但只要孤繼位蠻廷之首，自然能答應你不再劫掠夏朝，不過在此之後嘛，孤只要一件東西！”\n\n“一件東西？”化身聞言，淡淡一笑：“是封地？還是朕的身體？”\n\n烏木威爾眼中閃過淫光：“若能得陛下，死而無憾。”\n\n化身當即冷哼：“就憑你，也配？”\n\n烏木威爾攤開手：“為何不配，對於你們而言，殺不死我們！大比之後無非是再開戰事，到時候已征戰多年的疲乏邊野，百姓還受不受得了這個苦，你們內陸百姓又還受不受得了這個苦？”\n\n此刻，黃豐在東廂房內看得眉峰皺緊。\n\n女帝本體斜靠在澡盆旁，鳳眸戲謔：“你說，朕該不該答應他？”\n\n黃豐回過頭，嘿嘿一笑：“他不配。”\n\n女帝挑了挑眉：“哦？那你呢？”\n\n黃豐挺起胸膛：“小王至少比起他……能讓陛下爽得叫出聲。”\n\n女帝聞言，半轉過身挑起澡盤內的花瓣，半響後走至設好的臺階，柔夷兩指夾起腰間的黑絲，徐徐褪下，長白大腿顯露，纖美曼妙，被舔舐過的白皙筍足透著紅暈，足趾如筍摩挲數下，又輕輕探腳伸進了池水中：“你以為，朕是那種騷得出水的女人嗎？”\n\n黃豐歪了歪頭，鼻尖花香和女帝體香混合撲鼻，笑道：“難道不是嗎！”\n\n忽而女帝紅唇勾勒，誘惑十足：“你不就是想肏朕嗎？那就先看看，你有沒有資格！當然了，在此之前別急，你再看看你王兄。”\n\n黃豐聞言，目光再次轉向西廂房。\n\n那邊廂烏木威爾起身站在化身身旁，肥胖手掌摟住化身肩背入懷，露出的笑容有多變態就有多變態，道：“陛下，據我王弟所說，你的欲望溝壑難填，作為藩邦王子，孤很樂意為你效勞，就是不知陛下對此有何想法？”\n\n黃豐冷笑：“胡說八道，冒用我的名義，妄想接近陛下？癩蛤蟆想吃天鵝肉！”\n\n女帝將身體沉進澡水，鳳眸戲謔：“那你呢？難道就不是癩蛤蟆？”\n\n黃豐一愣，隨即挺直腰板：“小子可是堂堂男子漢，才能碰陛下。”\n\n女帝嗤笑，道：碰？方才你下賤難不成是假的？小王子，你應該知道朕要的是什麼，一個用得上的男人，而不是只會舔屄的蠻子！”\n\n黃豐被女帝那傲慢的眼神，心中思索，他清楚若不能證明自己的價值，女帝絕不會讓他碰一下。\n\n這就是帝皇！\n\n權術永遠是一個天子畢生所追求的！\n\n否則她東方嵐就不會是女帝。\n\n間而，黃豐緩緩道：“陛下，您這是什麼意思？”\n\n女帝冷笑，柔夷挑動澡水滑到自己肩上：“蠻族！你們背地調兵遣將別以為朕不得而知，然朕在涼州，蠻夷唾手可得！但在事後，蠻夷之地開化困頓，若併入大夏疆域新州，略失妥當，所以事後我需要一個人替我掌管蠻夷藩地。而他烏木威爾有兵有權，既有位分在身，比較起你來，你不過是個蠻廷庶出之子，你算得了什麼，能入朕的眼？”\n\n黃豐心頭一緊，明白女帝在權衡利弊後，深吸一口氣，道：“陛下，小王的價值，肯定遠超那頭肥豬。”\n\n“噢？”女帝躺向盤沿，雙手捧起水，漸漸灑在伸出水面的美腿上：“說說看。”\n\n黃豐淡然一笑，道：“天賦！女帝是上一代的佼佼者，但在我這一輩，無人能與我比肩。”\n\n聞言，女帝並沒有回話，神色仿對此毫無興趣可言。\n\n繼而黃豐又道：“蠻族內部也不是完全一條心的，若我父王不幸身死，六部的洞虛可未必會認一個區區太子為帥，到頭來，無非是一場奪位之爭，以我王兄的為人，貪婪好色對什麼都想分一杯羹，難以為女帝所用，而小子卻不同，小子要的只有陛下。”\n\n女帝聽著，紅唇淺淺翹起：“所以你倒是一頭好忠犬嗎？只是，忠犬多的是，朕差你一個？”\n\n騷屄。\n\n黃豐心裡唾駡了聲，接而從懷中兩瓶藥液和一本古舊書卷，緩緩道：“自然。只是陛下，哪怕忠犬再多，也只有小子心裡是永遠向著你的。”\n\n觀黃豐突然拿出物件，女帝鳳眸略帶疑問掃了過去。\n\n同刻，在她視線內，院落裡一樣能瞧見廂房內所有事情的姬少琅，陡然擰眉，向前跪著匍匐兩步。\n\n女帝不免惑了下：“這是何物？”\n\n黃豐先是提起兩瓶藥液，陰笑道：“在小子來府邸前，陛下的好兒子楚王殿下給我的，一瓶是增強男性宗筋能力的，一瓶則是讓女帝欲火沸騰的，據說他很早就在陛下飯菜裡，加了這些個佐料，為的就是陛下有朝一日，在他目前，有人能肏了陛下。說起來，他還真是變態啊。”\n\n聽到黃豐的話，女帝鳳眸稍稍斜撇，撣了眼週邊正瘋狂搖頭，嘴裡不斷喊著不是這樣的琅兒，驀然將滿帶失望神色的臉，悠悠垂下。\n\n琅兒在她平日裡飯菜下了手腳，以女帝的能力怎可能無法嘗出。\n\n只是無論是分身，還是本體，都沒有當一回事罷了。\n\n而瞧見女帝神色有所變幻的黃豐，又遞出一本古舊的書卷：“傳聞，數千年以來多少修士都前仆後繼尋找著一種名為天書的物件，此天書可能有著洞虛以外的飛升方法，小子有幸得過半本，又在機緣巧合下，得知了天書的奧秘。這書卷上所拓的，正就是那半本天書記錄的內容，其名為太初長河下訣，一種極強的功法，而這功法或許能解陛下兼修人道與仙道，又無法完美融合的難題。”\n\n女帝眼中閃過一絲驚訝，迅速騰出手，接書翻開。\n\n頁面唰唰劃過，上方文字在女帝眼中跳躍。\n\n雖然還未修煉此功，但女帝即便從拓本都能感受到其中深奧的氣息，只是待她翻到末尾，紅唇再啟時，聲線驟冷：“下半篇，而且還不全！朕怎麼知道它有沒有用？”\n\n黃豐笑道：“想必陛下睿目，亦能發現即便只有下半篇，依舊可解開人靈雙修的障礙。至於為何殘缺，無非是小子怕陛下，脫了褲子不認人而已。”\n\n女帝合上書，鳳眸下沉，目光銳利道：“有趣，天書內洞虛之上的功法，為了朕的身體，便獻給朕？”\n\n黃豐低頭不語，默認了。\n\n隨後，女帝盯著黃豐沉默良久，娓娓道：“如何證明功法有效？”\n\n黃豐心中一喜，道：“難道陛下沒看懂？”\n\n女帝鳳眸閃過狡黠，似乎看穿了他的心思，冷笑了聲：“身外化身之法，同氣連枝，只需朕雙身運轉心法，將天地間的龍靈之氣，互相交替共鳴納入體內，便是功法的玄妙之處。修煉此功後，雙身龍氣靈氣亦不再有進水不犯河水之意，彙聚為一氣，朕就能以此突破洞虛瓶頸的桎梏。”\n\n黃豐咧嘴笑道：“正是如此。”\n\n“道理是這麼個道理，不過……”女帝鳳眸一眯，身段前撲壓向前方盆沿，池水搖曳，敞開的傲乳，在金鏈勒環下軟軟貼向木盆，溢出旖旎媚態，道：“人道龍氣雖可離體，然離體後除了使用，便剩下度給別人的作用，短時間內，朕如何尋得別的龍氣，又如何交替同步吸納雙氣，來證明此功法？”\n\n黃豐瞧著大夏女帝搔首弄姿的模樣，褲襠難免一硬，但心急吃不了熱豆腐，慢慢道出一個方法：“辦法自然是有的，陛下可吸取我王兄的龍氣，而小子也願意與陛下雙修，以證明功法可行。”\n\n“呵呵呵呵呵。”\n\n聽聞言，女帝笑得嫣然，澡水中玫瑰花瓣飄漾，玉體浮白，然轉瞬她雍華豔容便是一變，板冷起來：“雙修？好大的口氣，就你那副小身骨也妄想與朕雙修，是你吸朕還是朕吸你啊。”\n\n黃豐未有絲毫擔憂，坦率攤開手：“就算給女帝吸幹，都值得。”\n\n說著，黃豐向前踏出一步，站在女帝身前，伸手挑起女帝下頜。\n\n出奇的是，這名養尊處優的女帝，只是鳳眸睨睨，卻沒有任何拒絕的意思，就這麼讓他端起了自己的美顏。\n\n黃豐再望著女帝風華絕代的容貌，道：“陛下，無論是分身還是你本體，其實都不過是一個人，何必裝下去呢？其實你早就很想要了不是嗎？”\n\n女帝鳳眉略挑，紅唇淺淺一笑：“有意思，說下去。”\n\n黃豐跟著道：“天下，權勢都是陛下的囊中之物，沒什麼是你得不到的，同樣沒什麼是你能得到的，那個位置太空虛了。十六年前，你奪位登基之時，為的是步曾經愛慕之人的目標吧？可你應該早已發現，自己做不到，因為神樹不會容許再一個蘇青山的出現，對吧。”\n\n聽到黃豐的話，女帝正式抬眸過去，凝向黃豐醜陋的臉容：“看來你從許攸那裡知道了不少當年的往事啊，只是朕很好奇他為什麼選擇了你。”\n\n黃豐搖了搖頭道：“不，陛下你錯了。許攸並沒有選擇了我，他選擇的人，是另外一個人。”\n\n接而，女帝眉眼蹙蹙：“誰？”\n\n再見黃豐撩著女帝下頜，半個身子坐在了盆沿，眼珠落在女帝浮在水面上的傲美雙乳，笑道：“這個名字，你應該很熟悉，他叫……蘇雲。”\n\n一時半霎，就在黃豐把蘇雲名字說出時，女帝忽撇過被撩起的豔容，直愣愣從水中站起，皓腕如游龍舞袖，抓起了黃豐衣領，遮罩掉週邊少琅觀望內室的手段後，怒詢道：“怎麼可能！”\n\n週邊跪坐觀戲的姬少琅忽然失了視野，心中的未知刺激，更是達到了巔峰，擼動下體的速度更為加快。\n\n而此刻內室裡，被掐住命脈的黃豐，倒沒半分恐懼之色，他伸手拍了拍女帝的手，示意著先讓她鬆開，否則半個字都不會從他嘴裡說出。\n\n見狀，思忖片刻後的女帝還是鬆開了手。\n\n黃豐得幸能喘口氣，然還是被女帝天子怒威喝得退了兩步，不過他很快便平復下氣機，暢然轉身，酣暢道：“蘇青山！許攸！十六年前的兩個人傑天驕，要是他們還沒死，那麼而今天下十四州，劍仙的稱號就不會落到上官玉合的手上，而你也成不了女帝，只會是一名天賦極佳的紅衣女修，最大可能是以你極致的鳳凰火，取代那名火域域主，成就洞虛。”\n\n女帝聽著，鳳眸冷冷，呵笑道：“黃豐，你未免小看了上官，哪怕青山還在人世，她也依舊會是劍仙。當年在我們幾人中，上官玉合的天賦是最高的，並不是蘇青山太強，而是當時候，不需要她拔劍罷了。”\n\n黃豐倒不成想到，上官玉合能在女帝口中得到如此大的讚譽。\n\n但對此，黃豐沒有反對。\n\n上官玉合的能力，他自己一清二楚，畢竟他能完全鎮住老禿奴的底牌如意，在那騷娘身上，居然堅持不了數個呼吸，足矣見得強悍。\n\n然女帝是什麼人呢，她可不是黃豐，無論人道還是仙道，雙重修為均走到境界巔峰的她，仍舊不失對上官玉合的肯定，說明這個女人雖然心底有傲氣，但對於上官玉合這個曾經和她搶一個男人的存在，多少還是認可的。\n\n只是認可歸認可，黃豐只管道出所有。\n\n要得到女帝，就得曉得這個豔婦，是什麼樣的女人。\n\n好比先說上官玉合，她冷豔迷人，孤高絕塵，外表就是一柄鋒利無比的冰劍，然而冰劍是會融化的，任她再冷再淩冽，內心還是有著軟肋與母性，母性是柔情，終究會讓她的劍為此軟化，被他人所執。\n\n而女帝呢？\n\n她和上官玉合一樣，擁有著全天下女子都仰慕的臉蛋，但卻有著相像又絕不相同的性格。\n\n早就入涼前，黃豐便通過歡喜寺得到了女帝的消息，她從小出生在四大世家之一的東方家，身世堪稱九州上層，故而在她絕色與優異天賦下，成長過程受到了無數吹捧和歆羨，所以與上官玉合那種孤冷內蓄的氣質截然相反。\n\n女帝完全就沉浸在這種極致的溢美海洋中，變為了一朵盛放，毫無收斂的野玫瑰。\n\n她本身傲然，盛氣淩人，只是在此基礎上，實則亦是她自卑之處，首先讓她發現自己並不是真正的天之驕子的人，是十數年前冠絕修行界的劍修，蘇青山。\n\n故而出於內心中，竟有人能媲美自己的東方嵐，對這位男性劍修，自然而然會生出愛慕之心。\n\n但同時，蘇青山身邊的上官玉合與之相比，更是絲毫不遜，最後她在與上官玉合爭鬥愛人過程中敗了，徹徹底底敗了。\n\n然而她敗給的不是上官玉合，而是那時自覺無能的自己。\n\n所以，哪怕蘇青山死後，東方家以與皇室聯姻之名，博取世家所需利益，要她嫁入姬室，本竭力反抗的她已經看開了。\n\n最終她甘願嫁入皇室，可人人以為只是一場平平無奇聯姻下，她東方嵐早已蛻變，篡奪帝位，索謀人道龍氣，什麼劍修蘇青山，劍仙上官玉合。\n\n天下，唯有她東方嵐，可隻手遮天。\n\n她無所不用其極地走到人間巔峰，為的不外乎再無人能比她更強，彼時權勢地位修為都走到至高無上存在的她，再不是東方家的大小姐，而是一代人皇！\n\n可得到一切，代價呢？\n\n其實就算成為天子，又有什麼好的，女帝回頭過來，身邊再無一個知心人，本體尚且還需守在地宮，十數年如一日地汲取龍氣，面對的僅有幽冷潮濕以及說不盡的寂寞。\n\n如此一位女帝，對沒錯，她很強她地位無人可以再媲美。\n\n但就像她化身所變現出的，她本體也是，外表的傲無非只是女帝保護自卑心的手段，所有她和上官玉合相仿。\n\n都是個身心不一的反差婊。\n\n試問這樣的人，其實最期待的，是什麼？\n\n黃豐遷思回慮過後，再度緩緩走向女帝，他矮小的身子在女帝鳳眸倒映中越來越近，越來越大。\n\n爾爾，黃豐當著女帝的面，撲棱笑道：“陛下反駁我的話，但獨獨沒有反駁對你自己的評價啊。”\n\n黃豐說罷。\n\n女帝鳳眉蹙蹙，稍稍偏頭：“如今的你，倒是狂妄。”\n\n黃豐雙手隨即撐在盆沿，以他這個姿勢，哪怕身子矮小瘦弱依故居於高位，眼神俯向了盆中沐浴的騷婦女帝，不恥笑道：“陛下，你做不到。你自以為成為九州共主，便能得到所有，可天地桎梏的情況，你非天命人，亦無法對此做出任何改變，所以你其實有暗自找尋天書，就是妄想一個人破開那層團團迷霧吧？”\n\n聽完黃豐的話，女帝妙體不由自主往後退，倆腿下意識夾緊，可澡水在紅腴潤穴門前，流動的感覺仍讓她感到絲絲局促。\n\n望著女帝反應，黃豐更是證明了內心中的想法：“但你做不到，不代表我不可以！”\n\n“天命人，為何在得知我是這個身份後，你變得無比重視，因為這是實現想法的關鍵，而且此次大比，女帝除了有將九州宗門擰成一股繩的心思外，還有試圖發掘境內年輕一輩，是否有被命格選中之人吧？”\n\n黃豐續道著，又伸手探了探池中水的溫度：“陛下，我可以幫你，成就一切。”\n\n話半，女帝華容淺笑盈盈，蔑然一笑：“好大的口氣。”\n\n“不是誇下海口！”黃豐迅速駁斥，既然取得了細微成功，他就必須把女帝氣焰完全壓下，連道：“而是我能做到，掌握天書者可掌歲月奧秘，天命人可握山河乾坤氣運，倘若我來到陛下的境界，你想想我會做什麼？”\n\n默然半響，女帝方才張開尊口：“做什麼？”\n\n黃豐瞧之冷冷笑了笑，道出從未說過的志向：“大開宴席，酒池肉林，攬陛下入懷，左腳踏劍仙，右腳踏仙宮宮主，肉奴無數，何不快哉。”\n\n噗哧——\n\n聽得黃豐的話，女帝轟然發笑，胸脯亂顫，掩唇道：“就這？就憑你？難道你以為自己那個地方大，全天下的美人都得想著你不成？”\n\n而後，黃豐毫無羞恥地解開衣衫褲頭帶，淡淡道：“難道不行？不過這也是最終的結果而已，但切實去說……”\n\n道著。\n\n黃豐倏地跳進澡盆中，激起浪花多多，本就不高的他，在女帝澡盆中甚至只能露出一個腦袋瓜。\n\n但恰恰就是這一個小小腦袋瓜，即將說出的話，反讓女帝刮目相看。\n\n只見黃豐身體在盆中遊動，接而邊吐水邊說道：“我想做的，只有八個字！”\n\n“成神之人，天下大同！到了那時候，什麼夏蠻夷，狗屁！！走到大道之巔，小子定當效當年蘇青山構想，設立仙盟，全天下修仙煉氣之人，均須奉我為尊，十四州萬里同風，只會有一個國度一個朝廷，它由我所保護，天下再無爭戈。當然了，天子之選唯有女帝你適合，只是在此之前，你亦不過是我的玩物而已。”\n\n好一個仙盟，好一個玩物。\n\n在話語聲吐出間，女帝於尋思中漸漸失神，而黃豐已逐漸攀上了一對軟彈飽翹的美乳，手指挑動乳尖紅玉，惹得女帝豔容置身失神，都不忘現出不少厭惡排斥神情。\n\n莞爾，女帝嘴角蔑地勾起，語氣傲慢：“妄想創辦仙盟，你夠格嗎？”\n\n說著說著，女帝話語聲稍顯出兩分急促。\n\n再見在她身前遊動的蠻族小鬼，整個人都趴在了她身上，女帝明顯能感覺到下腹處一根長棍，硬若烙鐵般懟著自己。\n\n可她沒有抵制，只慵懶地躺在澡水裡，倆手大方地攤在盆沿，仍由黃豐放肆蹂躪自己的肉體。\n\n即又見，黃豐手按女帝美肩，身下陽根順著其小腹，緩緩滑向她胸中溝壑，悠悠聳動，厚唇貼往女帝容前，不恥笑道：“小子說過了，女帝也很期待吧，期待自己騷屄再被小子肏，而且不是上一回淺嘗即止，是狠狠地肏，肏到你高潮不止，屄熱難奈！還有……”\n\n黃豐說著，再度把臉貼進女帝豔容，僅離半寸道：“陛下，天下早晚是你的，明面上你永遠會是女帝，但暗地裡，被一個你瞧不上的蠻子，然後瞞著全天下人成為我的肉奴，那種敗德辱行的舉止和心境，你其實會很享受吧。再想想您外面跪著的親兒子，被他看著我肏你的騷屄，是不是非常刺激，何必裝下去呢，你本就是個騷浪女婦，深宮多年的寂寞蕭索，讓小子將它填滿又如何不可為呢？”\n\n話間，女帝瓊鼻微吟，呼吸聲愈發急促。\n\n而就在話畢說完之時，遠看著她鳳眉開始擰立，黃豐卻是一下硬親往了女帝紅潤的唇峰。\n\n支支吾吾的呻吟，女帝在澡水中推搡撲起的水花，一具成熟至極的豐美酮體轉瞬被黃豐所佔據，小半刻前論及私密處，被女帝親自關閉的屏障開啟。\n\n於院外跪服的楚王姬少琅，眸中再次望及景象，可事態與半刻前已完全一變，她的母后，大夏女帝竟陷在澡水中，婀娜曼妙的身段撲上不下，被她雙臂所環繞交疊的黝黑身體，還有那張深深咬吸她豔容紅唇的醜臉，均是多麼觸目驚心。\n\n突如其來的畫面打擊，讓姬少琅內心都纏了顫。\n\n然待此刻間，母后高貴容顏側側徐來，冷瞥向自己的鳳眸，又充滿了嘲諷，姬少琅心裡率生出的委屈和悲憤，當即化為擼動自身陽根的動力\n\n可瞧見琅兒動作的女帝，眸中看不起人的神色，變得更為深邃。\n\n決然而起，便見她推開了前方啃食自己紅唇的黃豐，轉望著琅兒方向，旋即勾笑，柔夷並作夾起一瓶紅色藥液，挑開封口，抬起倒入自己檀口內，一飲而盡。\n\n紅液順唇峰落下，沁入喉間，流淌過唇角，滑向玉頸香肩，傲乳溝壑融入澡水。\n\n隨著極品火靈液入體，眨眼間女帝鳳體步步泛起紅暈，鳳眸媚意頓生：“來，臭小子，肏死妾身。”\n\n聽到母后的話，姬少琅瞳孔顯赫睜大，方才短暫態間裡，不知房間發生了什麼，但當下母后淫蕩本色盡顯的姿態，一個個疑問在面母被肏得目前犯中消弭。\n\n淫賤的母后，就這樣還做什麼女帝，真是個騷屄，活該被人肏死的想法，不停湧現在少琅腦海，他擼動陽根的速度快得出現了殘影，不至十餘下，一道清淡精元噴射到地面，如釋惋惜。\n\n可廂房之中。\n\n女帝喝下能觸發自身鳳凰火更為爆烈，浴火高漲，整個人變得如和春藥般媚態百出。\n\n而她身前的黃豐，可以說已盡然佔有了女帝，厚唇貼在女帝耳邊，不忘作弄吹氣：“享受被小子狠狠肏小騷屄的同時，陛下可以吸取我王兄的龍氣，和小子試著雙修那本功法。”\n\n繼而，在琅兒面前。\n\n女帝蔑地收回視線，豔容朝向黃豐，紅唇輕輕壓在了他的醜臉上，聲線酥麻：“那該怎麼吸啊，想做妾身主人的小冤家。”\n\n黃豐聽著，斜眼撇著姬少琅，陰聲笑著，手裡把玩傲乳道：“當然不能假戲真做。”\n\n女帝鳳眸隨即凝了凝，妄是反感又不想做了。\n\n接而黃豐一把摟住她的腰，陽根擱在鳳穴前摩擦道：“只用口。”\n\n“只用口？”\n\n“對，只用口！”\n\n話後，女帝紅唇玩味勾起，即再見另一邊廂被蠻族太子所摟抱，沉默良久的化身忽站起身，然後鳳眸低掃過蠻族太子黃威的褲襠，兩指揮出，劃破腰帶，露出根器。\n\n在姬少琅目前，自己母后堂堂女帝。\n\n本體與化身，兩房內分別被褻玩的場面，亮幕登場。\n\n一時間，望著兩處廂房內母后的動作，姬少琅都傻眼了。\n\n先論及黃威所處廂房內。\n\n就在裡面母后化身原本僵持著時，忽然的劃斷腰帶，驚人的舉動足矣讓所有人側目，甚至包括了蠻族太子烏木威爾，黃威本人。\n\n但望著豔美的女帝，起初咄咄逼人，面對著他滿眼不快時，又突逢冉冉半跪下的姿態，黃威身子肥重肉球都不免震了震，心中一片悸動：“喲，大夏皇帝這是想通了。”\n\n聽到黃威的話，女帝鳳眸有意無意掃了掃另一個廂房，的確是想通了，不過是另外一邊的本體，且想通的還不是一般的道。\n\n只是要應付黃威，顯然還不能讓他察覺到她自己的意圖。\n\n旋即，女帝鳳眸往上刮向黃威，淩盛十足：“有件事，朕還沒和你好好算算。”\n\n聞言後，黃威不解，什麼事？\n\n而未待他發問，女帝便把眼落在了黃威身下陽根宗筋上，當即鳳眸閃閃，好長的陽根，這規模和長度也就比隔壁那小子遜色一點了，而且這龜帽是怎麼回事，怎麼這般壯碩？\n\n隱隱，女帝豔容酡紅幾分，螓首稍低，瓊鼻忍不住深吸了口氣，一股濃烈野蠻的腥臭味撲面而來，她鳳眉跟著顰起，忍不住撇過臉作嘔：“好臭的髒東西，多久沒洗了。”\n\n黃威看著呵呵一笑：“天天玩汝大夏的少婦，哪來得及洗？”\n\n聽到他的話，女帝神色間顯然露出一點殺意，然為了驗證功法，她還是不得不把頭撇了回來，繼而嫌棄地伸起柔夷，抓住黃威陽根末端，前後套弄兩下，瞪眸出奇：“就是這根東西，將貞兒玩弄得棄蕭異不顧？”\n\n喃喃細語入耳。\n\n黃威眼神動盪，緩後又一笑：“原來大夏皇帝知道啊，你果然是個騷屄，沒錯！孤就是用它把女帝親妹肏得死去活來的，怎麼樣騷女帝，你要不要也試試？”\n\n黃威聽信弟弟黃豐的話，目前已完全把女帝當成了是一位淫君。\n\n且有其妹必有其姐，帝姬這麼騷，女帝也應該這麼騷。\n\n是這麼個道理。\n\n然而黃威話語聲落下後，女帝瓊鼻便忍不住發出一聲輕輕喘息，鳳眸作怪望向本體方向，再抬眸蔑笑：“想與朕合作，那還得看看你的本事，況且就憑你這麼一頭肥豬，就想要朕。”\n\n女帝的話永遠是得饒人處且絕不饒人的。\n\n無論從眼神還是神態，都對黃威露出鄙夷的女帝，一席話轟然有點觸及了黃威逆鱗的意思。\n\n不知是在被激怒還是身下尤物足夠勾人，黃威沒被擼動兩下的陽根，肉眼可見地便壯大起來，沒過一會，又引得女帝蔑笑：\n\n“瞧瞧，就這麼碰一碰便漲成這樣，看來你這頭肥豬也支持不了不多。”\n\n媽的，一而再再而三的嘲諷。\n\n黃威都快想罵娘了。\n\n然，就在他即將反駁回去時，身下岔腿蹲立的女帝，卻將自身不系褻衣的玉泉屄穴露了出來，上方水流潺潺的騷浪模樣，與她口中所說，顯然不是一碼事。\n\n不知女帝動欲原於另一處廂房的黃威，嘲著便用手抓住了女帝后腦，道：“騷女帝，嘴裡嫌棄，屄穴還不是在流水，想吃就直說，孤又不是不會給你。”\n\n“你！”\n\n被黃威抓得髻挽髮絲生疼的女帝，鳳眸上挑，可為了顧全另一邊的情況，她又不能對黃威做什麼。\n\n於是乎，女帝也難得和他計較。\n\n鳳眸再次落在了黃威陽根上，輕輕套弄，望著那龜帽冠溝的精泥污垢便一陣不齒入嘴，但這麼長的根器，再加上另一處房中的情況，要是一起玩弄的話……\n\n想著，女帝鳳眸白了黃威一眼，也罷，權當吃了根狗棒便是。\n\n黃威見狀望著女帝滿臉生厭，還以為她不會有什麼動作，需要自己強迫她就範時，面前女帝豔容卻緩緩靠向了他的陽根，雖然其狹長鳳眸中威喝不減，甚至有著一絲絲猶豫，可隨即很快便又被欲望和刺激所填滿，緩緩張開紅唇，化圓迎吻了上去。\n\n但是在入嘴間，黃威陽根沖天般的臭味仍就讓她忍不住蹙眉，頭往後仰去。\n\n眼見女帝脫嘴離去，身處院外目擊所有的姬少琅，望著黃威陽根龜頭上一道紅豔吻痕，心裡很不是一番滋味。\n\n可瞧著女帝都要給他自己吃陽具的黃威，又怎麼奈得住，要含不含的誘惑。\n\n旋即只見他把住女帝后腦的手臂，肌肉鼓地漲大，筋絡隆起，將女帝的臉硬生生拉了回來，然後陽根對著那張繞不過人的紅唇，猛地插了進去。\n\n化身久居深宮，擁有最多女帝本身欲求不滿的神念。\n\n遂在此靠近，貼進豔容前的陽根氣息還是不免讓她蹲立長腿顫了顫，廂房地面一度變得水跡遍佈，然而女帝豐腴之年，與上官玉合同為熟潤的美婦，就算被陽根的氣息惹得迷離，還是很快回過神來。\n\n但黃威被女帝的話激得血脈賁張，陽根茁壯的程度已經到了不可收拾的地步，再低頭俯視女帝那張風華絕代，又一臉欠肏的騷臉。\n\n他咧嘴一笑，賤兮兮就繼續用力繼續把住女帝的頭，道：“陛下這麼騷，肯定老饞我這根大陽根了吧，今日非得肏得你叫天天不應叫地地不靈為止！”\n\n可女帝聽到他的化，只是仰起頭，鳳眸直勾勾地盯著他，紅唇輕啟：\n\n“是麼，光耍嘴皮子可沒用。”\n\n然話音未落，黃威鼻間混著女帝身上玫香騷氣，雞巴更硬得疼得要炸開：“肏死你個騷浪貨。”\n\n說著烏木威爾咬著牙，肥手抓住女帝化身髮髻，在她鳳眸一抬間，身上龍氣威壓轟然壓下，一個勁將女帝的臉壓向自己的臭陽根。\n\n“唔姆????……”\n\n頓然，被陽根強行塞進嘴裡的女帝，噁心直上心頭，鳳眸稍稍低下，望著黃威那根臭東西在自己嘴裡進進出出，簡直難堪至極。\n\n爾可是堂堂大夏女帝，怎麼淪落到被一根陽根褻玩，不對，還是兩根！\n\n就這，還稱得上是女帝嗎？\n\n不過黃威倒被口得爽極低吼，陽具整根整根塞進她嘴裡，捅得女帝唇角流出口水，混著腥臭的味道滿屋子飄散，連帶那雙狹長淺金鳳眸都為此，被插得溢出眼淚。\n\n只是在另一間廂房內，情勢又宛然發生了逆轉。\n\n黃豐先一步把女帝順勢一拉，讓她整個人失去平衡，栽倒在盆沿，水花四濺，淋得了女帝那對傲乳不停晃蕩騷媚，本以為會順勢插入她的騷屄，共用極樂。\n\n未曾想，女帝反快速從身下伸過來柔夷，死死捂住了自己的屄穴，大有不給他褻玩的意思。\n\n接而女帝冷哼，紅唇勾起一抹嘲弄，鳳眸稍稍回撇：“遣朕化身伺候那肥豬，你當真捨得？”\n\n黃豐嘿嘿一笑，既然不能玩騷屄，那就張開在她豐臀白肉上遊移：“捨得當然是捨不得的，但為了陛下為了完全掌管天下，一人之上萬人之下，都是必要的，況且陛下不也很想要嗎？”\n\n聽著，女帝鳳眸玩味，道：“不要以為真能以下犯上，你不過是朕……的一具面首嗯……”\n\n然在女帝說話間隙，黃豐騎在女帝身後，陽根隔著她的手，就不斷往前捅著：“”陛下，你兒子那叭兒狗以春藥予小人，欲使小人奸汝，不就為了親睹陛下騷浪？事到如今又何必再說這些，未來的勢會如何都無所謂的，女帝只需知道這世上只有小子最愛你了。”\n\n愛我？\n\n女帝聞言，鳳眸一閃，瞥向院外跪伏的琅兒，瞧著自己親兒子雙膝著地，手指摩挲小陽根的模樣，心中冷笑回過來：“說是愛我，那為什麼你在劍閣做那種事，不要告訴朕，你就不想要上官？”\n\n黃豐笑了笑：“陛下和上官劍仙可不一樣，你有你的華貴，她有她的冷豔。”\n\n我和上官玉合不一樣？\n\n聽著，女帝心裡重複著黃豐的話，望向琅兒，也是。\n\n或許在這個天下，朕早就不是朕了，至少在這個人懷裡，自己能享受，又能暫時忘卻不少的煩惱。\n\n念想間，女帝美手隱隱鬆動，本體嘴沿感受著化身絳唇被抽動的酥麻感，在被體內火靈液帶動的浴火催促下，竟緩緩自己岔開了穴瓣。\n\n瞧見女帝這幅模樣，黃豐自然大喜，挺起陽根就把龜帽送到了屄口前。\n\n可就待黃豐剛把龜頭捅了一點進去，女帝便立馬控制著自己穴花瓣死死窟住了自己的陽根龜帽，夾得他是欲仙欲死。\n\n“陛下，您這是做甚？”\n\n繼而女帝目瞧著琅兒，微微回首鳳眸中媚意彌漫，酮體顫顫，穴門處熱流湧動，淫水盛放，紅豔絳唇隨之勾勒而起，聲色慵懶又帶著一絲挑釁道：“既然想玩弄朕，那何妨不再刺激些？”\n\n此話何意？\n\n黃豐腦海有些迷惑。\n\n只是頓然過後，便見女帝澡水裡粉膝往前一撞，直接將整個澡盆都給撞碎，不過即便澡盆破碎，緊跟著裡面的池水卻沒有奔湧而去，反而被女帝靈氣包裹，緩緩將黃豐和她本人給推了出來，化為了一張水床。\n\n在姬少琅視野中，母后鳳袍錦繡盡落，傲乳被金鏈勒得發紅發漲，玉戶大張，淫水滴滴答答，宛如春雨般敞落的淫態百出入眼。\n\n母后，你怎麼可以這樣。\n\n望著眼前光景的姬少琅，先是一愣，緩後手便更用力擼動自己的小陽根，口中念念有詞，表情都看不出是痛苦還是興奮了。\n\n你可是堂堂九州的女帝，怎麼可以變得這麼淫蕩騷賤！\n\n該死，不要肏母后，啊啊啊啊！！\n\n陣陣心音響落。\n\n然而他的心語又怎可能被女帝聽見，母子的親情在他獻媚向黃豐送藥的時候已然盡散，而今在女帝眼中的他，無外乎是十數年前為了奪位登基的籌碼，以及一個獻母的綠奴罷了。\n\n即刻。\n\n女帝浴火焚身，體內已被欲火如狂燒得滾燙，玉門內壁的名器穴道更是從沒有過地，熱得似熔爐般沸騰，穴瓣如似鳳嘴張合咬玩陽根龜帽，一切都再難自抑。\n\n但就在黃豐打算用力插入她騷穴的時候，卻見她橫手將黃豐推倒，然後整個人又以仰面姿態，雙雙倒在了水床上。\n\n這個姿勢，這個方向，足矣讓姬少琅親眼目睹著自己母后的騷屄是怎麼被蠻族人貫穿的。\n\n觸目過來的激情，姬少琅額面青筋暴起，此時的他已分不清自己是不是惱怒，只是一個勁擼動陽根，往前跪了數步：“不要母后，不要琅兒求求你，不要給他，不要！！”\n\n“不要？”能聽見琅兒聲音的女帝，紅唇卻是勾笑：“琅兒。”\n\n女帝的聲音帶有無上傲氣，此間有充滿了無數誘惑和絲絲嘲諷：“按照賭約，若琅兒不喜不是能喊停嗎？怎麼，如今母后的屄戶都要這蠻子肏了，你卻連個屁都不敢放？”\n\n姬少琅在院外緩緩聽著傳音跪在地上，當即牙關緊要，把頭低向貼面，他不敢抬頭，不敢直視母后那張高貴卻淫靡的面容，更不敢面對黃豐那根插入母后屄穴的陽根，彼此的交合處。\n\n少琅呼吸開始急促，心跳如擂鼓，想法既有憤怒和屈辱，又有一股無法言說的興奮在翻湧。\n\n他應該喊停的，不，是必須喊停。\n\n但，但是……\n\n把頭埋在地面的姬少琅，不知想到了什麼，竟默默偷笑起來。\n\n而女帝見他低頭像只龜一般縮起，冷哼一聲，鳳眸便轉向黃豐：“愣著做什麼？不是想肏朕嗎？”\n\n說話間，她悠悠故意抬高嗓音，語氣中滿是挑釁續道：“還是說，你怕了琅兒？”\n\n黃豐咧嘴一笑，露出幾分蠻族的粗野與狡黠。\n\n他怎麼會怕了這龜兒子？\n\n想著黃豐不再猶豫，一手翻前，揉著女帝大腿內側的滑膩肌膚，緩緩滑向那濕潤的穴口，指尖觸碰到穴瓣陰蒂瞬間。\n\n女帝身子頓時微顫，紅唇輕咬，發出一聲聲低吟，可她鳳眸卻始終盯著姬少琅，觀察他的反應。\n\n繼而在女帝的呻吟聲毫不掩飾響徹院落間，她故意放大聲音向外傳去：“琅兒，你不是喜歡看嗎？那就抬起頭來，瞧瞧你的母后，是怎麼被這低劣蠻人插的，看啊！！”\n\n無法違逆的天子之聲入耳，姬少琅肩膀猛終於眼眶泛紅的頭，嘴唇顫抖：“母后……請您三思……”\n\n他的聲音虛弱得如同蚊鳴，連他自己都不信自己還能阻止這一切。\n\n“三思？”女帝笑聲中滿是嘲諷，道：“呵呵。琅兒，你是真蠢還是裝傻？瞧瞧自己下身都硬成什麼樣了，還敢讓朕三思？”\n\n說著女帝美手彈指往前一揮，一道火焰化作的靈體，便站到了琅兒身前，長腿斜斜深處，輕輕踢向姬少琅的小陽根，鳳眸下瞥：“你的這根，當真不比上他。”\n\n姬少琅聞言羞恥得無地自容，可自己又無法否認母后的話。\n\n他的身體完全背叛了他的意志，他戀母，對此有著禁忌的興奮，但是期待這種禁忌違背了倫理，所以註定了自己無法真正得到母后，漸漸這段情，又如毒藥般侵蝕變為了想像，日日夜夜想像沒人能滿足的母后，哪一天會在自己面前被別人所佔有，將她變成一個騷貨。\n\n而瞧著少琅羞愧的模樣，女帝滿意地勾起唇角，靈體踩著琅兒的陽根，不停摩擦。\n\n本體卻緩緩坐起身，雪白的香肩和傲美乳峰在前，鳳眸回望黃豐，金瞳滿帶不屑道：“還不繼續，你個下等蠻子，有本事讓琅兒好好看看，他母后是怎麼被你玩弄的。”\n\n聞言。黃豐眼中閃過一絲狂熱。\n\n這個騷女帝，還真是霸道，但在自己的陽根面前，女人再怎麼霸道都是假的！\n\n爾後黃豐粗喘一聲，另一隻手大膽地攀上女帝的胸脯，狠狠揉捏傲乳，女帝被刺激得仰起頭，發出一聲高亢的呻吟，身體微微後仰，徹底放縱自己，鳳眸再度撇向琅兒。\n\n“琅兒，可要睜開眼看好了。”\n\n女帝酥麻的嗓音響起，姬少琅目抬前方，下身被靈體踩得又痛又爽，怒著不可置信向內裡母后，呐喊：“不，不要！！”\n\n然而，在聲聲嘶喊裡。\n\n“嗯噢噢噢！！”女帝紅唇化圓，發出一聲高亢哼吟，腰肢自發向下壓去，紅腴屄穴隨即被黃豐那粗長陽根塞滿，撕裂般的快感，讓她雙手爽得抬起，指尖伸進髮絲裡，呻吟聲連綿不絕呼出：“好大……嗯喔????他插得朕好深噢，美死朕了????????……”\n\n同時，女帝身下的黃豐也是爽得無比，女帝鳳穴名器，那陰道此刻熱得就像有烈焰包裹，這回插入又不再像上一次，一寸一寸的磨，在女帝毫無羞恥地放開所有尺度後，足夠讓黃豐一次深插填滿她的穴道，當他龜頭來到女帝宮口時，宮口如鳳嘴吸精噬陽，高潮不止軟肉痙攣的刺激，讓黃豐刺激得精關一陣脈動，幾乎差半刻就被炸出了陽元。\n\n但為何只是半刻？\n\n原因很簡單，就在黃豐遭受不住前，他很快便將姬少琅贈送，咬在嘴裡的溯元丹吞進肚子，極品丹藥入口即化，藥力轉眼便遍佈周身，他的肌膚頓時都充紅發紫起來。\n\n繼而女帝尚在享受穴道被填滿的舒適，可緩後她的鳳眉便皺了起來，鳳眸掃向身下：“怎麼會！！”\n\n“操，陛下您這屄真緊，夾得老子爽死了！”未待她反應過來，黃豐低吼著雙手揉捏女帝的雙臀，抽插屄穴動作變得粗暴且有力，如野獸般瘋狂宣洩欲望。\n\n“噢齁齁齁齁????????????，怎麼變大了，不行先停下，好漲，這樣不行，要漲死朕了！！！”女帝呻吟聲越來越高亢，鳳穴被填滿的充實感，讓她鳳眸徹底迷離，紅豔唇角甚至都淌出一絲涎水。\n\n呻吟間，她望向琅兒，又再次忍不住喘息：“琅兒……噢嗯嗯????????……要被插壞了，太長太粗太硬了，受不了，朕受不了了！！！”\n\n女帝的呻吟聲擊潰了姬少琅的防線，他該恨自己，恨自己竟然會在母后被玷污時感到興奮，可他無法開口喊停，被奪走喜愛之人的愉悅感已吞沒了他。\n\n黃豐察覺到姬少琅的眼淚，都不免哈哈大笑：“楚王殿下，瞧瞧你那一臉窩囊樣，怪不得陛下瞧不上你！”\n\n說著說著，他用力往上一頂，又是肏得女帝一聲浪叫，淫水四濺。\n\n女帝喘息著，美眸不禁翻白：“是嗯????……琅兒……你真是個廢物……連母后被肏都不敢阻止……還自己摸……自己的小陽根哈哈哈……”\n\n喘息聲誘魅但刺耳，直直刺進姬少琅的內心。\n\n內心那股屈辱與快感交織的滋味讓他幾乎崩潰。他幾乎想沖上去殺了黃豐，可他的下體被母后靈體踩著，壓根無法動彈，甚至被母后踩出陽精，在這淫靡的場景中陷入沉淪。\n\n只是同樣在沉淪欲望的人，又哪裡只有他呢？\n\n瞧得琅兒狀態後，女帝見狀滿意地哼了一聲，居然都已經開始主動抬起腰肢，迎合黃豐的抽插，騷穴情不自禁夾得更緊，淫水如泉湧般淌下，哼聲高亢：“黃豐……肏死朕????……讓琅兒好好看看……你是怎麼幹他母后的????????……”\n\n聽著女帝話語，黃豐興奮得雙眼發紅，他抓住女帝的腰，將她上身拉起，讓她面對著姬少琅，乳峰在空中晃蕩，陽根再狠狠抽插進去。\n\n被狠狠貫穿騷穴的女帝紅唇張開，已不知自己是什麼時候努力上下挺動豐臀，發騷得鼻間呻吟都在顫抖：“啊嗯????……琅兒……你看……母后的奶子……被他肏得亂晃……嗯噢????????你喜歡嗎？”\n\n話語聲入耳，被母后靈體踐踏陽根的姬少琅胯下又是一熱，泄了出來，其淚水模糊了視線，喉嚨有低沉嗚咽聲傳出。\n\n靈體此刻瞧著琅兒的精元玷污到自己身上後，鳳眸又是一陣鄙夷。\n\n廢物兒子，就你這能耐，怪不得母后會被他玩弄。\n\n而內裡廂房，黃豐的陽根還不停插進女帝熾熱穴戶裡，那種滋味和感受燙得他陽根發麻，屄穴內壁緊縮，裹住陽根吸吮不放的蠕動，更是刺激得要命命。\n\n在藥物催動下，黃豐尚且還能忍受女帝名器的榨取，但一味讓這個瞧不起自己的女人佔據主動，又怎麼可能是他的風格。\n\n很快，他的雙手便抓住女帝的腿彎，把她雙腿岔開，騷屄高高抬起。\n\n忽然改變的姿勢，讓陽根更加深地撞擊進女帝宮口位置。\n\n著此，女帝在望著廢物兒子看自己被肏時，鳳眸還是難以向下掃去，然這低頭一看，她內心心底竟無可奈何生出一股挫敗之意。\n\n只見她的美穴屄口已經被黃豐插得唇瓣翻開，陰蒂充情凸起，騷水順著臀縫潺潺淌下，交合間不斷被帶出片片黏膩的泡沫。\n\n自己怎麼變得這麼淫賤？\n\n明面是大夏女帝來著，可為什麼自己的屄穴會被區區一個蠻族小鬼，倆次肏得酥麻酸爽，其實即便是因為要得到功法，得到天書，破解桎梏，還是因為琅兒緣故，靈液的緣故，還是說刺激感作祟，她都只應該單純享受而已。\n\n可為什麼，自己的身體在吞咽，渴望這個蠻族小鬼。\n\n女帝想著想著，被抱起的玉柱長腿，忍不住便想夾緊，高潮潮吹之意無法避免出現。\n\n暫態，女帝鳳眉蹙起，筍足蜷縮著就用手翻後壓住黃豐小腹，皓齒咬著下唇，瞪向黃豐：“等下……別那麼快……朕嗯????……先慢點……朕要……不……不行了……哦哦哦哦????????你再這樣，朕就……殺……別那麼大力插朕的宮口，好痛……噢齁齁齁齁????????????要美死朕了……唔唔唔????????????！”\n\n享受著女帝欲拒還迎的動作，黃豐猖笑道：“陛下這騷屄真他媽極品，小子今日非肏得你噴滿一盆不可！”\n\n“嗯唔唔????????……不行了……怎麼這麼多廢話，別……嗯哦哦????????快肏進來來！”女帝咬著紅唇，聲音顫抖，鳳眸裡已滿是渴望，她豐臀不禁抬起，主動將騷屄裹住黃豐陽根，穴肉一縮一縮地模樣，簡直饞得像個欠操的婊子。\n\n“騷女帝！”對於征服這個女人，黃豐根本無法忍奈，聽著她的呻吟聲，陽根對準那濕漉漉穴逢，狠狠抽送插得她穴瓣一顫一顫湧出騷水：“陛下，你怎麼這麼騷！你不是很能嗎，一會說要一會說不要的！到底是要還是不要啊！！！”\n\n話音剛落，黃豐腰身猛地又是一挺，粗硬的陽根‘噗嗤’一聲，整根捅進女帝的騷屄裡，直頂到她花心宮宮深處。\n\n“啊噢齁齁齁齁????????……好長唔哦哦????????，要肏操死老娘了……噢齁齁齁????????????……”\n\n經此動作，女帝仰頭尖叫，身體猛地一抖又一抖，穴口緊緊裹住那根雞巴，宮口內仿佛有無數張小嘴忘我吸吮，汁水被擠得噴出來，濺在廂房地面上。\n\n如此深插得動作，女帝幾乎能感覺到體內陽根的每一寸形狀和表面隆起青筋的紋路，尤其是那龜頭硬邦邦地撞在她宮口頂最敏感的那塊軟肉上，更是肏得她屄心直顫，爽到眼角滲出淚花。\n\n“肏你媽的，這天子的騷屄怎麼忽然變得這麼緊，陛下你不會是要瀉身了吧，小子雞巴都快被夾斷了！”黃豐咬牙堅持罵道，雙手死死掐住女帝的臀肉，逐後每一下都捅得又深又狠，龜頭次次撞進她屄底，頂得她花心一縮一縮。\n\n面對黃豐的質問，女帝爽得尖叫連連，哪還顧得上回答，沒過一會瞧著陽根在自己騷屄裡進進出出，一圈圈白沫帶出，屄瓣被肏得翻開，一吸一放的狀態，就感覺到淫蕩得要命。\n\n又不到一會女帝鳳眸半閉，豔容上迷離，紅唇已被她咬得發白，腰肢扭得像條水蛇：“啊????……用力肏……肏深點……啊啊啊啊啊輕點，你要死了嗯嗯嗯????，朕的騷屄都要被你操爛了……哦齁齁????不要這樣……要被玩崩潰了好爽！！！”\n\n雙方動作也越來越猛，肉與肉的撞擊，芳華不過如此。\n\n片刻後黃豐又再俯下手，掐住她一顆變得硬凸而起的陰蒂，繞著豆豆打轉，搓得嘖嘖作響。\n\n不僅被深插，還被無情玩弄小豆豆的女帝，在雙重刺激被騷浪更甚，屄肉因此夾得更緊，騷水一股股噴出來，澆得兩人下身變得濕淋淋的。\n\n“操，陛下這騷屄會吸人，小子肏得爽死了！”黃豐抬頭獰笑，腰身猛地一沉，陽根龜頭死死頂著宮口軟肉碾磨，磨得女帝哼吟不停：“舒服了沒有，還要不要，要不要肏得更深，還想不想殺小子，哈？”\n\n聞言，女帝鳳眸閃過一絲不屑，然很快又在黃豐抽插顫動中轉化為陣陣媚態，豔容上的雍容華貴不再，逐而蕩然無存，她的雙手漸漸從抵壓，又主動地揉起了自己的傲乳，指甲摳進乳柔裡，捏出旖旎形狀，浪叫道：“啊????……又頂到朕花心了……噢要????……琅兒噢齁齁，母后要完了……他要肏死母后了……哦齁齁……好癢????????，不可以這樣……但嗯嗯插進來，快，朕還要……齁齁????????????美死了，要美死了????????????。”\n\n黃豐見她這副騷樣，抽插動作肏得更狠，腰身猛挺，陽根次次全根沒入，撞得得女帝屄口都紅腫了，穴戶一片狼藉不止，甚至其一邊肏還一邊罵：“騷屄，爽不爽？操得你屄翻天，看你還裝不裝高貴！”\n\n被靈液影響，被琅兒刺激到的女帝已經被黃豐肏得神智全無，在尖聲呻吟中，她的屄肉死死夾住黃豐的雞巴，挺翹瓊鼻鼻息喘得像條母狗：“爽……肏得朕爽死了……啊????……快點……朕要噴了????????……”\n\n黃豐還沒堅持，龜頭充血腫脹，他喘著粗氣，旋即察覺到女帝身段漸漸發軟無力後，忽地翻過身，抓著她的腰就讓她趴在水床上，豐臀高高撅起，低頭望著女帝騷屄被自己一縮一縮地淌水，淫蕩得要命，不禁獰笑：“陛下，你這騷屄小子還沒肏夠呢，讓小子再從後面肏翻吧！！”\n\n“你……嗯哼????……”被改變動作後女帝，下意識回頭瞪了他一眼，鳳眸起初還有著埋怨，可很快就讓體內的舒適轉變為了媚意：“啊啊啊????……輕點你真要把朕當成母狗來肏啊????????????！嗯噢噢噢齁齁齁齁齁????????????????！！”\n\n然她話沒說完，黃豐猛地一挺腰，陽根就從後面狠狠捅進她騷屄，頂得她身體痙攣不止。\n\n女帝花心宮口再遭襲擊，當即整個人又浪叫連連，豔容一臉興奮埋在水床上，身體忘我地抖得像個篩子：“那繼續……不要停快點……爽死朕了????，琅兒別看母后了，母后如今太美了，已經完全受不了嗯齁齁齁哦哦哦????????????快瀉了，朕要瀉了????????????！！”\n\n聞言黃豐加速狂肏，陽根在騷屄裡進出得如有殘影，水聲噗嗤噗嗤於交合處響個不停：“騷屄，就把你當成母狗來肏又怎麼了，是不是想瀉！來叫兩聲聽聽！！”\n\n話落，女帝身體僵了僵，隨即劇烈顫抖一股騷水從陰道深處噴出，澆得黃豐陽根熱乎乎的，紅唇呵氣：“嗯嗯????……”\n\n然而，黃豐這時候肯定不是要聽這些，說著他就把陽根大力往後抽出，緩緩道：“陛下應該聽得懂小子得話吧，是不是很想要，小子是不是肏得你爽死了，爽得像條母狗一樣跪在這裡被小子肏！叫兩聲犬吠聽聽，小子就射給你，想必，你應該很久沒體驗過被灌精的滋味了吧？說不說！肏死你個騷陛下！！”\n\n黃豐低吼著，在女帝屄裡猛插幾下，又大力抽出，然後在女帝不哼出一聲，就不進去，找起了不快。\n\n已經被爽翻天的女帝，又望著另一間房中化身快口出精元的本體，實際此刻是感受著雙倍的刺激，仿佛就是同時被插穴和深喉插弄。\n\n但！！\n\n堂堂大夏女帝，焉能學狗叫？\n\n自己可是……\n\n莫名地，跪在水床上的女帝屄穴就為此湧出一泉熱浪，而再望向琅兒時，更是忍不住夾緊了腿畔，不過她還是緊緊咬住了紅唇，只顧呻吟，絕不依著身後蠻族小鬼的來。\n\n她還是大夏女帝，上位者的尊嚴，豈能讓她低頭？\n\n只是隨著黃豐猛的抽回陽根，手掌在她豐臀上啪啪啪扇動紅印時，女帝忍不住就從咬唇，變為了叼住散落在水床上的鳳袍，接而看著琅兒，臀峰向後對著那根欺辱自己的大陽根，徐徐又送了進去後，豔容泛動超越：“嗯齁齁嗚……嗯汪????。”\n\n突如其來的一聲。\n\n姬少琅在這一幕下，心如死灰地癱坐下去。\n\n他的母后，大夏臣民的信仰，可見地已經被一個蠻子所完全玷污，那個坐於廟堂之上的華豔女帝，那個威嚴一度讓天下人不可違逆，如今沉淪在肉愛之中的容顏，無比陌生。\n\n但當女帝如母狗汪叫的聲音，錯落在房中時，她身後急速聳動的黃豐倒是格外狂喜，興奮的摟住她的腰肢，整個人騎在了女帝身上。\n\n高挑的曼妙身段與矮小低劣的蠻子，交合的模樣，在姬少琅眼裡實在過於震撼，恐怕沒有人能夠想像，絕代風姿的女帝竟然會和一名相貌極為醜陋的蠻子，勾搭到一起，甚至發生如此淫蕩的場面。\n\n母后，你知道嗎？\n\n如今的你真的像極了一條忘記所有，腦子只記得肏屄的母犬！\n\n姬少琅亢奮到了極致，被羞辱的小陽根冒出不少精韁。\n\n而黃豐的陽根在他面前還在不停猛頂女帝宮口，女帝被肏得聲音也越發騷媚，宮口鳳嘴把黃豐龜帽吸得越來越緊，一股股熱流滾燙灑在黃豐龜頭，內壁緊縮痙攣的感官，告知著她，自己已經來到了瀉身的邊緣。\n\n然名器瀉身，浴火大動的情況下，女帝宮口鳳嘴正毫無遮攔地向黃豐敞開著大門，甚至與女帝十分清楚自身名器的效果，在這種情況下，要是被黃豐把精漿射進宮口，自己不說可能再也忘不了那種滋味。\n\n甚至，不設防的宮口。\n\n況且此時距離她上次葵水才過去了不到七天，這個時候被蠻子精子灌進陰道宮口，堂堂大夏女帝還有大概率懷上蠻族的血脈。\n\n要不要阻止黃豐？\n\n這種想法出現在女帝腦海，可她被肏得紅霞遍佈的豔容，時不時翻起迷離鳳眸，和化圓張開的烈焰紅唇，都說明了其無法忍耐快感，感受著黃豐龜頭撞擊在自己宮口的脈動，女帝明白他也到了邊緣。\n\n要不要和上次一樣先抽出陽根，讓他射在體外？\n\n女帝在快感的邊緣掙扎著，繼而在黃豐一發入魂般的深懟向自己宮口時，爽得鳳眸直愣愣睜開，視線再次落到自己兒子身上。\n\n前方禁忌和背德的反差，屄穴內黃豐陽根的抽動，漸漸。\n\n女帝鳳眸含春，紅唇勾勒淺笑，以一種失神般癡迷的姿態朝向琅兒：“母后要被身後的臭蠻子灌精了，回不去了！”\n\n不！！\n\n姬少琅擼動陽根，瘋狂搖頭。\n\n只是黃豐已經來到了一發不可收拾的地步，他的陽根數次深插，都死死頂撞到了女帝宮口上，不停喘息：“陛下，小人要射了！”\n\n“啊????             for (; i < end; i++) {
                const li = document.createElement('li');
                li.className = 'toc-item';
                const a = document.createElement('a');
                a.innerText = t(bookData.chapters[i].title);
                const idx = i;
                a.onclick = () => showChapter(idx);
                li.appendChild(a);
                list.appendChild(li);
            }
            if (i < total) setTimeout(renderMore, 0);
            else document.getElementById('loading-overlay').style.display = 'none';
        }
        renderMore();
    }

    function showChapter(idx) {
        currentIdx = idx;
        document.getElementById('chapter-title').innerText = t(bookData.chapters[idx].title);
        document.getElementById('chapter-content').innerText = t(bookData.chapters[idx].content);
        
        const isFirst = idx === 0;
        const isLast = idx === bookData.chapters.length - 1;
        document.getElementById('prev-btn').disabled = document.getElementById('prev-bot').disabled = isFirst;
        document.getElementById('next-btn').disabled = document.getElementById('next-bot').disabled = isLast;

        document.getElementById('view-toc').classList.remove('active');
        document.getElementById('view-chapter').classList.add('active');
        document.getElementById('main-nav').classList.add('active');
        window.scrollTo(0, 0);
    }

    function showTOC() {
        document.getElementById('view-toc').classList.add('active');
        document.getElementById('view-chapter').classList.remove('active');
        document.getElementById('main-nav').classList.remove('active');
        window.scrollTo(0, 0);
    }

    function prevChapter() { if (currentIdx > 0) showChapter(currentIdx - 1); }
    function nextChapter() { if (currentIdx < bookData.chapters.length - 1) showChapter(currentIdx + 1); }

    window.onload = () => setTimeout(init, 300);
</script>
</body>
</html>
