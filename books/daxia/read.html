給掀了開來吧。\n\n引磬在搖動，上官玉合嘴裡念叨著雲兒的名字，靈氣一波接著一波從城隍廟宣發到外界。\n\n而黃豐的黝黑粗糙的手，則從她的小腿漸漸滑向瑩潤的腿間，一根粗長的玉如意由銀金鏈裹縛，深深插在了屄穴中，粉白無毛的穴肉擠壓著如意，一線蜜縫外的蓮唇潤物無聲，仿能察見其不時地收縮痙攣，從夾雜的漏縫處流出絲絲泉液。\n\n黃豐一時沒有著急將如意拔出，反是用兩拇指按在了兩側穴肉旁，接著慢慢地慢慢地往外拉開唇瓣。\n\n經此，上官玉合的身體緊跟顫抖了下，踩在地面上的白玉高跟可見地蹬了蹬，內裡的藕趾用力擠壓，蜷縮成羞媚模樣。\n\n黃豐還是頭遭，在上官玉合沒有經過媚藥困擾，在清醒的狀態下，看清了這位傲絕天下劍仙，誘人的生殖美穴。\n\n一切入目，都是多麼的完美。\n\n即便已為人婦人母，劍仙屄穴內裡依舊粉嫩。\n\n黃豐從手裡傳來的細微觸感，就能明確得知到這穴裡軟肉該有多軟柔糯彈，僅僅是窺探不足幾寸的穴道，那壁道中飽滿的肉粒以及層層環繞的褶皺，便已給人無限遐想。\n\n怪不得上回，他不過小小往內插進少許，便已繳了械。\n\n想天下無論何人，插進如此寶穴，都怕是會在摩擦的片刻，就會被這穴肉美粒收縮夾緊後，交出精元吧。\n\n“夫人念響名諱的同時，還要配合好引磬奏動，否則可會事半功倍哦。”黃豐不緊不慢欣賞著面前劍仙的無毛美鮑，說道著手指挑開抵束在玉如意末端的銀金鏈。\n\n霎時。\n\n粗長的如意就被劍仙狹緊的穴肉，推出大半，往內因插在裡頭甚長時間，導致潮起過而流滯的淫液遭此流出大半，一汩接著一汩蔓延腿畔，淌落到地面之上。\n\n上官玉合喊著雲兒的聲音，都為此激靈顫抖不少。\n\n可為了讓雲兒游魂能返回，她又不能停下，只能往後死死刮了眼身後的小鬼，那目光很明顯，要是黃豐動作有什麼過線的舉措，她一定……一定不會饒恕他！\n\n但黃豐什麼人，牡丹花下死做鬼也風流，怎麼可能被劍仙狠狠瞪了眼就嚇到。\n\n緩後黃豐的手便把住了玉如意，接著慢慢吞吞將它拔了出來，席間還不忘調侃道：“九州第一劍仙，呵呵。夫人你說，要是讓蘇雲瞧見你騷穴的這幅場景，會有什麼想法？”\n\n上官玉合完全不想搭理他的話，只是叫魂時，明珠皓齒緊咬住了紅豔下唇，神色愈發變得媚態百出。\n\n而黃豐顯然不想如此輕鬆放過這位冷豔無雙的劍仙，手拔如意的動作，有多緩慢要多緩慢，偶爾還要偷偷再往裡插動幾下，再接著往外拔。\n\n騰不出手阻攔的上官玉合，穴中肉壁自發吸吮著如意，再被如意剮蹭環環皺褶，快感堆積而至，屄液橫流。\n\n“真是熟美潤穴。”\n\n黃豐感慨著，手還不忘按在上官玉合滿月臀上，揉搓成各種破壞美感的形狀。\n\n對此，上官玉合則只能再隨他發難，一方面她也阻喝不了黃豐，便只好將視線收回，瞧了瞧安然躺睡的雲兒後，亦跟著闔起眼，嘴裡不斷念道著雲兒的魂，祈禱能夠快些回來。\n\n可是一步的退縮，往往迎來的就是停不下的卻步，以及敵人不止的攻伐。\n\n沒過會，黃豐觀察到上官玉合動靜，嘴角邪氣勾起，未再折磨著上官玉合，反而很是痛快地將如意霎地拔了出來。\n\n一路以來堵插在屄穴的如意，與穴肉分離後，當下淫媚地發出‘啵唧’一聲。\n\n隨之聲起，娘親的穴唇蓮瓣非但沒有因被插了很久的時間，而變得無法收攏，反是以肉眼可見的徐緩速度慢慢收縮起來，重回一線美鮑的模樣，又漫布水光，熟潤無比。\n\n見狀，黃豐難免嘖嘖稱奇，心裡又不停暗道果然。\n\n上官玉合的騷屄必是世間名器。\n\n而且觀之形狀模樣，恐怕還是位居名器之巔的絕品，落葵神闕。\n\n相傳這名器具備世間所有名器的奇異效果，外觀如似白玉觀音，密不透風，肉壁便有九環玉壺，環環疊藏，而每一環的肉褶都自帶敏感點，動欲時瀉身便相似金城湯池潮噴之狀，甚至在行男女之事時。\n\n這名器還會隨女子心態的轉變，讓插入者會感到或寒或炙熱，時刻有冰魄寒酥與鸞鳳凰吟，雙方冷熱交替的感受。\n\n至於還有的，便就是落葵神闕最大的特點。\n\n簡俗說就是遇強則強，遇弱則弱，如此名器會如洛神逢春的名器般，記住插入者的形狀，只是洛神名器會根據第一個插入者的形狀，有徹底只認一個主人的奇效。\n\n落葵神闕卻不同。\n\n落葵神闕就像一知性又懂得諒解人的美婦，她會記得的，是上一任插入者的形狀，但又不會拒絕繼任者的到來，一旦形狀被覆蓋後，且如果是超越了前任的強硬形狀，便難以避免地不會再對前任使用者，產生任何欲望。\n\n但它的特點還是要在於神闕二字，神闕為宮口，可開可閉，全隨女子心願。\n\n所謂神闕一開，稱君為主。\n\n所以名器之巔的絕品，難能可貴的就是在於，你需經過類似其餘名器的九九八十一難，方有可能在房事中，觸動神闕，再讓女子欲動情迷，難以自拔地敞開神闕，認主稱尊。\n\n故而如此名器在前，黃豐怎可能就此輕易放過？\n\n不說上官玉合因如意離體，拿著引磬和抓主蘇 後，深深往內伸了進去，粗糙的舌苔如入天池聖地，直抵那處奇異位置，然後向上微微用力地劃圓挑弄。\n\n黃豐覺得，若還是繼續用手指扣，上官玉合也許會用過人的神志強行撐過去。\n\n可突然抽出手又變成一條濕濕滑滑，但苔面又粗糙得很的舌頭，兩種別樣不同的感受當場就讓她身子軟成一灘水般，就差點要趴在了雲兒身上了。\n\n上官玉合碩滿的胸乳，隔著衣衫都能見到兩點挺立，神闕寶穴立而湧出陣陣汁水。\n\n“雲兒嗯哼????……不行，你快停……嗯唔……停下！”\n\n很明顯，被舔舐到那獨特地帶後的上官玉合，欲望瞬間變得高漲無比起來，只是說出口的勸阻，落在黃豐耳裡，只會變成催情作用的聲音。\n\n相繼，黃豐更是過分地將屄穴裡能夠舔動的地帶，都舔舐了一遍，還一邊用手磨她的陰蒂，一邊又用手大力扇在了肉臀側沿，破聲道：“騷屄……嗦嗦夫人的屄怎麼這麼淫賤，冒出這麼多汁水，你夫君知道嗎？你孩兒知道嗎？真是個騷貨！”\n\n上官玉合白軟光滑的肉臀，泛著清晰通紅的巴掌印，多年的歲月沒有在她身體上留下絲毫痕跡，相反還將她的氣質拔熟到驚人的程度。\n\n她張口高哼出了一聲，在黃豐的話語聲中，終軟下全身倒在了雲兒身上，其跨下穴戶泥濘浸潤甘甜汁液，這種丟身的感覺足矣讓潮汐體質的她，變得穴竅大開。\n\n上官玉合原本冷冽的劍眸，側盼著雲兒昏睡的形樣神色，都不知地帶上了多少數不清的嫵媚迷離。\n\n然蘇雲的魂，還在若木裡與許攸對峙，又哪來得及回應？\n\n黃豐不撤口，上官玉合便只能一次次承受，再一次次挺起身，望著雲兒搖動引磬，試圖喚回自己的孩兒。\n\n十幾年了，這處寶地再次迎來了雄性的滋味。\n\n曾經風光無倆，能一劍破萬軍，能一劍蕩天門的上官玉合，天下人見之無不望而生畏，然劍仙一襲樸素莊重劍袍底下，掩藏的身段又是極為反差的。\n\n黃豐品嘗著劍仙屄穴的滋味，手指還不時搓揉著劍仙的陰蒂，偶爾輕輕上下挑動，偶爾又微微用力捏上一捏，上官玉合鼻腔中的哼吟聲都會隨之便重，兩條軟軟的大腿甚至還會情不自禁攏緊，將他的頭死死夾在中間。\n\n口含軟玉，黃豐接而又將她整個人翻了過來。\n\n倒伏正躺在蘇雲身上的上官玉合，似不願見到這一幕，就只好手搖著法器，察了眼怒目神像後，又閉起來。\n\n雲兒，你快回來吧。\n\n娘親快要堅持不住了。\n\n潮汐體質驚世駭俗，能令人全身竅穴隨時打開，溝通天地靈氣，故而也會讓上官玉合對名器的感官變得更敏銳，而潮汐體質一般還有著兩種方式開啟。\n\n其一，以人的神庭為主，聯動全身竅穴，冥想時修為功效大增。\n\n另一種，則是女子情動時，靈氣經絡便會改變，以會陰處至神闕處的竅穴，作為中樞，自化小天地，法則變幻無雙。\n\n所以潮汐體質也算得上，一等一的爐鼎體質，只是潮汐體質之人一般也都是修煉天嬌，沒有人會不討趣地試圖去將她變成爐鼎。\n\n但目前的黃豐，肯定是沒有這個顧及的。\n\n上官玉合清冷絕顏，眼見地染上絲絲紅緋，被擺弄作這副任由舔舐的她，仍嘗試著抵抗侵蝕，兩條長腿平鋪在地面上，倍感蒼涼。\n\n“夫人，怎麼聲音越來越小了，是不是被舔的很舒服，都快說不出話了？”\n\n上官玉合沒有理睬，倒握在雲兒胸膛上的手更為緊了些，嘴裡念叨的蘇雲二字，從字帶哼吟，漸漸變成了哼吟蓋過了字。\n\n儘管不回答，都足以明白，這位九州第一劍仙在面對著什麼。\n\n黃豐在屄穴中的穿行愈發因為潤滑變得毫無阻礙可言，即便她劍道無雙，但她的身子真可謂天生淫蕩，隨著黃豐一次又一次的調戲，屄穴變得癢癢的，渴望的，直至她的長腿都從平躺，慢慢勾起岔開，分迎兩側。\n\n如果說一個女性一生中最美的階段是什麼，無疑就是正躺在男人的胯下，兩腿岔開雌墮，迎接著男人的征伐，因為這個姿勢往往意味著，在這個時刻，她不再是什麼高高在上的劍仙，不再是誰的娘親，唯一的意義就只剩下了接受，接受一切，成為受種的工具。\n\n這是上官玉合情動嗎，顯然不是，這是上官玉合被舔到無法收拾嗎，顯然不是。\n\n她只是短暫回歸到了人族的天性，蓋因沒有人去拯救，也沒有人將她從徐徐墮落的深淵給拉回來。\n\n芳華即逝，不過如此。\n\n黃豐卻不會單就此繞過這名冷豔的熟婦，偶而舔舐，偶爾又繼續會用沾滿了上官玉合流露出來淫液的手指，再度插進劍仙的屄穴。\n\n在這個地位下，他的手指更能輕易地去挑動上官玉合，那個能讓欲望高漲暴增的位置。\n\n指腹挖扣神闕敏感點，動作是越來越大，又越來越快，就連上官玉合的腰肢都伊始迎迎呼應起來，騷媚的汁水間或便會噴濺出一片又一片。協同帶著劍仙衣襟下兩團傲人雙峰，都從貼身服飾中頭跑出來，誘人的蓓蕾生長的白肉山巒之巔，隨著手指扣動的幅度，而輕輕剮蹭著衣袂邊緣，豐滿的乳肉蕩起的肉浪起起伏伏不斷。\n\n驟然，上官玉合忽覺鬢髮被人從臉側挑起到耳畔，她難免地展開些許眼隙，然眼前驀現出的可憎黝黑面容，又使得她黛眉瞬間蹙起。\n\n能夠遭受的快意有多少，面前黃豐的嘴臉便又多猙獰。\n\n“劍仙是不是快受不了了？其實你完全可以叫出來，蘇雲也聽不見。”\n\n聽到黃豐提及雲兒，上官玉合稍泛媚絲的眼神，露出不少清靈，微往雲兒方向看去，又充滿了慈愛，沒事的，待一切過去後，都會沒事的。\n\n但黃豐可不想看到這種母慈子孝的場面。\n\n就待上官玉合似度過心理難關之時，黃豐插進屄穴的手指陡然發力，在神秘地帶的指腹便往手重重一扣。\n\n原本還想繼續搖動引磬，嘗試繼續叫喚雲兒魂魄的上官玉合，半啟的絳唇檀舌未能發聲，反化圓張開，吐氣如蘭，一雙劍眸轉閉，皮下的瞳孔恍若震盪，愈翻又翻。\n\n經過小半個時辰，不停叩動神闕，上官玉合還是含恨迎來了一次史無前例的高潮。\n\n無毛的一線寶穴唇瓣大敞，有若銀河倒掛的潮起潮落，類如水柱般一瀉千里的潮水，汩湧噴濺而出，荒廢的城隍廟空氣中隨機彌漫起數不清的水珠，旖旎熟媚的母婦芳香交替綿密遞增。\n\n如果雲兒此時能睜開眼，就能看見自己的娘親，正躺在自己身上，握著引磬的手已然往了搖曳，另一隻手則死死捂著自己的嘴巴，仿佛在拼命地忍耐著什麼。\n\n而其曼妙腰肢則緊繃弓起，離地半寸，兩條欣長美腿在空中痙攣似顫抖著，穿在她腳上的白玉高跟，一隻掉落在了地面上，一隻半勾在了雪白的足背上。\n\n欲墜不墜的原因，還是在於娘親誇張地繃直住了腳面，一顆顆精美姣潤的藕趾恰好地吊住了高跟。\n\n上官玉合在沒有刮骨柔情作用下，都還會如此敏感的程度，顯然也震驚了黃豐。\n\n欣賞著眼前幾乎昏厥過去的劍仙夫人，黃豐就猶如在品鑒著一具經過他手，無暇打造過後的奢飾品。\n\n不僅如此，黃豐忽地一笑。\n\n仿佛想出了什麼惡趣味般，似乎覺得還可以再給這個本質淫蕩，外面高傲孤冷的騷貨，再上一劑猛藥。\n\n在上官玉合朦朧含霧視野裡，模模糊糊的黃豐身影，直似在解開他的腰帶。\n\n然而她卻因為一時的瀉力，而無法抽動身子，就這麼眼睜睜的看著他掏出了自己的巨龍，然後捧起了兩隻輪廓足矣讓世上詩篇，都難以敘述出的玉足，交雜起了一根長達九寸的陽具。\n\n雪白得纖塵不染的玉足，頓時與黝黑長桀的陽具貼合，軟嫩的足心仿佛成為了完美的腔室，將陽具的前端盡數包裹起來，醺臭的味道蕩漾在鼻間，燙人的溫度從足心肌膚蔓延周身，甚至一定程度超越了方才的指扣神闕，所帶來的褻瀆加溫。\n\n上官玉合想反抗，然而屄穴腔道內因為瀉意而高漲，連綿持續不斷地穴道痙攣仍在瘋狂侵擾著她的心神。\n\n女子最羞人之處，莫過於足。\n\n黃豐甚至還不止是在用她的足，來磨動自己的陽具，甚至還會捧起一隻，張口含住粒粒腳趾，用她那條狡猾黏臭的舌頭，時而往內吸吮，時而攪拌劃過藕趾間的每一個縫隙，就像在品嘗著世間無上的珍饈。\n\n陷在高潮中的上官玉合，清冷豔容更是升起片片暈霞，這種暈霞與之前的欲動不同，反是一種道不明的羞恥，但更讓她內心感到的則是一種鄙夷。\n\n或許只有這種化外之人，低俗的蠻子才會有如斯奇葩的癖好吧。\n\n可……\n\n上官玉合感受著另一隻腳上傳來的陽具大小以及硬度，一時間眉心都似跳了跳，上次是用手，這次是用腳，而無論哪一次接觸，這個蠻族小鬼的陽器，都還是會令她感覺到震驚。\n\n娘親的背部躺在雲兒身上，依稀也能感受到雲兒某處的輪廓。\n\n只是……\n\n一絲悠悠的歎息仿佛從上官玉合瓊鼻溜出，是感歎，亦是可歎。\n\n怎就比不過呢？\n\n然而就在胡思亂想之際，身下雲兒心跳的顫動卻讓上官玉合抖地驚了驚，神念一動，潮汐作收，浩瀚的靈識逐法強行壓制起所有背德不軌不願的感受。\n\n她張開清冷的劍眸，鎖向前方醜惡的嘴臉。\n\n同一刻，陣陣股股的白濁濃精從黃豐陽具中迸射而出，不少流在上官玉合美足藕趾各種交匯處，蘸濕了雪嫩白軟的足面與清憐的腳背。\n\n亦有不少噴射到空中，散落各處，就在不少滴都快踐射到劍仙玉容上時，上官玉合生起的一層靈氣屏障卻擋在面前，白濁陽精滑落在貼著面容肌膚的屏障之上，濃烈巨腥的味道灌湧在她的鼻間。\n\n上官玉合抖地立起長眉，冷喝了一聲：“滾開！”\n\n完事的黃豐自是一笑，他也知道，蘇雲的魂回來了，也是快醒了。\n\n只是這服藥，得再熬點時間，他最後舔了下劍仙雪嫩嫩的足心，笑了笑拖延著時間，道：“怎麼，夫人爽過之後，就忘了恩人了？”\n\n言說之際，雲兒手指猶然一動，更是讓上官玉合心驚。\n\n當下便收了下腿，狠狠踢向黃豐胸膛，將他整個人悶哼踹飛出去，倒落在城隍廟外的黃豐口嘔鮮血，身形隨漸漸幻化出曹少悲的模樣，烏滾眼珠則死死盯在上官玉合身上。"}, {"title": "第三章：上官玉合3", "content": "涼州城大比會場中，赫然有著兩名九州第一劍仙，兩名清淨山劍閣宗主上官玉合，當然了，一名是裴皖易容成的上官玉合，至於另外一名，自然也就是被綁在凳椅上，兩腿岔開，陰阜外露的冷豔美婦了。\n\n淡黃色的燈火，溫軟白皙的身段，兩腿岔開的玉人，口含珠球，臉蒙紗巾遮掩眼眸，在房門被打開的間隙，玉人兩腿忽地夾了起來，儼是想把嬌羞地帶處，被震動極樂棒搗弄得水流汩汩的景色，給遮掩起來。\n\n可即便她動作再快也好，那張素若神女的清冷絕容上，泛著的紅霞還是將自己所有感受，給說了出來。\n\n黃豐淡笑聽著，然放在劍仙肩上的手，卻遽然將撩起了她的衣領。\n\n在被黃豐放置褻玩了大半天時間，上官玉合渾身疲軟，肌膚上幾乎都沁滿了香汗，如今被人撩開窺探雪山，更尋得雪山之巔，因欲翹立的蓓蕾嫵媚誘人。\n\n只是順著她衣襟漸漸往下劃動的手，卻讓她皺緊了眉峰。\n\n上官玉合話說著，已把手伸進她胸襟裡的黃豐，手指掐住她的乳尖便是一捏。\n\n登時，上官玉合的話語就像被黃豐掐住了似的，那被劍閣墨白袍裙包裹的高聳雪山本就被黃豐揉搓得不是樣子，到此刻，於雪山巔峰上的兩點殷紅蓓蕾，更像是被人捏得柔嫩出汁。\n\n隨著此狀，上官玉合胯下綁在凳腳上的雙腿又都難免地夾緊起來，在說話間，被她玩弄胸乳，變得濕潤極致的白嫩無絨屄戶，妄是一個勁地向外潤出汩汩春水。\n\n意識到體質被挑動的上官玉合，只好將心神更多地放在靈臺上鎮守。\n\n可說歸說，想歸想，有時候上官玉合自己真的想拋棄這身該死的體質，即便它能夠帶給自己修行上更多的便利，然在遭遇房事的時候，總是無法避免地更容易丟盔卸甲。\n\n逐漸，黃豐瞧著上官劍仙的神情變得愈發誘人，臉色迤邐酡紅起來，都不由得為此一笑：“其實上官宗主，你知道的。小子要的並不多，甚至如果你想要的話，只要開口，我就可以給你。不要告訴小子，你不知道自己身體的特殊，能夠填滿你欲望的人，可不多喔！！”\n\n聽著，上官玉合當然沒有開口，只是一味忍耐著。\n\n雲兒被這歹人作為籌碼，威脅著她，她固然還不能隨便處決了黃豐。\n\n加之命格一事，即便她自己下得了狠手，可九州的百姓，因為黃豐姓命斷絕的原因，而有所損失的話，她又真的做得了嗎？\n\n故而，上官玉合哪怕作為洞虛之巔，仍感掣肘，她還需要一個機會，一個徹底扭轉乾坤的機會。\n\n跟緩著，上官玉合便側著臉，冷眸刮向黃豐，清高豔容在望著黃豐的時候，永遠不失蔑視儀態，直道：“我就算死，你也別想我會開口求你！！”\n\n言語決絕，縱然她的身子因為屄穴插著的極樂棒顫抖，導致得抖動不已，可劍仙又怎麼會輕易放下身段。"}, {"title": "第四章：女帝1", "content": "在他的幻想中，真是想立馬沖上去，扯開女帝的紅衣，左手一個右手一個的抓住女帝的酥乳，將這對大長腿壓到胸前，用舌頭貪婪舔舐雪白紅嫩的肌膚，引得女帝美腿發顫，瘙癢難耐，再不停用陽具研磨她陰阜外的肉褶。\n\n屆時，女帝便會紅著臉，咬著嘴唇求道：“本宮的騷屄好癢，肏本宮，請狠狠地用你的陽具肏本宮，折辱本宮吧????”\n\n自己再狠狠一紮，插進屄裡，想必女帝的蜜穴必定是濕潤軟滑吧。\n\n“呵呵呵。”夜孤寒嘴角浮起陰詐的笑容。\n\n桌上的紅燭，燭火微微蕩漾。\n\n“你笑什麼！”\n\n伴隨著女帝的聲音響起，瘮人的肅殺之意圍繞著夜孤寒的脖頸，絲絲滲透，夜孤寒啪嗒一下跪倒在床前三步開：“奴才參見陛下。”\n\n背對著夜孤寒的女帝，手裡把玩著如意，盛氣淩人道：“無事不登三寶殿，能找上朕，是吩咐你的事情辦妥了？”\n\n夜孤寒低著頭，尾指納戒閃速，一本殘舊只餘半本的無字書冊落入其手心：“幸不辱命，東西已然到手。”\n\n“噢！”\n\n床上泛起一聲輕咦，幔帳聲音翻起，一對玉滑白皙的美足落入夜孤寒的視線內，腳趾頭像嫩藕芽兒似的招展，趾甲的抹抹紅油璀璨華麗，粉皙的足背妙若天成，夜孤寒內心顫了顫，手幾乎想立馬丟掉書冊，捧起美足褻玩。\n\n“你倒有些本事，也不枉朕對你的期待。”美足隨著話語聲勾住夜孤寒的下巴，緩緩用力將他的頭抬起，視線從美足沿著腴美成熟的長腿向上經過。\n\n就待在看到女帝面容之時，美足陡然一轉，踩著夜孤寒如鼠醜陋的臉，就是一蹬。\n\n咕嚕咕嚕，夜孤寒的身軀如同滾輪般向後反轉。\n\n“從處暑找到大寒，你可讓朕一陣子好等啊，夜孤寒！”\n\n“陛下恕罪。”夜孤寒手抓著書冊，蹭著地面往女帝方向爬去，最後頭跪在女帝跟前，聞著女帝美足的芳香，低聲道：“浮生尊者坐化之時，在身外百里大山佈置了機關陣法，奴才破陣耽擱了時間，求陛下饒命。”\n\n“呵！”女帝一聲冷笑，雙腳疊起，其中一隻緊隨著踩在夜孤寒的頭頂：“把東西拿來。”\n\n夜孤寒感受著頭頂美足傳來的溫度，略微掙扎：“女帝，這……讓奴才……”\n\n“哼哼。”\n\n女帝眨巴著淺金色的鳳眸，饒有興致踩著跟前的男子，似乎對此很是高興：“怎麼，你給朕啊。”\n\n夜孤寒有些膽怯，想些齷蹉的事情他是敢的，但若是強行抬頭衝撞女帝，那後果他可不敢想。\n\n“陛下不讓奴才動，奴才怎麼敢動呢。”\n\n“嗯。”女帝低吟著，瑩潤的下巴微微點點，表示贊許後，才慢慢挪開美足：“來交給朕吧。”\n\n想到金閨待通籍，一時驚喜見風儀，但就在夜孤寒手往前遞書冊的同時。\n\n一道女官的聲音從外傳進：“陛下，楚王殿下在外求見。”\n\n—————————\n\n怎麼偏偏是這個時候，夜孤寒一陣吐槽。\n\n“朕知道了，讓他在外等候。”\n\n“諾。”\n\n坐在床沿的女帝，神色波瀾不驚，美腿在空中散發著成熟的芳香，隨著吩咐落達，一襲淡金色的靈力屏障充斥到房間的每一個角落：“磨磨蹭蹭的，是不想給朕嗎？”\n\n“不，不是。”夜孤寒心中竊喜，看來今日說不準，真得成了。\n\n效忠女帝多年，也終於到這個時候了。\n\n夜孤寒隨即將東西交到女帝手中，只是臥榻之下，跪著的姿勢往上抬望，腴白潤滑的腿肉夾著糜香的丘壑，隱隱約約，足見茂密郁蔥的森林。\n\n“陛下，這書冊奴才給您拿到手了，那說好的獎勵……”\n\n話音未落。\n\n咻地一聲風起，夜孤寒被踢翻在地，瞬間感覺胸膛壓上了座大山。\n\n踩著夜孤寒的女帝，眯著鳳目彎下身體，熟透身體壓制的性欲宛如脫韁野馬，鳳袍下漣漪肉光晃蕩，打量著身下人折辱的模樣，女帝抿了抿抹了胭脂的紅唇，手勾起垂落的銀白髮絲，後抬起了夜孤寒的下巴，語氣故作森寒道：“那你想要什麼獎勵呢？”\n\n洞虛級別的威壓使得夜孤寒有些頭皮發麻，可直面全天下最貴重的軀體，是個男人，色膽都得鼓鼓作祟：“陛下，你看這個……”\n\n正說著，色手不自覺地攀上聳立的山巔，隔著鳳袍，入手刹那絲滑軟潤。\n\n“嗤~”\n\n夜孤寒色手得逞，女帝倒沒做出什麼排斥動作，只是忽發出嘲弄般的輕笑，皓腕往下挪移，握住了夜孤寒的脖子：“你可知自己在做什麼？若朕大叫一聲，朕的皇子在外頭聽到，你會有什麼下場？”\n\n難得有所進展的夜孤寒，不想放棄這難得的機會：“陛下在房中設下屏障神通，就算喊破天了，楚王殿下也聽不到啊。”\n\n聽著夜孤寒的話，女帝板著的面容，忽地一變，淡金色的鳳眸展露笑意：“如此說來，是你喊破天，還是你想朕喊破天？”\n\n“嗯……呃……陛下！！”\n\n被女帝掐著脖子的夜孤寒，臉色愈發通紅：“陛下若不給機會，誰知道呢？”\n\n“噢，機會？”女帝饒有興致地噢了一聲，視線不以為意地掃過夜孤寒下身挺立的小東西，再斜眼剮向快憋死的夜孤寒，後玩味地俯下身，嬌豔欲滴的紅唇貼在夜孤寒耳側：“如此說來，你是想以下犯上咯？”\n\n“奴才不敢，只願奮盡全身效勞陛下。”\n\n聽著夜孤寒的話，女帝紅豔欲滴的絳唇勾勒，紅燭燈火透過輕薄的衣紗，瑰姿豔逸的身段兒隱約可見，手漸漸望著夜孤寒的下身摸去，笑意濃濃：“獎勵你，並非不可以，只是你還得幫朕做一件事。”\n\n夜孤寒毫不猶豫的點頭應下。\n\n女帝盛顏傳絕修仙界，那位男性修士沒把她當作心中的追求，而就在昭安十三年，夜孤寒準備突破化蘊九境，心關實在忍耐不住，便夜襲了皇宮。\n\n雖然那次他沒得手，但走了空門的夜孤寒便打起了，女帝褻衣的主意，如此成了怪癖，每隔半月，他便會到皇宮偷褻衣過過手癮，滿足自己。\n\n時間長了次數多了，也大膽了起來，他居然犯傻地在女帝就寢時夜襲宮房，最終被女帝發覺且扣下，之後非但沒能嘗鮮，還被女帝威脅成了她的奴才。\n\n不過，夜孤寒心中還是竊喜的，起碼成了奴才，就有由頭去見女帝了。\n\n而通過這些經歷，夜孤寒也深知道，女帝在深居皇宮大內，久感獨守空閨的寂寞，這寂寞熬著沒什麼，用手調劑調劑勉強能度過，但若是開了葷，女帝還能忍得住麼？\n\n說白了，女帝雖然看著高貴霸氣，內裡就是個騷氣的熟婦。\n\n這種熟婦，就缺人折騰。\n\n“那麼你真的想給朕？”\n\n女帝聲音落在夜孤寒的耳側，但說不動是假的，就在上一刻女帝俯下身時，傲人的酥乳便疊在了他胸膛前，女帝那對皎白傲人的長腿也是分開，豐盈美臀坐在了他肚子上。\n\n很少穿褻褲的女帝，此次更是不例外，隔著衣衫都能感受到女帝茂密的森林在肚皮上摩擦，女帝的陰毛很繁盛，但也不是那種錯集叢生的感覺，而是齊潔湊整的，觸感也是很柔順的。\n\n夜孤寒實在無法忍受誘惑，隔著衣衫玩了玩女帝的酥乳後，手開始順著腰肢撫向女帝的陰阜，但就在他剛接觸到隱藏在叢林後的肉糜時。\n\n女帝翹腿悄然輕抬，柔荑抓緊了他的手，面容上的媚意又化為唯我獨尊的高傲氣勢：“如此著急可不行，給你的獎勵可沒說要做這事。”\n\n夜孤寒錯失美肉，臉上一陣難受：“陛下，奴才……真不行，忍不住了。”\n\n然而女帝可不管你憋不憋得住，只自說道：“天下有變，我賜你虎符從雍州秘密調二十萬兵送往涼州銀川，記住切莫走漏了風聲，否則別說獎勵，我還會閹了你，屆時別說什麼夜宮，你只配在宮內做一名太監。”\n\n夜孤寒聞言，臉色驟然一凜，未想到這事情居然鬧這麼大，調這麼多兵，女帝是要攻打蠻族嗎？\n\n但夏蠻和盟？\n\n“陛下之事，奴才定然辦理妥當。”\n\n“如此甚好。”女帝眉語目笑，見夜孤寒答應，剛好伸到其褲頭的手便頓住抽出，身子往床邊就是一坐，順帶丟出塊虎符：“如此你可以退下了。”\n\n“不是，陛下……”夜孤寒接過虎符，跪在女帝身前，滿臉不帶你這樣的神態：“奴才……”\n\n為人君者，屢行霸道，但對屬下給苦頭留念想時，偶爾也得給些甜頭。\n\n女帝雙腿交叉疊坐於床，夜孤寒長得很是醜陋，終歸是男子，久不沾雨露葷腥的自己，多少還是有些動容，胯下陰阜腴肉在方才的磨蹭下，冒出了不少蜜汁。\n\n也讓她有些忍不住了。\n\n但如果和他做了，自己該怎麼和兒子交代？\n\n雖然……\n\n醞釀片刻後，女帝再一次用美足抬起夜孤寒的頭，高貴的臉頰上，熟豔紅唇揚起若有若無的弧度：“夜孤寒，朕美嗎？”\n\n夜孤寒眨了眨眼睛，不由自主咽了抹口水：“美……陛下太美了！”\n\n就在夜孤寒傻愣愣回應的同時，女帝掀開裙擺，兩條雪潤光滑的大長腿，分開架在夜孤寒的肩膀上。\n\n大腿內側，讓人熱血膨脹的神秘地帶，茵茵芳草華茂春松，瑤林瓊樹間流落著水滴，朦朦朧朧的霧氣下，紅潤鮮萃的兩瓣陰唇稍稍敞開，陰阜猶如山包，毫無保留地展示在夜孤寒的眼前。\n\n也是那次後，母后和姬少琅的關係逐漸變得扭曲，用京都官僚世界流行的葷話形容，那便是姬少琅染上了一種欣賞屬於自己的女人、親人、愛人在自己面前被玷污的怪癖。\n\n而女帝心中究竟如何想，這倒是難以摸清，也許是順勢放縱積壓的欲望，可能是陪兒子逢場作戲，但歸根結底，那便是他們雙方形成了特殊的默契，以及調戲的玩法。\n\n聲音從房內傳出，斷斷續續若隱若現：“那今日……便讓……你這奴才服侍服侍朕。”\n\n窸窸窣窣。\n\n就在自己面前，自己的母后，堂堂大夏女帝主動敞開雙腿，誘人享用。\n\n眼看著母后的陰唇被夜孤寒賣力地吸吮，露出裡面胭紅的美肉，挺拔的陰蒂被輕咬著，滋滋作響的舔舐聲，不斷濺射到地面的水漬聲隨之入耳，姬少琅瞧了眼關閉的院門，安心地將手中燈籠放至地面，不爭氣褪下褲子，敲響房門：“母后，兒臣來了。”\n\n此時正在全力品嘗天下第一掌權者的美戶的夜孤寒，哆嗦了一下，含著女帝陰蒂的嘴舌動作都停了下來：“陛下……唔唔。”\n\n掙扎的話音未出口，女帝長腿便夾緊了他的頭顱，螓首轉朝向房外，瓌姿豔逸的臉龐滲出羞澀紅暈，淺金色鳳眸泛起春水：“嗯????……琅兒來了……母后在嗯????……忙著呢，你站在外頭稍微等會。”\n\n忙，忙什麼？\n\n虧你說得出來。\n\n姬少琅眼神帶著奚嘲之意，手卻握著自己陽莖擼動起來：“母后勤于國政，可需臣兒效勞？”\n\n“不……”女帝輕咬朱豔絳唇，在被兒子親眼目睹的情況下，沒過一會，女帝迷蒙的鳳眸難以制止地往上翻起，傲長美腿繃的筆直，粉皙的美足上抹紅油的藕趾時而舒展，又時而蜷縮，豔美高貴的臉頰流連的細汗隨著一聲嬌吟所劃落：“要????！”\n\n舔得女帝泄身的夜孤寒，嘴角泛笑，手掌也逐漸不按規矩地攀上山巔。\n\n但女帝幾乎在泄身後兩息，愉悅臉頰瞬間恢復成以往容雍華貴的神態，望著欲欲攀上身來的夜孤寒，淺金色鳳眸浮過蔑視，左腿隨即向著夜孤寒脖頸，用力一掃。"}, {"title": "第五章：女帝2", "content": "搞不清女帝葫蘆裡賣什麼關子，黃豐愣愣神提起金鏈，在女帝跟前跪了下去。\n\n此舉令女帝鳳眸流露出滿意之色，便讓黃豐捧起了自己的腳，再褪下高跟，金鏈一根一根扣上足趾，又哼聲道：“如今許攸何處去了？”\n\n黃豐捧著美足，回道：“這點，小王還真不知道。”\n\n女帝抬起一隻穿好金鏈的美足，細細打量一番後，搭在黃豐那種醜臉上。\n\n紅油足趾劃過粗糙的皮膚，最後停在那張厚實的嘴唇前：“裴皖的身子如何，玉合讓你得手了？”\n\n足趾的芳香湧入鼻腔，黃豐開口說話之即，唇舌刮過足趾，模糊不清道：“還……沒……沒有……唔。”\n\n也不知女帝是不是被舔得發癢，豔容璀璨道：“你耍手段的本事是許攸教你的？朕可以不殺你，但從今夜起，你就是朕的奴才了。以後所有事與朕彙報清楚，自然有你的好處。”\n\n“還有！朕給你一日時間，將玉合和裴皖體內的藥老老實實的停掉，一日之後，朕要看到她們兩個清清醒醒站在大比的觀武台，知道嗎？”\n\n黃豐含著女帝足趾：“唔，知……道了。”\n\n“很好。”\n\n見兩足都掛上了金鏈，女帝抽出被黃豐含住的腳，嫌棄地甩了甩密佈的津液。\n\n女帝鳳眸又掃向黃豐手裡剩下的一坨鏈條，胸懷微漾：“接下來要怎麼穿？”\n\n正說著，女帝話音陡然一轉，岔開兩雙美腿，慵懶躺在梨椅靠背上，眯起眼瞧著黃豐：“是要這麼穿嗎？”\n\n雖說黃豐在女帝跟前，有了活著的價值，但難保這隻手遮天的洞虛強者，一腳把自己揣陰溝裡。\n\n他雖然還有底牌保證活著離開，只是一切算計恐怕就得落空。\n\n但目視前方玉柱腿畔內側，溝壑綿延，竹苞松茂的美景。\n\n黃豐默默咽了口唾沫，順著杆子往上爬，提著美足勾連的鏈條分而向上拉伸，直至接近到大腿之處，又停下手腳試探道：“真穿？”\n\n女帝翻了個白眼，臉色忽而一冷，兩腿夾著黃豐瘦矮的身子往前挪，朱唇散發著鮮翠欲滴的光澤，輕蔑道：“怎麼，弑父傳位、盤算劍閣，攬親王入懷的事你都敢做，方才威脅朕的魄氣去哪了？朕讓你上，都不敢上嗎？”\n\n“不敢不敢。”\n\n黃豐口中念叨著不敢，手裡的動作卻沒再停下，掀開長裙，整個大夏最高貴，最有權勢的生殖機器置於眼前。\n\n那綻放的唇瓣釋放著熟媚芳香，獨屬於少婦人兒的味道。\n\n若是少琅在此看到一切，或許會非常疑惑，為何母后忽然讓黃豐占起便宜？\n\n難道想利用這個小鬼？\n\n誠然，女帝的確有將黃豐利用收編的意思。因此這些身體接觸的主要目的不過是‘獎勵’而已。\n\n她是女帝，不是那個躲在蘇青山背後的東方家大小姐了，欲與情都可以成為君王的武器，有頂天的實力作為後盾，女帝也不怕出岔子。\n\n目前女帝也不管黃豐究竟說了多少慌，至少服用誠實蠱說出來的話，是真的。\n\n那麼她要做的，就是借著黃豐，引出背後的許攸。\n\n曾經伏殺蘇青山的許攸，永遠是蘇青山身邊紅顏的心病。\n\n為了‘復仇’，她們很多人都嘗試過，去瞭解當年的殘劇，為何而生。\n\n但那時候恰逢夏蠻大戰，許攸又死在了戰場上，讓一切問題都化作塵埃般消散了。\n\n而在女帝掌權後，甚至親身前往過許攸的天機門探求這個答案，得到的還是虛無。\n\n也許也是從東方嵐決定嫁入皇室，選擇登基稱帝的時候開始，她便早就不是自己了。\n\n那麼為了想要知道的，又有什麼是不能付出的呢？\n\n當年青山和許攸這兩位修仙界的閃爍新星，可能就是因為這答案產生了很大的矛盾。\n\n這答案可能關於夏蠻夷，可能關於整個天下蒼生。\n\n也可能是關於四大神樹，天書的事。\n\n甚至可能是，洞虛之上問道無上，修士永生不死的道途！！\n\n實際上，當多多以後，女帝一步一步爬到整個天下的至高點。\n\n女帝也開始發現自己不可避免地靠近了這件答案，不然她不會偷偷讓夜孤寒尋找天書。\n\n而這個偷偷讓他人去尋找，也有一部分是女帝感覺，有某些‘人’在故意讓洞虛不接近天書。\n\n或者說，有什麼人想讓洞虛君臨萬人之上，又永遠邁不上問道的階梯。\n\n“嗯????……”\n\n女帝從遙想中醒落，金眸低垂，便見黃豐拎著金鏈的手，正撮弄著自己的陰阜。\n\n所幸這幾天鳳凰浴火不高漲，不然女帝都懷疑自己經不起這挑撥，欲望上頭讓這蠻子肏了自個。\n\n陰阜蜜穴被黃豐弄得微微濕潤，時而發出咕嘰咕嘰的淫靡之聲。\n\n女帝忽地用膝蓋敲了下黃豐的頭顱，臉色紅漲，朱唇豔豔：“怎麼……嗯????你還要……玩多久呢????？還不給朕……喔????……掛上？”\n\n黃豐的手指從炙熱的陰阜中伸出，心中一頓慶倖，女帝果然是個身懷名器的浪蕩貨色。\n\n一方面心頭又暗自腹誹，這浪蕩的騷貨總是恰好好處的撩撥自己，如果不是為了未來的局面，真想強上了！\n\n但強上好像打不過這騷貨，黃豐如此想著，開始拿起金鏈的環頭撥弄陰阜，軟聲裝弱道：“這金鏈需要勾動女子欲望才掛得上，多有得罪，陛下勿怪。”\n\n“那……嗯????……誒嘶……噢????還不快掛上，要朕等多久……呢????！”\n\n女帝鳳眸蕩漾，抹著紅油的足趾微微蜷縮，帶著金鏈叮鈴叮鈴脆響，在黃豐將金鏈環扣掛在陰蒂之上時。\n\n一陣吸附酥麻感襲來，美足忍不住一弓，帶動著陰蒂一拉，環扣在陰蒂的環扣屬於很精巧的物件，內設三圈機關。在美足拉伸的同時，三圈環扣以‘順逆順’三種不同方向旋磨整圈。\n\n正所謂花唇微綻羞難掩，豔蒂嬌聳情已動。\n\n女子陰蒂情動之時最是摸不得，而環扣還不止磨蹭，雖然鎮壓靈樞的陣法被女帝抹去，附帶的刺激麻痹陣法，卻被女帝刻意保留了下來。\n\n在此之後，女帝將足趾舒展伸開，金鏈再次拉動，鳳眸上翻：“噫……要沒了……齁????！”\n\n蜜穴軟肉在黃豐眼前收縮了下，一股暖流自內而外順延，唇瓣綻蕊，炙熱的泉水噗地噴出，將黃豐的臉澆個濕透。\n\n女帝無愧於大夏洞虛之巔，身具鳳凰真火的火修，連帶著潮吹而出的淫水都帶著炙熱之氣。\n\n黃豐也被這一澆，嚇住了心神。\n\n這……女帝。\n\n還真是一個字：騷！還是明著騷！\n\n但終究還是女帝先一步回神，碩大飽滿的雙峰在潮動後不斷起伏，半碗玉露掙脫束縛，兩抹頂端殷紅於衣衫下頂出凸起。\n\n女帝望著黃豐愣愣的模樣，眯了眯鳳眸，一聲冷笑：“還不快點穿上，朕的皇子還在外頭候著呢。”\n\n黃豐霎那回神，你家皇子知不知道自己的母后這麼騷媚，故作顫聲：“接下來要先請陛下褪下上身的衣物了。”\n\n“褪下麼？”\n\n黃豐真摯的點點頭。\n\n女帝以手撐首，下巴微勾，語氣傲慢又略帶慍怒：“那怎麼行，朕的鳳軀豈是你個蠻人能看的？”\n\n下面都看過了，還在乎上面？\n\n黃豐淫淫笑道：“陛下還有什麼是小王不能看的？”\n\n砰——\n\n女帝重敲桌面，俯下半個身子雙峰搖搖曳曳，探到黃豐耳邊，豔唇呵氣如蘭：“莫要占了便宜便賣乖，你不過是朕的一個消遣品而已，服從朕的話是奴才的本分，若再有半點得寸施為，小心你的項上人頭！”\n\n話畢，女帝收回神色冷傲的豔容，躺了回去，燦地一笑：“來吧，就這麼繼續往上穿。”\n\n黃豐眼角頓時抽插了下，他還是頭一回被女人玩弄得忽上忽下。\n\n但當下也只能先順從著女帝意思，若是那幾樁事能成，看你往後還怎麼裝。\n\n不過這麼穿也有這麼穿的好處，黃豐將金鏈分成兩叢，越過腰衣探入女帝身體內，女帝身材不止高挑，連帶著腰肢都那麼地曼妙婀娜。\n\n說起來，黃豐玩弄過的女婦中，裴皖屬於珠圓玉潤的一位，腰肢軟肉豐腴，而不覺肥膩。\n\n柳舟月則是柳腰款款，盈盈一握，聖潔面容下也是副下作的身體。\n\n而上官玉合的腰和臀，看上去則和女帝最為相像，不過上官玉合的稍微比女帝矮點，但比例也更好，臀滿腰瘦，堪稱完美。\n\n只是如今這麼一探手比較，這女帝的腰也不遑多讓，曲線玲瓏不止，膚感順滑宛若酥脂，絲絲溫熱足以泣人心腸。\n\n黃豐胯下屹立的陽具被誘惑得更發茁壯，再向上邁，兩團飽滿柔軟的乳肉躍入手中。\n\n女帝低垂著鳳眸，紅潤欲滴的唇瓣抿動，鼻腔輕輕發出著呻吟，催促道：“唔……嗯????還不快點！上面一點……嗯????……輕點……噢嗯喔????……就是這快……到了嗯????！”\n\n把玩著女帝雙乳，黃豐多少有點愛不釋手，手指刮過蓓蕾又劃過，擺出一副裝傻充愣模樣。\n\n驀然間，女帝兩腿夾著黃豐就往內靠，黃豐整個矮小身子猶如陷進了肉團中。\n\n接著女帝隔著衣衫拉起黃豐的手，將金鏈的環扣拉到乳峰掛起，又再將剩餘的金鏈掛到脖子後頭。"}, {"title": "第六章：女帝3", "content": "在房門打開，黃豐邁進門的同時。\n\n坐在凳椅上的女帝，風袍半卸落下，飽滿挺翹的乳團躍跳而出，顫動的嫣紅乳峰於空中舞動軌跡，一條金鏈栓動乳峰紅櫻，將女帝成熟美婦獨有的韻味，毫無保留地展留而出。\n\n繼而，畫面又是一停，觀望的少琅頓時懵住。\n\n母后為何忽然在黃豐面前將衣衫脫下，疑惑充斥腦海，但不容多想，很想知道後續的少琅，連忙按向青梅燈。\n\n畫面依序而起。\n\n女帝翹起欣長美腿，鳳眸旋抬掃向黃豐，豔唇輕啟：“來了。”\n\n話語聲色帶著不可抵抗的威嚴。\n\n在少琅面前趾高氣揚的黃豐，聽到這句話，當即收起背在身後的重劍，沒有絲毫遲疑便在女帝面前跪了下去，尊稱道：“奴才見過陛下。”\n\n女帝鳳眸倏地往少琅一側的牆面看去，眸子中洋溢出得意的笑意。\n\n此後，女帝性感紅唇勾魂蝕骨般淺笑了下，開口：“你為何過來？”\n\n噔噔噔——\n\n黃豐跪爬在地面，往女帝跟前蹬去，緊接著捧起女帝腿，脫掉鞋子。\n\n將寶玉筍足放到頭顱上，道：“奴才前來是接受陛下懲罰的。”\n\n少琅傻眼。\n\n女帝微抿紅唇，感覺敏感的足心被蠻人頭髮刺蹭酥麻，忽而滑動踩了踩：“為何朕要懲罰你？”\n\n黃豐經過日夜思索，早已摸清女帝的脾性。\n\n在女帝面前，他的自尊心完全可以不知丟到哪去，回應道：“女帝命我贏下此場比試，又不能動用自身的手段。但奴才最終還是無法避免地使用了，請陛下責罰奴才。”\n\n“你的奴性還真是越來越足了，哧哧……”女帝笑意不止，倏地又瞟了眼少琅，鳳眸迷離且挑逗，道：“那麼你想朕怎麼懲罰你？”\n\n驀然，黃豐應道：“奴才有一計，可將功補過，不知陛下願不願意。”\n\n“噢，什麼計？”\n\n此言一出，少琅便見得黃豐抬頭，將母后筍足占為己有地捧了起來，還伸出舌頭舔過足背，沒過一會唾沫便佈滿了整只令人癡迷的軟滑筍足。\n\n接著，便見低垂黃豐舔足的女帝，紅唇淺笑了下，又接著用另一隻未被玷污的筍足勾起黃豐的下巴，癡笑道：“雖說你勝之不武，需要懲罰。但朕在天遁牌裡也說得明明白白，只要你能戰勝夜冥，便答應給你賞賜獎勵。你有什麼想要的麼？”\n\n窸窸窣窣——\n\n黃豐舔著足，腦子卻想著別的事。\n\n頭一次見面，女帝邀他入浴，期間讓楚王在外恭候。\n\n再一次，當著楚王，王妃都在場的情況下，讓他躲到桌面下去舔足，之後又支開所有人，在楚王回來前，給他舔起了蟒具。\n\n這堂堂大夏女帝，難不成是個饑渴難耐的騷婦？\n\n不對，她是騷。\n\n但騷的點，不是想被肏了。\n\n立足當下，女帝的目光經常會有意無意瞧向牆壁。\n\n黃豐終於可以肯定，女帝騷的原因，是因為旁側房子中那個人。\n\n她騷的方向，是想讓兒子看著自己被人玷污！\n\n本還對怎麼拿下女帝，而感到非常擔憂的黃豐，此刻已改變了原有的策略。\n\n兩隻筍足抹臉，洞虛修士的肉體脫離世俗，不染塵埃，散發出的芳香灌入鼻腔。\n\n黃豐猥瑣地舔弄著腳心，將嬌嫩欲滴，抹著紅油的筍趾含入口中，斷斷續續道：“奴才斗膽問陛下，是不是什麼獎勵都可以！？”\n\n也許在享受，也許在等候，女帝秀手微緊地抓住凳把好一會，豔容瑤鼻中傳出的呼吸聲也越來越粗重。\n\n“嗯????……”女帝紅著臉嗔道：“是……什麼獎勵都可以，只是……你得先告訴朕想要什麼獎勵嗯????。”\n\n得到答覆，黃豐心一橫，斗膽將女帝雙腿駕到肩膀上，黝黑的手摩擦起欣長美腿軟肉，道：“說出獎勵前，奴才想知道日夜以來，陛下為何勾引奴才？”\n\n粗糙又遍佈厚繭的手磨蹭著長腿，又曉得琅兒正在偷看的女帝，心裡充滿了刺激。\n\n但即便再刺激，她也不想讓黃豐掌握了自己和琅兒之間的事情。\n\n權衡過後，女帝忽用腳將黃豐夾上前來，展露出三分放蕩饑渴的豔容，又重拾至高無上的人皇尊嚴，道：“朕何時勾引你了？”\n\n“是是是，奴才說錯話了。”覺著頭都快被女帝擠爆的黃豐，求饒道：“是奴才覬覦陛下，奴才知錯，奴才想到要什麼獎勵了！”\n\n“噢，你想要什麼獎勵，莫非……”前一刻還在高傲威脅的女帝，瞬間變得玩味吃意，鳳眸流轉向牆面：“莫非，你是想要朕？”\n\n“奴才該死，奴才的確心生此歹念了。”舔著女帝小腿的黃豐，回應著。\n\n屆時，畫面又是一停，\n\n目前母后和蠻子所做的事情，都還沒違反‘約法三章’。\n\n但看到母后這個模樣，聽到母后那句話，姬少琅感覺心都快糾成一團，呼吸跟隨著愈發沉重。\n\n隨即少琅快步走到房門，打算直接離開前往母后的房間，不曾想，房門無論使出多大的力氣都打不開。\n\n曾經崇高神聖不可侵犯的女帝，那個對自己愛惜的母后，已經快自己眼前變成淫蕩，饑渴別人澆灌的美婦了。\n\n如果繼續下去，還會變成什麼樣子？\n\n走回到牆面投影前，要走出去，要停止可能真要按銀朱燈。\n\n於是，姬少琅手停在了銀朱燈前，只需輕輕一按，母后就會變回成淩駕一切之上的大夏女帝！\n\n而在準備按下之際，少琅腦海響起黃豐傳聲的一道話。\n\n“楚王殿下，很想知道女帝是一個怎麼樣的女人吧，對不對？”\n\n懸停的手最終再次挪移到了青梅燈前，繼而按下。\n\n投影浮現，女帝兩腿還架在矮醜磕磣的蠻人肩膀上，欣長美腿的白肉被那雙黝黑小手瘋狂佔有揉紅；\n\n女帝似乎還在等待著孩兒的選擇，即便長腿被人撫摸得酥麻至極，看向少琅牆面的眼神中再迷離，依舊用手抵著黃豐的頭顱，不讓其向繼續靠近。\n\n然而，抵禦不到幾息，女帝便轉過臉。\n\n在那一瞬間，她知道了琅兒的選擇，她的眼神似乎流露出一絲惋惜。\n\n雖然這場測試是她親自佈置的，但她內心也希望著琅兒能按下銀朱燈，然後跑到房間內，到自己懷裡哭訴，然後安慰自己體內升起的浴火啊。\n\n“呵呵呵。”抵著黃豐頭顱的女帝輕笑了數聲，既然琅兒選擇繼續看下去，便遂了琅兒的心意。\n\n倏然，女帝螓首抬離昂到凳把上，春意湧動的淚意，以至鳳眸都帶上了些許迷蒙，朱唇方啟：“既然想要朕，便給你個機會服侍朕，讓朕看看你有什麼本事！”\n\n得到女帝應諾的黃豐，正吸吮女帝腿肉的嘴角微微勾起，緊接著便感受到女帝一直按在他頭上的手卸下力道。\n\n黃豐連忙順著美腿往上爬，將鳳袍掀開，大夏女帝的美熟門戶再度展現在他的面前。\n\n陰阜寶山上，生滿了有序乾淨的絨毛，寶山洞口恰似牡丹花瓣般隨著呼吸，一張一張地向外溢出潺潺淫水，飽滿前庭陰蒂甚至還環扣著一條金鏈。\n\n原來，母后又戴起這條金鏈，只是沒有完全戴好，將原本扣著足趾的金鏈拎到了腰間掛住，而上身佩戴頸後的那部分，也是塞到了乳峰溝壑中。\n\n少琅不敢相信眼前的觀望，而蠻子已貌變貪狼，張開厚唇便往母后的唇穴吻了上去。\n\n女帝也沒阻攔，感受著一條滑溜溜的粗舌沒入自己美穴內，放肆地攪動，時而又深深地往外吸，陰蒂不斷被拇指拉轉環扣，鳳凰浴火逐漸攀升。\n\n前所未有的刺激讓坐在凳椅上的身子，豐腴翹臀緊縮，後昂在凳背的螓首豔唇向外吐出溫熱的氣息：“嗯????……嗯噢????……好羞恥……穴肉都要被吸出來了……嗯嗯哼????！”\n\n飽滿彈軟的雙乳隨著黃豐的吸吮顫顫悠悠，挑起陣陣肉浪，只是驀而，女帝伸出柔荑美手抱住黃豐的腦袋，按住了他耳邊，靈力蘊動遮掩住黃豐的聽感，側臉望了過來：“啊……琅兒怎麼辦……母后的穴兒噢????……被他舔了，琅兒怎麼忍心的……嗯????……他在吸母后的穴肉了嗯……好美嗯????……母后被他舔得好舒服……全都被琅兒都看到了！”\n\n女帝的話語借著琉璃投影傳進少琅耳中。\n\n那曾經讓少琅引以自豪，憧憬愛慕的母后正在另一處房間被人舔舐，被低下的蠻人舔舐。\n\n風華絕代的人皇女帝，變成淫蕩美婦的反差場面，不斷向兒子傾訴著賤言媚語。\n\n姬少琅一下子跪在了投影牆壁前，胯下陽具無法抵抗地硬了起來，那一瞬間他不像是女帝之子，大夏的楚王，反是位看著自己的親母被人玷污的孩兒。\n\n但少琅選擇忘記了一切，將羞辱埋藏心底，激動地手把在了陽具上，擼動起來。\n\n在房內，黃豐的攻勢並沒有因為女帝的動作停止，嘴唇吸吮美穴，雙手也開始向上攀延，按向了女帝的高聳碩乳，粗糙黝黑的小手凹陷在白滑的軟肉中。\n\n高挑曼妙的熟婦宛若八爪魚地包裹著矮小的蠻子，女帝豔美雙頰泛紅，架在黃豐肩膀上的兩腿，已不由自主勾了起來，抹著紅油的筍趾忘我地舒展，向人吐露著身體在經受著什麼程度的快感。\n\n迷亂間隙，鳳凰浴火於女帝四肢百骸燃燒而起，女帝放開遮蔽黃豐聽感的手，手抓緊了凳把，腰肢向上弓起，鼻腔哼出蕩人的呻吟，美穴軟肉一陣陣痙攣，蒸騰的淫水自穴深處噴湧而出，澆在黃豐臉上。\n\n“女帝舒服嗎？”\n\n正半翻著白眼，臉頰密佈細汗的女帝，耳邊傳來一聲腔調不似夏音的夏語，緩緩回神後，才發現一張不堪入目，又澆得濕透的蠻臉附在了自己面前。\n\n不止如此，在泄身迷失的短暫時間，黃豐已將他自己身上的衣服脫了下來。\n\n又將女帝身上的金鏈未穿戴的部分，穿戴了起來，兩腿於肩被抗起，粗長陽具直抵女帝美穴牡丹心。\n\n“陛下準備好了嗎？奴才要繼續了。”\n\n“你想做甚！”女帝雖在縱欲，卻沒半分對黃豐的好感，能夠讓其享用自己的身子，不過是讓孩兒釋放癖好，一切也得在她的主導下進行，才行。\n\n在黃豐即將提槍上馬前，女帝豔容一冷，鳳眸流露出惱怒之色：“你還真的想要朕？”\n\n被女帝喝停的黃豐，手臂鳳凰刻印散發著炙熱的氣息，整個人當下被禁錮住一般，不得動彈。\n\n但黃豐依舊不想錯過這個大好時機，臉附在女帝耳邊，低聲徵求：“試曾想，陛下自為人君後，久居深宮，身子空守寂寥不得泄欲，陛下擁有著如此美豔的身軀，若是不為人使用，這是多麼遺憾的事情……”\n\n“……況且陛下也很喜歡這種體驗吧，放眼整個天下，有何人能有奴才這個膽子接近到陛下，只要給奴才這麼一個機會，奴才肯定能給陛下帶來更舒服的感覺。”\n\n此言語聲音很小，無法通過投影傳到少琅的房間中，只是在少琅眼中，母后的神色從板冷緩緩變得玩味狡黠。\n\n“呵呵，這麼說你這奴才，是真想佔有朕了。”\n\n少琅看著母后潤澤紅唇作抿，把在凳把的手伸向了黃豐猙獰的陽具，手指挑動陽具龜帽的皮縫。\n\n有著一種熏臭的味道從下方傳進女帝的鼻腔，導致女帝鳳眉微微擰起：“只是嗯????……你有想過佔有朕代表著什麼嗎？”\n\n黃豐陽具被挑得漲硬，道：“今日之事陛下不說，奴才也不說，又有誰知道？”\n\n是啊，今日就算讓他肏了母后，此事能知道的也不會超過三人。\n\n唯獨這第三人。\n\n那個我，大夏楚王姬少琅，女帝的兒子就在隔壁房間觀摩著此事。\n\n勾引黃豐，是出於女帝和少琅定下的約法三章，追加的款項也說明了女帝不能讓黃豐的陽具直接進入到身體裡……\n\n對於此，少琅還是很放心的，也許就到此為止了吧？\n\n只是驀而，女帝捏住了黃豐的龜帽，紅唇淺淺勾起，即將說出的話語幾乎讓少琅泄了陽精，也讓少琅整個人徹底傻了眼。\n\n“要與你行房事，非是不行，只是……”說著，女帝騰手往黃豐胸膛一推，黃豐整個人咚地一下倒在地面上。\n\n長腿於空中劃過曼妙的曲線，環扣紅油筍趾的金鏈被女帝挑開，美足帶著黃豐唾沫殘漿，踩進地面顛倒的展翅高跟裡。\n\n緊接著，女帝面向少琅方向的牆壁，翹臀緩緩壓向黃豐的肚子。\n\n直挺挺的漲硬陽具打在了女帝婀娜軟盈的小腹前，幾乎長達肚臍。\n\n這長度的對比，讓女帝眼中也閃過一抹驚訝之色。\n\n隨後在少琅面前，女帝豔容洋溢著壞笑：“既然想要朕，便得試試你。朕可以讓它進來，但你卻不能動，而且只能進來三寸。若是在朕泄身前，它先走泄了元精，往後就莫說出想要朕的話了。”\n\n少琅房間投影畫面。\n\n緊跟此幕，中止了下來。\n\n不斷擼動陽具的少琅，心跳急速跳動又霎地停滯了下，他很清楚，這句話是母后說給自己聽的，也是在諮詢自己的意見。\n\n母后會不會和蠻子交歡的主動權，一直都在自己手裡！\n\n奈何奈何，由於少琅跪著陷入掙扎考慮，卻意外錯過了畫像投影下方，不停轉動的日晷。\n\n選擇也是有時效的！\n\n直到他做出抉擇，直起身手伸向銀朱燈，打算終止試探的時候。\n\n日晷晷針恰好完成周天轉動，默認選擇了青梅燈。\n\n畫面繼續投影而來。\n\n騎坐在‘面首’黃豐身上的女帝，鳳眸注視著牆面，卻並未使用手段去透視琅兒的行動。\n\n原因很簡單，她也在享受這場約定，享受這場遊玩。\n\n少時後，琉璃牆面隱隱閃過一點青亮，女帝鳳眉詫異作挑，隨後如焰紅唇向外呵吐芳氣。\n\n琅兒居然選擇了青梅燈。\n\n念罷，少琅愣愣注視下，女帝垂下 \n\n徹底放開禁制的鳳凰浴火燃燒神魂，女帝的身子越來越火熱，遍佈汗珠讓她白皙又透紅的肌膚充滿絲絲淒憐。\n\n黃豐在女帝話語的催促下，也繼續抽插了起來。\n\n陽具抽出，唇瓣微微外卷，芳香汁水四溢而出，往裡插入，炙熱和緊致的感受直接加劇了十倍，穴肉灼燒似的溫度直接包裹上來，瘋狂蠕動，女帝感覺整個身子被捅開一般，歡愉之極。\n\n黃豐還不想止步於此，抽插的速度更發加快，他要讓這個女婦，徹底記住這個滋味。\n\n“慢點……齁齁齁????……”女帝紅唇吐圓，喉間發出一聲聲哼吟：“好舒服啊啊啊????……用力用力！”\n\n“這大宗筋，大陽具，大肉棒插得好深????……噢????朕真的要變奇怪了！????”\n\n不知是嫌棄著這個姿勢的動作太慢，還是嫌棄這個姿勢插不到胃。\n\n女帝忽又直起身子，不忘用風袍衣袂擋住抽插羞恥地帶，以免被少琅發現，自己的母后，大夏女帝不止被蠻子肏了，而且不是插進來三寸噢。\n\n已經是足足的六寸了，而且……而且！！\n\n展翅高跟略動。\n\n驀地，女帝從蹲姿換成了跪姿，兩手探前，跪在了少琅身前，被風袍崩裹的滿月雙臀在後瘋狂起伏，朝向少琅的豔容，鳳眸金瞳微微向上翻起，香舌伸出，舔舐潤澤紅唇，如似變成一頭完全壞掉的母豬騷容。\n\n“啊????……朕被肏了……噢齁????在觀看大比的房間內……嗯????在宗門大比這麼多觀眾的情況下……嗯????被蠻人肏了。”\n\n“沒有人知道……哦咿咿咿????夏朝的女帝被一個蠻族小鬼肏了咿????……連琅兒都不知道啊……噢噢！????”\n\n“朕是不情願的……但齁????真的太爽了……真是太蠢了，你都不知道啊????……朕被人肏了，母后被肏了，本宮的美穴被肏了……頂得好深……好美，朕要暈過去了齁齁齁齁????????????。”\n\n瘋狂的撅起，用力地往下插，猛烈的快感傳遍周身，黃豐把著女帝的曼妙腰肢，如同操控著一頭不斷奔跑，不知疲倦的烈馬，急喘著粗氣：“奴才也很爽，奴才是不是第一個讓陛下這麼爽快的，陛下是不是快要泄了，陛下的美穴好燙好舒服。”\n\n“嗯????……”女帝下意識回應著，在那一刹那，她咬緊了紅唇，鳳眸轉媚遊絲，跪坐在黃豐身上的翹臀忽而抬至最高點，在龜帽都快離開屄穴的時候，猛地用力往下坐去。\n\n女帝：“噢齁齁齁????????????????！”\n\n黃豐：“嗯噢噢！”\n\n女帝整個人激動地直起了腰肢，螓首高抬向碧頂水晶燈，鳳眸金瞳徹徹底底往上翻起，泛起白眼，鮮萃透紅的女帝屄穴被黝黑粗長的陽具漲滿，交合之處，粘稠的汁水濕透地毯大半。\n\n最為激動的莫過於黃豐，他完完全全插進了女帝的屄穴內，那一瞬間一股浩浩蕩蕩的蒸騰熱氣往外噴在了他的龜帽前，直到撞擊在了一片柔軟的宮壁前。\n\n女帝宮壁非但不炙熱，反是像暖玉般柔和，再之後，宮壁自發纏繞起了他的龜帽，仿佛就像是被一個環肉包裹了起來，不留絲毫縫隙，圈住了他整個龜帽，然後會輕微地蠕動，又痙攣似地快速收緊了起來。\n\n那種感覺很奇妙，唯一有點很奇怪，就是黃豐整個陽具都被女帝的穴道包裹吸附了，沒有任何辦法抽動了，挪移半寸的力道都施展不出來了。\n\n再持續下去，恐怕他當場就會射出陽精，那麼他便是在女帝泄身前，先泄了陽元。\n\n可女帝真的還沒泄身嗎？\n\n就在黃豐即將服軟的前一刻，女帝遽然拉住了他的手臂，然後將他整個人拉了起來。\n\n在琅兒面前，自己的母后。\n\n那風華絕代，豔容高貴的女帝，那曾腳踩百官、征踏蠻夷的長腿微微屈著，像小母狗似向前爬著。\n\n而在她的臀後，蠻子正賡續將宗筋插進女帝體內，將女帝肏得高潮迭起，紅唇連連嬌喘。\n\n“嗯????……啊啊噢????……好厲害，頂得好深……”\n\n“好粗好長????……好麻好爽????……怎麼會這麼爽????……”\n\n一個跪向投影，望著自己母后被肏的王爺，一個兩腿微屈，半趴在牆面，身後翹臀屄穴迎合著蠻族宗筋的女帝。\n\n她們本應該是一對親和的皇室母子，如今不過隔著一面牆壁，便已是人間溝壑。\n\n跪在地上的少琅，看著母后胯下不斷抽插的交合處，看著母后屄穴湧出的淫汁，看著母后貼在牆面，吹彈可破的肌膚遍佈香汗，玉碗倒扣的碩乳壓得扁平，兩瓣滿月臀被肏出道道蕩漾的肉波，手中擼動陽具的速度愈來愈快。\n\n“嗯……齁齁齁????……你好棒……怎麼會這麼棒……不行了????……朕本宮快堅持不住了……美穴被蠻人的大宗筋插得好爽????……”\n\n“朕的宮口被一頂一頂的……怎麼辦……噢齁齁齁齁????……朕真是混蛋……是妖後是昏君……呼噢????，完了……快泄了朕要泄了……讓他射進來的話，朕會變成徹裡徹外的蕩婦了????????……”\n\n“朕要敗給這根大宗筋了……怎麼會如此……噢????朕不配做皇帝了……不配做琅兒的母后了????……對不起琅兒，朕不是人不配做人……噢齁齁齁????????????……”\n\n女帝很瘋狂。\n\n但也難怪，鳳凰欲火本就讓她的性欲比其餘女子旺盛，屄戶名器更是讓她在交歡之時，快感加劇提升。\n\n更別說此次是久別十數年的交歡。\n\n滾圓鼓翹又肉感多汁的女帝熟臀在黃豐手裡，恣情抓弄成各種模樣，一杆九寸蠻族陽具貫穿在臀瓣間。\n\n黃豐已經很是配合地往前頂，往前抽插。\n\n但漸漸也開始到力不從心，不是他不行，而是身前的女帝每隨著他將陽具抽出，便會立馬向後回含和他重新撞擊在一起，動作之嫺熟，動作之淫靡。\n\n讓黃豐真的很懷疑，不是他在上女帝，而是他被女帝上了。\n\n事實也很接近於此。\n\n啪啪啪啪啪——\n\n“嘶噢嘶噢????……齁齁????……朕快要去了。”貼在牆面的女帝，紅唇逐發張圓，鳳眸低垂仿佛望穿牆壁：“被貫穿了……受不了啊????……齁齁齁齁????????。”\n\n眼觀此狀，黃豐更是用力抓緊了女帝的美臀，咬緊牙關，胯下的陽具插出殘影：“……陛下你的美穴夾得奴才很緊……真的好緊……是不是以前都沒人這麼插過你啊。”\n\n聞言，女帝鳳眉微微皺了皺，卻沒太大動靜，紅豔朱唇仍舊向外呵放熱氣，鼻腔喘著呻吟：“啊????……是麼……你個狗奴才……那還不快再用點力肏朕，噢齁噢齁????……來了來了，宮房又被刮到了……要丟要丟????????。”\n\n黃豐咧開嘴陰陰笑著，最後狠狠往外一抽：“陛下，準備好了，奴才要射精陛下的美穴裡了。”\n\n“好！來吧……射進朕的穴裡????……朕要被射了……要被蠻人播種了????……要懷上這蠻人的小雜種了????。”\n\n女帝雙眸飽含春水，如此大動作的抽插讓她身體感到極為的饑渴，穴肉不斷的痙攣，聲音高昂地呻吟。\n\n在黃豐龜帽即將被動猛插進她體內的前半刻，女帝美臀驟而主動向外貼了上去：“噢????小雜種來了……噢齁齁齁????????！”\n\n啪地一聲肉撞，黃豐龜帽和女帝宮口發生劇烈的撞擊，一股溫燙的陽精自馬眼噴射而出，短暫濺射到女帝宮口美肉。\n\n女帝忍著刺激痙攣，鼻腔呼出長長的哼吟，腰肢向外拉動。\n\n粘滿淫汁白濁液體的九寸陽具從穴中脫出，繼而，女帝手抓黃豐宗筋，輕輕擼動刺激黃豐繼續射出陽精。\n\n如此畫面，隔著投影，隔著牆壁。\n\n跪在地面上的少琅，抬頭望著母后手抓蠻鞭，那淺金色鳳眸略帶迷離，又似斜眼鄙夷譏嘲著自己的神情。\n\n幾乎在黃豐被女帝擼動泄陽的同時，少琅的陽精也射向了牆面，流延一片。"}, {"title": "第7章：蘇清璃", "content": "盤膝打坐在木床上的禿奴老和尚聽見聲音：“你來了。”\n\n蘇清璃蓮步緩緩地走入房中，目光幽幽：“我要的東西呢？”\n\n老禿奴聽著話，睜開昏松的雙眼，上下打量一番蘇清璃後，微嘲一笑：“仙宮宮主就是這樣子求人的？”\n\n被老禿奴的眼神拂過，蘇清璃感覺雞皮疙瘩都起了一身，冷然道：“說吧，這次還要什麼條件。”\n\n“真是的。”老禿奴說著笑吟吟站起，走到她身旁，抬起手勾住她的下巴，上下觀摩一陣，如白玉滑嫩的容顏無有一處死角，真是好看。\n\n尤其是那出塵頗具仙意的眼神，在被他觸碰時散發出的倔強與不安，讓人想蹂躪一番。\n\n“堂堂仙宮宮主，想續他人壽數不得求人，依老衲看，今夜不如就將這身子作為條件交換如何？”\n\n蘇清璃身子打了個哆嗦，蓮白赤足蜷縮地挪移幾步。\n\n“想走？”老禿奴笑道：“那宮主可得好好想想，是你父親的命重要，還是……”\n\n說著，老禿奴放在蘇清璃下巴的手，開始沿著精緻雪白的脖頸，劃過鎖骨，撫摸而下：“好嬌嫩的胸，好握的小腰，好滑的美腿。”\n\n蘇清璃眼中滿是鄙睨和不甘，冷哼道：“魔宗即是魔宗。”\n\n“哼哼，宮主再嘴硬，不還得落我手上？”老禿奴笑眯眯道：“以你的姿色當是冠絕九州，仰慕者無數。只是這些仰慕者應該怎麼都想不到，他們日日夜夜蒙昧以求的仙子，會為了救父親，而被我如此褻玩吧？”\n\n老禿奴的話，一句句鑽進耳朵裡，就如一把把重錘，砸在外頭屏息偷望的蘇雲心裡。\n\n瞧蘇清璃沒什麼反抗的模樣，老禿奴撫摸在腿上的大手向上魔挲，臭嘴湊到她耳邊：“你應該知道接下來怎麼做吧。”\n\n蘇清璃呼吸稍稍急促，蠻人葷重的味道充斥得在鼻腔內，導致都有點暈暈的，甚至想吐，但在外人面前，她神色依舊淡然，只是緊繃的身體，暴露了她無法言喻的羞恥。\n\n接下來，姑姑緩緩解開了腰封，褪下衣裳，露出了凝脂般的香肩，雪白的山巒嬌乳清晰可見。"}, {"title": "第四章：仙子墮凡塵", "content": "月黑風高。\n\n老禿奴的話一句句鑽進耳朵裡，就如一把把重錘，砸在外頭屏息偷望的蘇雲心裡。\n\n瞧著蘇清璃沒什麼反抗的動作，老禿奴撫摸在姑姑腿上的大手，開始向上魔挲道，臭嘴湊到她耳邊：“你應該知道接下來怎麼做吧。”\n\n蘇清璃呼吸稍稍急促，神色淡然，只是緊繃的身體暴露了她無法言喻的羞恥。\n\n接下來姑姑緩緩解開了腰封，黛青長裙承風而下，落在地面之上，遮蓋住女子赤淨的美足，淡淡的月光從窗戶透了進來，凝脂般的香肩，雪白的山巒嫩乳，白湛湛的身軀在微弱的光芒之下晶潤如玉。\n\n“嘖嘖。”老禿奴在蘇清璃身邊環顧一圈，稱奇道：“肌膚有如白玉觀音，妙哉妙哉。”\n\n窗外的蘇雲眼中也是閃過震驚之色，顯然無法接受房內的一切。\n\n“傳聞仙宮仙法追求純靈，女子修行不可破身，不知是不是真的？”\n\n蘇清璃輕咬唇瓣，白脂如玉的身體被迫感受著一隻粗糙的大手在身上隨意遊走，一陣陣虛弱感從內裡湧來，老禿奴在耳邊的氣息猶使人感到燥熱，內心裡莫名升起無法言喻的感覺，有恥辱，有渴望：“我既隨你所願，你還這般折辱，就不怕事後我滅了你整個歡喜寺？”\n\n聽著蘇清璃的威脅，老禿奴非但沒停止，遊走在她身上的大手變本加厲的探向世人嚮往的仙宮源泉：“凡人有語，一夜夫妻百日恩。更何況你……”\n\n作為女人最為敏感的地方被襲擊，就算是冰清玉潔的玉女內心都會蕩漾兩分，而老禿奴挑弄的大手仿似有著無窮魔力，每每令人戰慄顫抖。\n\n蘇清璃知道，此刻她如再不掙扎，繼而順從老禿奴的話，身子定然就此染上污穢，但就算抗拒又如何？\n\n遠在京城，曾貴為夏朝將軍的父親，久經戰場風沙。\n\n但在兩月之前，夏朝女帝屢任了親妹東方貞兒為涼州撫蠻大將軍，父親歸田卸甲榮歸京都，忽然染上了蠻界內臭名昭著的‘煞毒’。\n\n此煞毒以死人殘念精魄煉製，攻取心神，染上者七魄如遭烈火焚毀，三魂不聚，命數被幽冥浸染，不出七七之日，便會命喪黃泉。\n\n即便是洞虛出手，也僅僅只能為其吊著一口氣，暫且留於凡間。\n\n蘇清璃通過多方探查，得知煞毒製作之法緣於歡喜寺後，便到此求人解毒，期間被老禿奴折辱威脅，脫衣弄舞，玩弄玉足之類的事，都已經被試過幾次。\n\n但是被老禿奴威脅踐行苟且之事時，她內心一直過不了這個檻，不願委身於如此醜陋之人，才將此事拖到了現在。\n\n“……更何況如今夏蠻兩國再無戰事，只會對人道大為補益，屆時人道信仰反哺仙道，我等修為都會大有上進。貴為仙道正宗之主，理應也不會為了私事襲我歡喜寺，讓凡間再起戰事，至世間生靈又淪塗炭吧。”\n\n趁著蘇清璃心思飄離，目光散亂時，老禿驢的低語再次從她耳畔襲去：“本座曉得宮主一片孝心，才答應出手相助，但不付出點東西就從幽冥地府搶過一條人命，幾乎是不可能的。這麼多天以來，宮主莫非還不懂嗎？”\n\n蘇清璃聽著，崩緊的玉體稍稍軟化，低聲訴道：“你我之間的交易僅此一次，事後你保我父親之命，我二人再無瓜葛，這你得先答應我。”\n\n言語之氣，似如遊絲。\n\n蘇清璃知道此話一出，便相當於清白委身於人，此副身體會交由他隨意玩弄，作為仙宮正道之主，冠絕九州的仙女形象將燙然無遺。\n\n可是又能如何？\n\n人在世上走一回，身體髮膚受之父母，若是連雙親都無法護佑，她蘇清璃，如何問道長生，談何成仙？\n\n其實在今日踏入此處之前，蘇清璃就已做好了最壞的打算，當一位女子在失去抗拒之心後，被玩弄的身子就會緩緩被無與倫比的爽感充斥，逐漸墮落至欲望的深淵。\n\n而所謂的墮落，傳神於墮字，它代表了自我意識正在心甘情願的慢慢沉淪。??\n\n“識趣！可堂堂仙宮之主的身子，如醉情軒的女修一般浪蕩。”老禿奴譏笑著，摩擦著蘇清璃玉泉門戶的手忽然停下，抬到蘇清璃俏顏之前，甩了甩濕漉漉的手指：“真的好嗎？”\n\n望著老禿奴濕漉漉的手指，其上沾滿了她不自禁流露的淫水，蘇清璃的玉耳霎那間變得緋紅。\n\n她明明從未經歷過人事，身子怎就在被輕輕挑弄後，變得如此淫糜呢？\n\n這還僅僅只是用手，要是……要是用男子陽根歡好的話，又會變成什麼樣子呢？\n\n蘇清璃複雜的內心狂跳了一下，目光慌亂地掃過老禿奴下身的某個位置，不抗拒不代表她不會羞恥。\n\n對了自己變成這樣，不還是因為羞恥嗎，絕不是渴望什麼導致的！！！\n\n沒等蘇清璃繼續默想身體的變化，老禿奴笑意吟吟的坐到床邊，蒼荑大手挑拔起腰間系帶，展露雄風：“既然宮主能做交易，那便先讓本座看看你的誠意吧。”\n\n蘇清璃赤裸地站在房中，清澈的眸子望向老禿奴胯下的陽根巨首，嬌挺的酥乳不自情巍巍顫顫，兩條修長軟滑的雪白玉腿含羞夾緊，試圖掩飾玉戶門前泉水細流的靚麗風景。\n\n沒多少掙扎時間，蘇清璃輕輕邁出雪白皎潔的玉足，腳脖子系掛的鈴鐺，隨著步伐叮鈴作響，如朝著前方無盡深淵行走，響起的哀鳴。\n\n此時。\n\n門外的蘇雲緊實著拳頭，指甲已紮進皮肉之間，隱藏在黑暗中的眼神、面容、情緒雖然都沒有表現出絲毫不妥，很是沉靜，但內心的苦悶又是他人能懂的？\n\n姑姑在房內和老禿奴之間的對話，猶如刀割在心頭肉上般疼痛。\n\n他卻只能呆在房外，就這麼靜靜望著，有宗親之情的姑姑走到老禿奴身前，白皙玉腿緩緩屈下，跪在老禿奴的身下，伸出纖纖玉手握住老禿奴身下那根醜陋的陽具，柔和的搓挵起來。\n\n比起黃豐那蠻族小鬼的巨長陽根，老禿奴明顯不及。\n\n但是老禿奴的的陽根蟒頭同樣無比巨碩，近有女子拳頭大小，傲人的龜冒充血通紅，莖身密佈的筋絡似如游龍弓腰，十分駭人。\n\n股股刺鼻惡臭的味道從中散發而出，即便是身為洞虛的蘇清璃，擁有著明台清水般的心境亦受到了不少打擊。\n\n而對老禿奴來說，在被姑姑纖細玉手碰觸到的一刻，渾身是熱流直湧。\n\n皺紋密佈的醜臉興奮漲紅，乾枯蠟黃的大手順著蘇清璃柔膩的鵝頸往下滑動，隨後把握住其聳挺豐盈的玉乳，手指稍用力的掐住佳人殷紅若血，沁人嬌羞的蓓蕾，開始揉、搓、拉、擠、肆意把玩。\n\n老禿奴身為歡喜寺住持，拜寺入門已有七十餘年光陰，如此長久的時間內，對玩弄女人的方面可以說是身經百戰的老手。\n\n這套搓揉手段往她身上一使，對於蘇清璃這種還處於三十多歲，正是如狼似虎的妙齡，又未經過摧殘的黃花處女身子，根本難以消受。\n\n蘇清璃瞬間被撫弄得直觸雲霄，腦子隨之變得迷糊空白，無暇如玉般秀美的瑤鼻，喘息聲愈發急促，峨眉緊緊蹙起，宣示著內心最後一絲不願。\n\n那讓世人一度垂涎的玉潔身子不爭氣顫慄著，暴露渴望男人摧殘的念頭。\n\n“嗯！？”\n\n驀然間，蘇清璃驕哼一聲，老禿奴糙粗的小腿忽貼靠在她的身前，枯瘦的腳趾隱隱豎起，頂在她的溝壑玉戶之間，微微蠕動，激起萬分的空虛與酥麻。\n\n“髣髴兮若輕雲之蔽月，飄颻兮若流風之回雪。即使是最高貴的女子，最終不還得釵橫鬢亂體橫陳，屈人身下任尋歡。”\n\n老禿奴邊玩弄著蘇清璃嬌挺的玉乳，另一隻手則撫摸著她柔順的墨黑長髮，說道：“想當年老衲親赴仙宮求道，爾師傅對我不理不睬。是曾想五十年後，她的弟子會曲意逢迎地跪在老衲塌前？”\n\n蘇清璃眉目淒迷，雙頰滲著潮紅，對老禿奴訴說的前塵往事不作回答，柔荑素手摩擦著老禿奴的陽根。\n\n由於其陽根粗壯，一隻手握不下，只得雙手並用地起伏套弄，胸前美肉也隨著動作飛舞，一時間可謂美輪美奐。\n\n既然今日的蘇清璃難得臣服討好，哪怕是有所原因。\n\n但在此刻，蘇清璃對他的一些要求基本是不會反抗的。\n\n那麼就必須趁熱打鐵，女人的身子都是可以征服的，一旦開了閥口，未來就沒有關上的道理。\n\n蘇清璃展露出如此勾人的一面，即便是閱人無數的老禿奴也默默咽了口唾沫：“真是天資嬌女，只可惜這麼點手段可討好不了老衲。”\n\n聽聞言的蘇清璃，套弄陽根的雙手頓了頓，呼吸明顯急促，胯下玉泉門戶被老禿奴枯黃的腳趾撥挵，受到刺激的門盈變得異常滑軟黏濕，身子一震一震的，羞憤地咬著下唇：“那還能怎麼做？”\n\n察覺著蘇清璃雖還有些掙扎，但抗爭的力度並不強烈，老禿奴陰嘴一笑，左手沿著她的秀髮，撫過白皙無暇的臉蛋，順著眉，眼眸，瑤鼻，最後停在其透紅軟潤的唇瓣上。\n\n能夠以短短數十年光陰，問境洞虛的修士都不是什麼笨人，蘇清璃對於床上之事的認知雖有點不足，也不笨蠢。\n\n絳唇被手指碰觸的瞬隙，蘇清璃便明白了老禿奴的意圖：“這樣不行。”\n\n然而老禿奴可不管蘇清璃願不願意，枯瘦的大手輕輕托起蘇清璃的下巴：“都到這一步了，宮主再退縮，我歡喜寺從今往後可就不再接待宮主了。”\n\n言從意賅，就是蘇清璃不願意的話，從今往後就別再踏入歡喜寺，如此不留餘地，救人之事自然也沒得再談。\n\n“能不能不用那裡，只要不用那裡，你……你做什麼都行。”蘇清璃玉手微顫，明顯緊張套握著老禿奴的胯下陽物，語氣嬌弱道。\n\n“嗯……！”\n\n就在蘇清璃試圖做著最後的努力，希望老禿奴放棄此舉的時候，老禿奴枯瘦的腳趾向著她玉戶輕輕擠進去半分。\n\n凝脂般的臀丘立馬緊繃起來，蜜道裡回應流出一股陰液，感覺就像小蟲爬過私處，帶來陣陣酥麻和難受。\n\n突然遭到襲擊的蘇清璃，黛眉猶蹙，止不住地發出吟叫：“啊……你嗯……怎麼可以？”\n\n“乖乖聽話，就不為難你。”老禿奴用腳趾折磨蘇清璃好一會後，站起身，蘇清璃的溫潤絳唇隨碰觸到昂首的巨龍，嗤聲道：“來吧！”\n\n唇瓣柔軟得讓人心蕩，不等蘇清璃反應過來，老禿奴雙手抓著她的秀髮一拉，唇瓣分飛，皎白細齒短暫的拒絕半刻後，便漸漸張開，傲人巨龍就這麼緩緩沒入檀口之中。\n\n溫熱的唇舌，在接碰到禿奴堅硬碩大的蟒首時，是一頓退縮，但後無可退之地的唇舌又能逃到何方？\n\n蘇清璃難受得作嘔，可陽物被堵在唇中，清澈的雙眸隱隱顯出滴滴淚光，粗大傲人的巨龍和她溫柔的小嘴形成了鮮明的對比。\n\n即便再不情願，巨龍已然完全充斥她香潤的口腔，唇舌被迫地包拂起惡臭的蟒頭。\n\n隨著龐然大物一寸寸深入，感受著蘇清璃柔潤唇肉的燙貼包裹，老禿奴舒服地激靈一顫：“嗚……舒服，真他娘的舒服！！”\n\n在夏朝九州境內， 淫叫聲，也逐漸被自責的思緒代替。\n\n房內的姑姑在老禿奴的攻勢下，逐漸說不出完整的話語，只能斷斷續續的附和喘息。\n\n“嗯……喔……咿……瘋了齁????！”\n\n“舒服嗎？蘇宮主。”\n\n“喔你……別……齁????用力……齁齁????????！”\n\n“看老衲肏不死你，夏朝的女人還真是淫蕩。所以到底是別用力，還是用力啊？”\n\n“噢……別……嗯……用用力！齁齁齁齁齁齁齁????????！”\n\n“那蘇宮主以後可得聽話，老衲會好好用力的，常常使用你的。”\n\n“啊……不……我……咿……要泄了……齁齁齁！????????????”\n\n瞧著姑姑愈發淫蕩的樣子，老禿奴加大了抽插的幅度，每一下都直紮花心，隨著抽插，姑姑粉嫩的花唇拉出絲絲黏液，形成‘噗嘰噗嘰’的擊打聲，擊打在蘇雲的心房上。\n\n而姑姑的玉戶陰阜還是本能迎合著老禿奴的抽插，濕滑緊窄的嫩肉不斷吸吮磨裹著老禿奴的陽根，陣陣快感充在老禿奴的腦門，痛快的一嚎道：“來了，來了。要在蘇宮主的生命源泉裡播種了，準備好吧蘇宮主！”\n\n“什麼……播種？……你……怎可以……不行齁????”\n\n“要……要……要瘋了嗯嗯????”\n\n“咿……齁????……你這……快……拔……嗯喔……別……停下……齁齁齁????????????????????????????”\n\n聽到播種一詞，蘇雲也是猛然一震，難道……老禿奴要把陽精灌到姑姑身體裡，不要啊！\n\n房間內。\n\n姑姑身子急促聳動顫抖著，絲毫沒有掙脫的辦法，螓首眉眼緊蹙，玉戶蜜穴潺水直流，泉道嫩肉不受控的巍巍吸吮著陽根。\n\n老禿奴明顯感受到胯下美人的陰道花心，像張小嘴似吸吮著自己的蟒首，難以形容的爽快感襲擊而至，一聲大笑後。\n\n碩大蟒首死死的頂在花心小嘴上，濃臭的精液隨即射進了蘇清璃孕育生命的花房。\n\n約莫連續射了十數息時間，老禿奴身子顫慄兩下，陽根才從姑姑的陰阜緩緩退了出來。\n\n燙熱的精液明顯帶給了姑姑無比尋常的感受。\n\n衝擊得她美目向上翻起，出塵如仙的面容露出一副欲仙欲死的銷魂模樣，絳紅檀唇一張一合，呵氣如蘭嬌喘著，全身癱軟在床上不停的痙攣。\n\n夜裡。\n\n升至高空的弦月，早已不是前人仰望過的明月。\n\n望不見的深處，一層烏雲遮掩而過，古老的悲哀漸漸將她填滿。"}, {"title": "第八章：柳舟月", "content": "三聲鼓掌的聲音從房中響起。\n\n在床靠近投影牆壁，幔帳之後，走出一道瘦弱醜陋的身影。蠻人黃豐手鼓著掌，面容取笑：“好一出師徒深情，看得黃某都感動了。”\n\n站在房中的柳舟月笑容頓失，\n\n對待蘇雲媚意盈盈的杏眸，變得\n\n冷冷瞪著黃豐：“你還不走？”\n\n“走？笑話！”\n\n牆壁投影中蘇雲出現在會場東側的入場通道中，主准入賽場，房中床面一陣抖動，柳舟月被黃豐撲倒在床面上。\n\n“衣服穿這麼快，頭髮紮那麼好，嗯這鞋子倒挺優雅的。”\n\n撕拉一聲。\n\n黃豐將柳月雙腿抬到身前，又將道袍撕開，豔光奪目，繡著荷花藏鯉的肚兜露出空氣中，兩團玉白在肚兜下翻湧，鯉魚生動跳躍。\n\n“只可惜，那人看不到。”黃豐賤兮兮道。\n\n柳舟月撇過臉，不想望著身上醜陋的人，兩腿顫慄著，獨剩兩對白鞋在空中抗拒舞蹈。\n\n把玩著柳舟月長腿的黃豐，手慢慢從腿畔，伸到鞋面：“徒兒可以等得，哈哈哈哈，等什麼？”\n\n話畢，鞋和臼襪掉落到地面上柳舟月感覺玉足上傳來熱氣，忽意識到黃豐在做些什麼，嬌軀一顫，杏眸冷冷人過來，望著黃豐含住自己的腳掌。\n\n潔白的玉足被玷污上蠻人的口水，柳舟月柳眉緊豎，冷道：“齷蹉，你就會這些手段？”\n\n“嗯，國師的足還真是鮮甜。“黃豐發出舒爽的聲音，嘿嘿笑了起來：“我當然還不止這些手段。”\n\n從口中脫困的粉嫩玉足在光影下顯出幾分晶瑩，微微弓著，其後黃豐手放在了荷花藏鯉上，慢慢地往下撫去，最後停在肚兜下的臍眼上：“這麼久沒見，國師怕不是忘了滋味。”\n\n柳舟月冷冰冰道：“哼，能有什麼滋味？。”\n\n“是麼？”黃豐腰一挺，柳舟月兩腿也不掙扎地攤在床面上，忽然她身體一顫，一根巨長硬朗的陽具抵在了胯下，炙熱的氣息隔著褻褲傳導，九環玉壺感受到男人的氣息，蜜汁欲欲而出。\n\n但這次，柳州月心頭浮現出與蘇雲在拘龍山修煉的一幕幕，又強行將欲望壓下：“等下……啊！”\n\n柳舟月還沒來得及張口拒絕，褻褲被黃豐褪下，陽具莽撞地擠開她的蜜穴唇瓣，狠狠沖進她的身體裡。\n\n一環兩環三環……九環。\n\n名器九環玉壺被突破帶來的快感使得柳舟月渾身顫了又顫。\n\n“唔……唔……唔??”\n\n黃豐將柳舟月雙腿壓在胸前，身子也隨即壓了上去，渾圓的美臀漸離開床面，粗長的陽具就這麼在柳舟月蜜穴噗嗤噗嗤不停衝撞，蜜穴唇瓣被禽弄得翻進翻出，九環玉壺內的嫩肉無法控制地將其包裹纏繞。\n\n黃豐的臉靠向柳舟月，譏笑道：“怎麼樣，大國師，想起滋味沒有，想起來那天在叢林變成母狗的滋味沒有？”\n\n只是這回，柳舟月正眼都沒瞧上他一眼，縱使蜜穴被黃豐的陽具塞得滿滿的，內得淫水密佈，鼻腔中不自禁哼出呻吟，也只是冰冷冷說著：“你要做就快些，別那麼多廢話。”\n\n“哼哼，看來國師是真的滿足了。”黃豐的大陽具還在不斷進出沒入柳舟月的身子，一下下深深地肉著，將蘇雲的休息床面澆滿二人交合流出的淫水：“但國師明明已經拿到了神龕，又拿到瞭解藥，為什麼還甘願和自己做呢？”\n\n對此，柳舟月沒有回答，她自然有自己的理由，只合上雙眸，感覺著侵犯自己的陽具，粗大滾燙，堅硬雄偉，再怎麼控制身體，名器自身淫糜的本性還是無法控制的去迎合，索性她就不再壓制，放開九環玉壺的限制。\n\n即便被禽得嬌喘連連，還不如將這根東西夾死，早點結束折騰。\n\n一直在深入突破的軌頭終於尋覓到花心，黃豐哼地一聲撞了上去，環環疊嶂的穴肉不斷收縮蠕動，無限的快感排山倒海而來。\n\n“嗯嗯唔唔??!”柳舟月冷冰冰的聖潔面容側對著投影牆壁，兩眼含著淚水。\n\n繼而，黃豐將她兩腿岔開，手拉起肚兜，嘴含向了蓓蕾：“國師，母狗，你的騷尻名器太舒服了，呼夾得真緊，母狗爽不爽母狗！”\n\n望著柳舟月紅暈的容顏，眼簾幾欲落下的淚珠，黃豐心中絲毫沒有憐憫，只是充滿了征伐肆虐的衝動，吸吮著嘴裡的香濃軟乳，被舔得濕漉漉的酥胸因為柳舟月的喘息顫抖著，一縷縷淫靡的液體從兩人緊密交合的部位滲透而出。\n\n九環玉壺早就不放棄抵抗，股股酥麻感，癢酸感想著四肢，頭顱蔓延，不同以往地在叢林交歡，那時候的她忘乎所以，覺得世上已經沒有什麼東西值得自己去爭取。\n\n但現如今不同，她有了一個很好的徒兒，柳舟月咬著牙，儘量不想讓自己發出浪叫。\n\n在柳舟月體內抽插了數千下後，黃豐扶起柳舟月渾圓翹挺的肉臀，長物幾乎完全吐出，獨留下龜頭。\n\n“母狗，我要射進去了。”黃豐低吼著，粗長的陽具狠狠深深刺入柳舟月體內。\n\n柳舟月沒有制止，聖潔面容上滴落淚珠，牆面上投影著蘇雲開始比武的畫面，九環玉壺被狠狠地突破，抵在花心，無上的快感驚心動魄，她只能極盡全力控制花房禁閉，不讓黃豐的精液邁進宮房。\n\n但無論在怎麼控制，如此滾燙的精液還是難免跑了進去。\n\n為了蓬萊島記載之事，也只能讓你晚點死，柳舟月杏眸刮向趴在自己胸脯上的黃豐，冷道：“舒服了，快不給我出去？”\n\n“嗚呼，才一次怎麼夠，來我們繼續。”\n\n“不要，你給我滾……????！！”\n\n房中鶯鶯燕燕，悲慟如歌，會場比武臺上，旌旗獵獵，白衣簌簌。"}, {"title": "第九章：岳侜兒", "content": "身體在考慮中漸漸沒有了什麼掙扎，岳侜兒平靜的站在了潭水之中，感受著背後的人揉搓起自己的酥胸，渾圓彈嫩的乳肉被揉搓得搖搖晃晃，蕩起陣陣迷人乳浪，黃豐手指還不停剮蹭胸前的蓓蕾。\n\n“你不只是一個極品的女人，還是一個聰明的女人，你應該知道怎麼選擇。”\n\n扭頭望著黃豐一臉玩味的模樣，岳侜兒內心啐罵著不要臉，冷冷問了句：“記住你說的話。”\n\n“當然。”黃豐點點頭：“只要再做一回，我就把東西給你。其實你也沒有什麼吃虧，雲雨之歡時你不是還能享受快樂？最後還能獲得一縷洞虛殘魂，何樂而不為呢？”\n\n說話間，黃豐開始漸漸的脫去了身上的衣服，腰跨壓在岳侜兒潔白腴美的的臀肉上，近九尺的陽具悄然磨蹭到岳侜兒嫩滑的唇瓣下。\n\n岳侜兒神情一黯，後望向不遠處的蘇雲出聲道：“天色不早了，你開始冥想修煉了吧。”\n\n冥想?\n\n趴在岳侜兒背後的黃豐啞然失笑，想不到岳侜兒還有這一手，這女人還是有些聰明的，估摸著是怕交頸的時候鬧出什麼動靜被發現，臨時想出來的：“你這不是在耍賴嗎？”\n\n“只要再和你做一次，就把神龕殘魂給我，這可沒什麼耍賴。”\n\n答覆黃豐的話語後，岳侜兒瞧向蘇雲的方向，看上去，徒弟有些疑惑不解的，她又開口說道：“你是不想修煉嗎？”\n\n過了會，蘇雲的聲音傳來：“沒有，師傅。”\n\n“徒兒現在就開始打坐。”\n\n說完，蘇雲便背對起石面，雙腿盤膝而繞，雙手掐印置於身前冥想起來。\n\n黃豐從石面探了出來：“嘻嘻，這小子還真蠢。”\n\n下一刻，師傅岳侜兒的聲音冷冷升起：“要是讓他發現了，我廢了你。”\n\n黃豐的陽具開始在兩瓣肥美的陰唇間滑動起來，在岳侜兒這副聖潔得完美的嬌軀面前，即便是聖人，欲火都會像沉靜的火山被拋進了火種一下子蒸騰起來。\n\n“來出來，讓徒弟看看你現在的模樣。”\n\n“不行！”\n\n黃豐就像一個惡魔一樣，岳侜兒你不是在徒弟面前被輕薄就感到興奮嗎？\n\n那就讓她離得近點，看看到時候是像上次被肏時擺出一副冷冰冰的模樣，還是會變成一個淫娃蕩婦。\n\n岳侜兒為了得到殘魂神龕，可以妥協任何事情。\n\n但此時徒弟就在不遠處，答應和黃豐在雲雨一回已經夠挑戰她的道德底線了，要是再走近些，估計就不行了。\n\n為什麼不行，在喜愛之人的兒子面前，在自己的徒弟的身前做這些事情，哪怕是看透紅塵肉欲的她，也還是感覺太羞恥了，這種羞恥還伴隨著一種強烈得讓人內心戰慄的禁忌感。\n\n足矣讓人心顫。\n\n黃豐醜陋的臉龐上勾起了一抹得意的弧度，女人總是口是心非的動物，身體明明已經饑渴無比，嘴臉卻宗喜歡裝成是個貞潔淑女。\n\n—————————\n\n羞月星光朦朧，柳腰款擺春意濃，檀口輕喘氣若蘭；酥胸蕩漾，涓涓雨露流過水仙心，嬌嬌鶯語千般旖旎；泛雨乘舟，縱新人勝舊，蘇郎面前暗淚流，驀然回首，忘憂山下誓盟已舊，人消瘦，心傷透。\n\n雖然理智佔據著岳侜兒的思緒，可心裡再不順隨，赤身裸體的讓人抱著，被那蠻人獨特的陽剛之物摩擦在她的瓶口，身子都不由的軟了半邊。\n\n“口是心非的女人，身體明明都這麼熱情了，嘴上還裝什麼貞潔玉女？”黃豐趴在岳侜兒的身後，輕輕的在耳畔說著。\n\n岳侜兒體表浮起了一層層密密的汗珠，白嫩嫩的肌膚似乎被挑逗得愈發暈紅，聽聞黃豐的話語，她沒好氣的冷道：“要做就做，別磨磨蹭蹭搞些有的沒的。”\n\n黃豐對此微微一笑，面對曼妙的肉體，一反常態的沒有急於享用，蟒首停留在屄戶瓶口，時不時挑逗得勾挵一下，又在背後握住岳侜兒的酥乳，手指輕輕的撚著乳尖兩點蓓蕾。\n\n在蘇雲面前，岳侜兒似乎失去了主導的地位，她又怎麼可能在徒弟面前主動的讓別人的陽物放進體內呢，然而就是因為這樣，步子都變得軟軟起來了，開始被黃豐帶著慢慢朝盤坐冥想的蘇雲走去。\n\n從十數步到數步，到兩三個身位的距離。\n\n岳侜兒滿臉紅暈，眉眼淚花片片，那盤坐的身影映入眼中的愈發模糊，從墨灰長衫到青白布衣，他們的面容真的長得很像，就是現在的蘇雲比起他，臉上還是少去了些許滄桑的紋理，但他們父子真的就像一個模子構造的產物，太像了。\n\n啪啪——\n\n一番玩弄下，岳侜兒已經被架著來到了徒弟的面前，只聽到啪啪的兩聲響起，背上像騎馬一樣趴著的黃豐抬起手，用力向著岳侜兒兩瓣翹臀狠狠的拍下，臀浪重重。\n\n思維發散下的岳侜兒頓時渾身一緊，腿畔的美肉用力的崩實，淫靡的臀肉被扇得顫了又顫，一直被磨蹭的門戶下，忍不住滴落下不少透徹的汁水。\n\n要得到岳侜兒的身子很容易，但要讓一位女性洞虛修士沉迷在這種肉欲的暢快感中，就是無比的難度了，但在黃豐的眼前，這種事情似乎也不是很難做到嘛。\n\n“在你徒弟面前跪下，我要進去了。”黃豐雙手拉開岳侜兒的翹美的雙臀，往前含住了岳侜兒柔軟的耳垂，舌尖一圈圈的舔過耳廊，‘簌簌’的吸吮聲酥酥麻麻的灌入岳侜兒的耳中。\n\n對比上一次和黃豐苟且，全程基本都是由岳侜兒主動的，那時候她心裡只想著“成大事者不區小節”。期間根本沒有享受交合過程的念頭，就那麼騎在黃豐身上，讓胯下的小鬼泄了精元就完事了。\n\n可這一次，在蘇雲面前，在這個填補了她對蘇青山逝世空虛感的徒弟面前，這個出現在自己寂寞人生路上不過一會的新曙光面前，感受的完全不一樣的。\n\n黃豐的挑逗，背德的禁忌前，岳侜兒渾身嬌顫，莫名的變得疲軟迷離，身子已經完全沒有忤逆黃豐的意思了。\n\n在黃豐的要求下，岳侜兒纖長的美腿就這麼緩緩的彎了下去，跪在了徒弟面前，甚至不由自主的別開了雙腿的內側，花穀甬道流出的蜜汁濕透了清香撲鼻的芳草，生理心理雙重的亢奮使得岳侜兒的心跳加快了不少。\n\n為什麼會這樣？\n\n岳侜兒閉起了雙目，羞愧于望向身前徒弟的面容，她到現在才知道，原來這種事情在徒弟面前做起來是這樣的感覺。\n\n作為天下聞名的洞虛修士，聖潔的源泉就要被其他人不應該的人佔用，實在太過於荒繆和淫賤了。\n\n這時候，最亢奮的還是莫過於黃豐，溫香軟玉在懷，龜頭蟒首磨蹭在蘇雲師傅的生殖器下，明顯感受到這個女人的陰阜明顯不同的變化，在蘇雲面前，將他的漂亮師傅壓在身下瘋狂肏弄的滿足感，舒暢。\n\n“我要進去了。”\n\n就在蘇雲身前不過一個身位，師傅的美白翹臀被人拉開，一根粗壯滾燙的東西‘噗呲’一聲刺進了岳侜兒的下體。\n\n勢如破竹般剝開了師傅緊緊合攏在一起的唇瓣，岳侜兒嬌軀顫抖，銀牙嗔得呻吟出聲：“等，啊????……等一下，不行，這樣還是……太，啊????。”\n\n黃豐插入後，望著蘇雲靜坐的面容，岳侜兒有些後悔了。\n\n她應該有更多的方式去謀取這些東西，但長久迷失在蘇青山離世中，岳侜兒都有些忘記了世俗的規矩了。\n\n她是修仙者，但終歸還是一個人，什麼時候連身為女人該守的貞潔都忘了，居然讓人隨心所欲的對自己身子為所欲為。\n\n滋滋滋——\n\n都到這地步了，黃豐又怎麼可能停下動作呢，任由身下的岳侜兒一個勁的狂扭柳腰，試圖拒絕自己的進入，但他的陽根已經向著蜜穴快速抽插起來了，將 連連了，你還遮罩了五識六感，什麼都不知道什麼都阻止不了。你爹是這樣，你也是這樣啊??……齁齁??????????????。’\n\n‘蘇雲，你張開眼睛看看啊，看看人家的大陽具是怎樣淩辱你師傅的啊齁??……你說你長得這麼像你爹，但修行的天賦怎麼這麼愚鈍呢，真就這麼相信師傅，冥想的時候一個心眼都不留啊嗯??????……你知道嗎？蘇雲，有那麼一刻我看你真的很像你爹，很想你能代替他啊噢??????……但不行了現在齁??????……現在師傅已經快被肏傻了??，你到時候還怎麼挽回師傅呢??’\n\n‘這死混蛋的陽具插進來??，好刺激啊??????……嗯??……在徒弟面前苟且真的很刺激??，我對不起徒弟，對不起他??。但師傅現在好爽啊??……嗯好噠??????……要爽死了??，你看看師傅，師傅現在真在被人騎著狂肏，他插到的地方，是你是爹都沒插進去過的地方啊齁齁齁齁齁齁齁????????????????。’\n\n‘其實徒兒你不知道，凡人裡有個傳說，起初師傅也是不相信的。那就是擁有名器的女子都是一頂一的騷屄，只要名器被男人征服……就會淪為他的便奴??而師傅呢，師傅就是擁有名器的女子啊??????……我現在覺得，嗯嗯??這個傳說??啊可能是真的了，因為黃豐頂進師傅的肉壺，說不準師傅就真的會淪陷了嗯??????。’\n\n‘嗯齁齁齁齁??????……黃豐，你再用力點啊??????……再插深點??，插進人家的玉壺裡??，啊唔唔??????……真的要完了，蘇雲、青山，要是師傅淪陷了，可能就得被黃豐用各種姿勢肏了????……????，要泄了要泄了，玉壺要開了，啊齁齁齁????????????，師傅要成他人的母狗了齁??????????????。’\n\n‘大陽具黃豐，大陽具主人，用力肏騷屄，開了開了……用力……齁齁齁齁????????????????????????。’\n\n‘蘇雲，你快別冥想了，看看??……黃豐已經插破師傅的九環了，插進玉壺裡了??，人家把他的陽具吸得好緊啊??，離不開他了……嗯哦??????，在玉壺被插開那一下，師傅渾身都酥酥麻麻的??，陽具摩擦著師傅的騷穴，撐得滿滿了，要上癮了齁??????，你快救救師傅啊……嗯唔??????，這一頂一頂著我壺口，好麻好麻啊??救救師傅，又泄身了??噴了噴了，好多水啊??????。’\n\n‘啊??????…師傅的騷屄是黃豐的了……嗯哦??????……師傅已經離不開他了，和他雲雨之歡都有種問鼎大道之巔的感覺了……齁齁??????，蘇雲你現在不醒過來，師傅師傅……黃豐……主人??，以後侜月只給你肏了，那些男人都太廢物了……蘇雲，師傅以後要做黃豐的妻子了，因為師傅已經被他肏上癮了??。’\n\n‘啊??????……啊主人……主人用大陽具肏我，肏死我吧??。蘇雲蘇雲我的徒弟，你知道嗎，主人他自從見到我的時候就想肏我了，而我為了給你爹盜取殘魂，就從他了??。從那時候我知道了，師傅其實就是個騷貨，故意失身給蠻人，為了報復，為了一解內心的憂思，想讓他把人家肏成傻狗??，現在……嗯唔??蘇雲你抬起頭看看啊，師傅現在就要泄了??……嗯??唔唔????……你的師傅在蠻人的胯下，真的要被肏成母狗??，啊要泄身了??……啊齁齁泄了啊齁齁齁齁????????????’\n\n‘不行不行，齁齁齁??????????，師傅還要把你調教成天之驕子，怎麼可以……怎麼可以被別人肏成隻認得陽具的淫婦呢，但是齁齁??，主人的陽具真的把師傅插得好爽，好想，現在玉壺好想主人把精元播撒在身體裡，但是這樣的話，嗯唔??????……師傅就要給他懷孕了，給蠻人給黃豐主人生一個蠻人小娃娃了，哈哈齁齁??……九州洞虛大能居然想給蠻人生娃娃……好刺激??……一想到這師傅就想泄身啊噫噫??????????????’\n\n‘完了完了，好爽頂到師傅的宮口了，黃豐主人頂著那裡不走了，他要射了，好爽插在那裡好爽……我願意，師傅願意，讓他插進來……播種，來了來了，齁齁齁齁齁齁齁齁??????????????，他好大一泡精元射進師傅騷屄裡了，要懷孕了。’\n\n‘這下完了，好舒服好燙啊????，一直射的不停，這蠻人，主人怎麼這麼能射，肚子都快被撐炸了，像懷孕了一樣啊，漲死師傅了，嗯齁齁??????……蘇雲我的傻徒兒，你可真是一個廢物啊??，連為師變成這樣都不知道，齁齁齁??????????，主人繼續插我，肏死人家，恨死你了傻徒兒！’\n\n花明月暗籠輕霧，岳侜兒語聲輕顫，縱使心裡的想法似乎很多，但這些話，她又怎麼可能將說出口呢。\n\n“騷女人的名器果然神奇……進去了，真是暖和……堂堂洞虛修士的身子居然這麼騷，傳遍九州都沒有人相信吧。”\n\n噗呲噗呲的水賤聲從二人的交合之處響起，趴在岳侜兒背後瘋狂聳動下體的黃豐興奮的喘著粗氣，手指用力的捏起岳侜兒興奮挺立的蓓蕾，九環玉壺被他捅開後，蜜壺肉壁情難自禁的夾吸著黃豐的陽具。\n\n“嗯????……哼你嗯??????，給我住嘴。”\n\n岳侜兒此刻的情況很是糟糕，動欲的嬌軀如饑似渴的吞婪著男人的陽元，一方面她已經被黃豐頂到蘇雲不足半個身位前了。\n\n現在她只能想盡辦法的迎合黃豐，避免黃豐又再用力把自己往前頂，驚醒了身前的徒弟。\n\n岳侜兒衣服剝了個清光，但腳下仍有穿著鞋襪，在一味的情欲驅使下，明顯可以看到足尖用力地崩起點著泥地，鞋面皺起的痕跡，能夠想像到鞋襪包裹下的藕白玉趾，已經是被肏弄，爽到極致的蜷縮弓起來了。\n\n同時，每逢黃豐他那碩大粗壯的陽具在體內一抽又猛的往內一送後，岳侜兒迷離的杏眸瞳孔都會被刺激得睜大。\n\n睜開眼瞧見前方冥想靜坐的蘇雲後，她的柳眉又一下蹙起，唇腔發出極為細聲的悲吟，感受著身下的大陽具龜頭慢慢擠進自己的玉壺花心，岳侜兒的小嘴忍不住噢的一下張開，陣陣麻痹又美妙的快感如同電流般從下身席捲周身。\n\n用如此羞人的姿勢跪在徒弟蘇雲面前挨肏，對於岳侜兒來說真的感受到萬分恥辱。\n\n蠻人渾醜的陽物就這麼在她聖潔的溫床內肆意鞭撻，捅到最深處，碩大的龜頭甚至把她平滑白嫩的小腹頂起一個小小的肉包來，仿佛是要把她捅穿一樣。\n\n來自身體本能的無窮快感令她完全無法作出反抗，隨著每一次泄身，岳侜兒的蜜道就會更加收縮緊實，將黃豐的陽具緊緊吸裹。\n\n“嗯……齁唔????……??”不願驚擾到徒弟的岳侜兒，只能用自己的手捂住絳唇細聲呻吟著，一副失神的模樣望著前方，身子自發的迎合扭動，柳腰一陣陣的禁臠抽搐。\n\n‘捅到了，又被捅到了??。真的完了完了……蘇雲，師傅該怎麼辦啊??，啊啊啊??????……這也太舒服了，好爽，用力肏我??……要暈過去了??……師傅已經數不起第幾次泄身了呀??……還要……齁齁????天呐??，真的不行了，要叫出來了??。’\n\n岳侜兒甩了甩頭，將這些羞恥的想法拋擲一空，銀牙貝齒羞愧的咬緊，但還是避免不了自己的呻吟聲越來越大。\n\n極致的快感和特殊的環境，黃豐和岳侜兒的交合之處產生了一種奇怪的共鳴，一絲絲渾黃的元氣隨即圍繞著黃豐的周身，在抽插岳侜兒的騷屄時，黃豐沒有忘記運轉雙修之法。\n\n“你這……怎麼敢嗯齁??????真實該死！。”雖然岳侜兒幾乎被肏得神智不清，但洞虛修士對於任何靈氣波動都極為敏感，在知道黃豐運行功法的同時她便扭轉螓首，咬著牙冷道：“跟我雙修嗯??????，你是想死了嗎？??”\n\n岳侜兒出言不假，雙修是具備局限性的，一般來說都是修為相近的道侶才會修煉，如果修為不相近，就會產生兩種情況。\n\n一是修為更高者運行雙修功法對低下著進行采元。二是修為低下者對於更高者的補取，只不過後者境界如果跨越很大，雙方出現不配合的情況，修為低下者很容易就會被磅礴的靈氣沖爆靈海。\n\n輕則成為一個廢人，重則身死道消。\n\n沽滋一聲，黃豐猛地用地抓住岳侜兒的酥胸，陽具往外狠狠的一抽，濕潤的蜜道被帶出涓涓的淫水\n\n。\n\n黃豐不傻，他對於歡喜寺的雙修功法他有著很深的熟練度，其次他相信，此時的岳侜兒一定會和他配合雙修，在沒有得到她想要的東西前，他就還有生存的價值。\n\n黃豐倒吸一口涼氣：“瞧你這徒弟傻愣愣的樣子，怎麼都想不師傅現在就跪在身前被我狂肏吧。看看你被我肏到爽翻天，屄水四溢的騷狗模樣，哈哈，接下來你師傅邊被我肏，邊輔助我雙修提升實力，這是你永遠做不到的，只能羡慕的事情。”\n\n岳侜兒聽著黃豐的話，望向蘇雲的美眸顫了顫，冷然出聲道：“你快給我閉嘴，嗯齁??????。”\n\n“國師大人，你準備好了嗎？”黃豐被岳侜兒望向蘇雲的羞愧小眼神，弄得內心蕩漾，下身陽具更是硬朗了幾分，附到岳侜兒的耳畔輕聲喚道。\n\n聽到‘國師大人’這幾個字的岳侜兒狠狠地盯向了黃豐那醜陋怪異，九州人看上去特別難以入目的蠻人面容。\n\n想不到黃豐他居然在這時候，叫起了岳侜兒的真正身份。\n\n沒有顧忌岳侜兒威脅的眼神，雙方都是在高潮泄身的邊緣了，岳侜兒的名器也被黃豐插滿開發過了。\n\n接下來黃豐要做的就是來上一次猛的突破九環玉壺，讓岳侜兒瞬間泄身的同時運行雙修功法，采補她的絲許精元，助自己突破練氣境，成為歸靈期修士。\n\n“住手，該死??……你別想……齁齁??射到最裡面讓我泄了??……別齁齁嗯????????????????”\n\n聲聲嬌嬌鶯語下，黃豐站起身，抬手舉起了岳侜兒白淨的長腿，將二人交合之處懟在了冥想中蘇雲的面前，岳侜兒說話羞憤間，不忍心地望向了自己的徒兒。\n\n那被插得淫水四溢的蜜穴唇瓣，動人的分開還巍巍顫顫的，經過黃豐這種巨物的使用後，張開了一個深深的小洞，時不時收縮著。\n\n下一秒，蟒首對準了岳侜兒的騷屄，迎著蜜穴洞門發起了最後的衝刺，一環又一環的突破，名器動欲泄身隨著一次一次的抽搐，一下比一下劇烈。\n\n岳侜兒被抬起的玉足忘情的蜷縮，足趾驚人的弓成弦月，翻湧的淫水在蘇雲面前流落而下。\n\n隨著黃豐再次突破岳侜兒的玉壺頸口，洞虛級別的泄身陰元乍泄而出。\n\n“嗯齁齁??????住……手啊嗯射進來了??。”岳侜兒揚起潔美修長的脖子，美眸淒冽的看著徒兒，絳唇悶哼著，聽上去也不知是享受還是難受，腦海裡仿佛蕩起了駭浪般的波瀾。\n\n‘蘇雲，師傅要被灌精了??，沒辦法，這大陽具黃豐??……他這樣肏真的好舒服??，肉壁都被他的大龜帽刮爽了，感覺到了好燙好熱，啊齁齁??????????，師傅要去了，要被射暈過去了啊??????????????。’\n\n陽具和蜜穴緊緊融合到了一起，岳侜兒的眼角滑下一行清淚，但流落的淚水可壓抑不住眼中的失望和羞憤。\n\n黃豐也在這一刻插到了盡頭，頂在了壺口前，隨著岳侜兒的開宮潮吹，大泡的精液射進了岳侜兒的宮房玉壺裡。\n\n“好爽，蘇雲快睜開眼，看我射暈你的師傅啊。”而此時沒有得到殘魂的岳侜兒，在泄身的同時也是配合和黃豐完成雙修法，一絲絲陰氣回補到黃豐的身體裡，境界緩緩的攀升開來。\n\n過後。被玩弄到絕頂的岳侜兒，無力的癱軟到蘇雲的身前地面，趴在地上身子不停的痙攣著，美目緊閉，蹙起的柳眉也不知道是回味還是索然傷悲。腿間的兩瓣花唇被插得分離開來，濕答答的小洞流淌著黃豐乳白腥臭的精液。\n\n畫面，淫蕩之極。\n\n夜裡的風聲蕭蕭瑟瑟，水潭邊的楊柳樹無力的垂下了枝葉，倒映在水面的忘憂草影子有些扭曲。\n\n站立在樹林中央的黃豐平復下喘息，境界穩定後，眼神望向了腳下顫巍巍的佳人，嘴角掛起微笑，抬手在岳侜兒的臀兒上拍了一下。\n\n還在暈乎乎的岳侜兒被這麼一拍後，沒有緩過勁的蜜穴淫水潺飛，其杏目微啟，轉眼瞄了瞄黃豐，沒有說話。\n\n下一秒，黃豐又抓起了她的翹臀，按在了蘇雲的膝前。\n\n“嗯！？又來……蘇雲要醒了……混蛋??。”\n\n“本王子還有得射呢，蘇雲冥想怎麼也得天亮，那就再來多幾發吧。”\n\n“不……嗯齁齁齁??????????????”"}, {"title": "第十章：岳侜兒2", "content": "水珠潤滑了雪白的肌膚，濕透的秀髮披散在美背上，黃豐喘著粗氣，雙手摟著岳侜兒纖嫩的小蠻腰，癱軟在了譚邊：“我說國師大人，先前你抓住我脖子說要殺我的時候，不是很孤高傲慢嗎？怎麼現在成這樣了？”\n\n說話間，黃豐粗糙的手掌游走在美人的嬌軀上。\n\n滋滋滋的淫水聲回蕩在這片不大的空間，其中還夾雜著一位望著自己弟子捂住嘴巴，喉嚨時不時發出低吟的雌性聲音。\n\n啪嗒——\n\n柔若無力的玉手打在了黃豐長滿汗毛的胸膛上，低呼出一口遏制很久的媚氣，跨坐在黃豐腰胯上的腰肢止不住的輕顫，貝齒微微腰肢半抹絳唇：“卯時了，你還不走，上官玉合齁??????，她這回估計已經快嗯????……發現東西不見了啊……要嗯??????”\n\n岳侜兒所說的話黃豐自然懂得，只是美人鄉是英雄塚，岳侜兒受不了他抽插自己的玉壺名器，黃豐也不想離開這無限快樂的肉穴。\n\n如此黃豐一副不甘休的模樣，多少個時辰過去，九寸長的陽根還在摩擦著銷魂的玉壺。\n\n而岳侜兒呢，已經被調戲了好一會了，出於心智她一直在抗拒，但每當她打算抽離黃豐的時候，那個該死的傢伙就會頂上一頂，由於她玉壺名器的緣故，每被刮蹭肉環就會潮泄，導致她渾身無力一下。\n\n下身的空虛對比起之前被黃豐插透的滿足對比，兩股矛盾般的感受在岳侜兒心中交替對打。\n\n“這樣吧，再滿足我一次就走，但這回你得自己動。”說話間，黃豐捏了捏岳侜兒的酥胸，隨後抬手拍了拍她的肉臀示意到。\n\n一直被挑逗的岳侜兒有了幾許崩潰之意，黃豐刮蹭了很久的外環，玉壺內空虛的狀態已經將她的身子刺激到了最敏感的狀態。\n\n‘再做一次？’\n\n如此想著，岳侜兒抬眸望向蘇雲的俏臉上，柳眉舒展開來又緊蹙回攏。\n\n‘原諒我徒兒，原諒我青山，再做一次就好，再跟這個混蛋做一次，我就能得到你爹的殘魂，我就回到你身邊繼續做個好好的師傅，就一次。’\n\n這種類似於自我蠱惑的想法出現後，岳侜兒最後留戀的瞧了眼蘇雲，又看向了身下那長得醜陋無比，身材四肢短小，皮膚黝黑渾身長著汗毛的蠻人身上。\n\n在蘇雲那張和他爹一樣俊秀的面容下，黃豐這張臉就顯得非常的污濁難看。\n\n‘很好，你不就是喜歡我這具身體嗎，老娘多少歲的人呢，有什麼不能和你這小鬼頭豁出去的？你要爽是吧，老娘陪你爽。’\n\n此時的黃豐還不知道，何為洞虛的威能！\n\n一直抬在半空含著黃豐龜帽的蜜穴，泥濘的吐出粘滑的汁水，岳侜兒的杏眸中的神態從恥辱轉變到愧疚，直至最後妥協認命般的視死如歸。\n\n“哦，終於想通了嗎？”悠然躺在身下的黃豐打趣道。\n\n“嗯啊??????”\n\n那副有傾國之美的聖潔容顏的絳唇緊然一閉，鼻腔發出主動的呻吟，一雙玉臂忍不住的抬起，抓住濕透的長髮撩到頭頂，凝脂白嫩的長腿微微的彎曲顫抖，臀肉開始慢慢壓下，九環玉壺肉壁的皺褶狂亂的吻向了黃豐巨長無比的陽根，在岳侜兒絕對的配合下，沒有任何阻礙的刺入了熟熱的蜜穴玉壺內，雙方盡情的吸吮纏綿。\n\n一下下突入環壁的刺激如渡雷劫般的電流，流轉全身，使得岳侜兒嬌喘不已，玉壺內分泌的淫液愈來愈多。\n\n“啊啊啊啊齁齁??????????，好漲，漲死人了??。”\n\n空虛的玉壺被黃豐粗長巨大的陽具填滿，這種感受是無比可怕的，就類似于珍貴東西失而復得的感覺。\n\n“舒服，真舒服。”黃豐興奮得大叫。\n\n這岳侜兒的名器蜜道就是比其他女人舒服，就算是最近那個貌美如花，蘇雲的奶娘也比不了。\n\n不過對於黃豐來說，裴皖也有裴皖的好處，在他調教下，裴皖已經到了拍拍屁股就會變姿勢伺候人的地步了。\n\n“嘶哈??????，舒服呵呵，真的很舒服嗎?”\n\n忍著身下無與倫比的滿足感，岳侜兒侜下身子，規模不小的酥乳擠向了黃豐汗毛密佈的胸膛，兩點緋紅的蓓蕾被汗毛刺激得挺立，修長的長腿悄俏抬起壓在了黃豐瘦弱的小腿上，聖潔傾國的容顏貼在了黃豐醜陋臉側，吐氣如蘭：“回答我，真的舒服嗎？??”\n\n黃豐側眼瞄了瞄，也不知岳侜兒被肏傻了，還是著了魔，總覺得這副看上去聖潔的容顏，有些許……些許妖嬈。\n\n未等黃豐回答，岳侜兒魔性的呵呵笑了起來：“其實我想了想，發現你之前說的話很對。沒錯，犯賤的不是你，真正犯賤，犯騷的我才對。明明身體已經抵擋不住，為什麼嘴上還要裝貞潔玉女呢？沒錯，那個愛著劍閣天驕蘇青山，那個曾經想拯救九州凡界的柳舟月，早就在十八年前死了！現在的我是岳侜兒，一個空虛寂寞的女人，僅此而已，哈哈！！”\n\n聲音聽上去魔性，嬌狂。\n\n伴隨著話語聲，岳侜兒沒有再抗衡身體那股欲火，含著大陽具的蜜穴淫水淚汩汩往外留，說罷後緩緩抬起了玉臀，感受起那種滿足又失去的滋味，直到下身含住黃豐的龜帽，又一下子猛地坐下，岳侜兒貼在黃豐臉側的聖容變換。\n\n刺激、滿足、禁忌、背德、傷感到極致的愉悅衝擊著她的內心。\n\n“岳侜兒……你真是賤人……齁??????，勾連外族……嗯啊????……不僅如此……你還是個騷貨……你的騷屄時時刻刻想著被人肏??，想著被人滿足……嗯啊????來黃豐……你個王八蛋蠻族野狗，來啊肏死我啊????????！??”\n\n“呵呵呵，嗯你看抽出來了，是不是不捨得這麼爽的騷屄??，嗯啊齁齁齁????……好刺激??，一下子又插進來了，這該死的肉棍啊??????……麻死我了齁????……怎麼樣??，你不是很能嗎，這麼名器怎麼樣，這陽具越來越燙了呢，想射了嗎??？”\n\n彼時的黃豐驚呆似的張開口，岳侜兒似乎陷入某種癲狂之中，動作變得大開大合起來，不僅用酥胸壓著自己的身子，連同腿也被她給壓住，雙方的地位再一次發生的轉變，回到了數個月前，岳侜兒找他盜取神魂的一晚。\n\n“哦齁齁??????，來肏我，要泄了……泄了啊??。王八蛋……你個低等蠻人……果然也就只有這本事厲害了嗯??????……一下兩下三下……七十下了……你再堅持堅持啊，怎麼憋紅了的樣子嗯??……王八蛋的龜頭現在好硬啊……是不是要來了，嗯齁????賤人的騷屄也忍不住了……嗯齁??????這次我們一起吧一起……一起到神聖的仙境……啊????好燙??射進玉壺裡面了，好麻好酥噢……齁齁齁????????又給人肏泄了……??”\n\n如此之下，黃豐覺得有些頂不住了，沒過上百回合，那根折磨了岳侜兒的陽具就繳了械，大股濃烈的精元灌進了岳侜兒的玉壺內，兩人交合之處嚴絲合縫的交融起來。\n\n“噢呼??????射進來了，好燙好燙??王八蛋的精元好燙，狗蠻人的精元好燙，齁????????????”\n\n臉色紅潤的岳侜兒被射得癱軟在黃豐身上，檀口張開吐著清氣，眼神迷離的往上直翻，白嫩嫩的酥乳將黃豐的頭都埋了進去，腰肢直打顫，擺出一副癡態色相。\n\n但沒過一會，黃豐也還在雲巔之上徘徊，岳侜兒就直起了身，酥乳上的蓓蕾在微光的照射下愈發挺立，兩雙美腿彎曲直起從跪姿換成了蹲坐的姿勢，將兩人的交合之處展示在了眼前。\n\n隨即岳侜兒胯下開始向外抬起，巨大傲人的陽具從她的體內慢慢吐出，表皮上覆蓋了不少交合產生的淫水精漿混合物：“要拔出來了，一環環的出來了，捨得嗎？??”\n\n黃豐正準備回話。\n\n沒曾想，就在陽具快被抽離出去的一刻，岳侜兒又猛地往下一坐。\n\n“還來？”\n\n“嗯齁??????……還沒天亮呢……噢????……昨晚上，嗯??????你不是很能嗎，說天……齁??????亮前還能再做幾回來著，嗯????怎麼嗯??????現在就不行了……就這樣你還想上我？??”\n\n岳侜兒聖潔的容顏出現本不應該出現的魔性笑容，說話間，仍不忘上下繼續榨取黃豐的動作。\n\n男女的區別是什麼？\n\n在大夏的古傳說中，大地始母繁衍出大陸的各種生靈，生靈受到天道之祖的感化，演化出了具備靈智的物種，而其中最接近天道，最為聰慧的便就是人族。\n\n人族有男女最基本之分，它們最大區別在於身體的構造不同，在生育繁衍這方面上，男人精元都是有限的，再厲害的男人在數次泄精之後，也得休息緩勁。\n\n但女人呢，在這方面卻佔據著天利般的上風，泄身不過就是泄身，只要不是雙修下陰元被完全吸收，只要還有體力在，就能一直做下去。\n\n岳侜兒身為洞虛的身體素質自然是強大完美的，即便和黃豐這樣的小修士雙修，陰元也不可能被他完全吸取。\n\n論持久戰，在一開始黃豐可能憑藉粗長巨大的陽物佔據上風，但敵人終究有弱勢的一時，這時候就是岳侜兒反攻的時候。\n\n“王八蛋，你繼續啊??????……現在肏我，哼……嗯????怎麼軟了……這樣只能插到九環了??……嗯????插不進玉壺內……就不能讓……騷屄爽??????……爽齁????爽到極點了……知道嗎嗯齁??????，就這樣還想射到玉齁讓我懷孕，嗯齁????爽不爽??，再把王八蛋的臭陽具夾緊點，插到玉壺裡啊，插啊??????????。”\n\n原本處於主導地位的黃豐，如今優勢被無情的剝奪，無能為力的被岳侜兒蹂躪起來，這是他平生第二次感受到這種感受。\n\n不行，得阻止這個女人。\n\n渾黃的元氣自黃豐靈海而起圍繞周身，黃豐打算運轉起雙修之法對抗。\n\n雙修不止是讓兩者陰陽交匯提升實力，它同時也具備提升性能力，而且雙修的時候，會讓陰補的一方有更大的刺激。\n\n顯然，岳侜兒不想讓它得逞，柔若無骨的玉手隨即搭在了黃豐的肚皮上，五條纖蔥白指分別點在氣海、神闕、天樞、關元、氣血上。\n\n霎時黃豐雙修功法被抑止，渾身的靈力都被封在了氣海內。\n\n吾命休矣!!!\n\n黃豐嘴角抽了抽，他似乎看到了，數月前那個和岳侜兒事後攤在床上動彈不得的自己。\n\n“還想雙修，不怕撐死你個王八蛋？嗯齁……嗯??????”\n\n和黃豐交合，岳侜兒名器帶來無與倫比的爽感，但洞虛終歸是洞虛，她還是保留了神智，阻止了黃豐的雙修行為後，繼續壓榨起了黃豐來。\n\n蹲坐著的蜜穴一上一下含裹著黃豐的陽具，速度之快甚至抽插出了殘影，每次的抽離後又插滿，岳侜兒都已經數不清泄了多少次身，也許是百次，也可能千次萬次。\n\n迷離的雙眼望著遠方仍然在冥想的徒弟，身體裡被蠻人灌滿了精元，岳侜兒的杏眸愈發的迷離，檀口孕吐出香氛蘭氣：“混蛋，賤人……岳侜兒你個無恥的騷貨，在徒弟面前被人肏……騎在別人的身上??，下流的擺動著腰肢，被人內射，這些都是……都是為了你知道嗎。嗯齁??????……徒兒，齁齁呵呵齁??????……你射進來吧，你個王八蛋，不是很想讓人懷孕嗎，你們這些該死的蠻族都喜歡這樣讓九州的女子嗯??????……懷上你們的雜種吧，嗯來啊??????，射我，肏死我我，齁齁????????????????。”\n\n“好喜歡齁??????，師傅的騷屄好喜歡這王八蛋的的粗長陽具噢嗯??，齁????師傅真是個蕩婦，對不了徒弟，對不起青山，原來我是個這樣的淫蕩女人，饑渴著和這個人進行著會懷孕的交頸之歡噢??????，來了，王八蛋又要把一大泡精元射進騷屄的肉壺裡了??，師傅噢????????……要被他肏爽了齁????????????????。”\n\n泄身帶來陣陣酥麻，美妙的玉壺肉腔灌滿了白靡的精漿，岳侜兒揪著秀髮，伸長的脖頸隨著高潮彎腰劃出一條弧線，壓抑多年的情欲迸發而出，發出一聲又一聲的極度愉悅吟叫，嬌軀猛烈的哆嗦抽搐，蜜穴九環玉壺的甬道依依不捨的擁抱親吻著黃豐陽具，一種爽到骨髓刺麻的感覺傳遍周身。\n\n而黃豐就這麼足足被岳侜兒榨出來了九次，已經如同肌無力的死魚倒在了水潭邊。"}, {"title": "第一章 蘇清璃", "content": "入內後的黃豐沒有近前，只是負手站在門外，道著：“黃豐，見過仙宮蘇宮主。”\n\n得聞言，盤膝坐在蒲團上的蘇清璃，不為所動。\n\n黃豐即後撣了眼她身後的畫像，又道：“菩薩肉身佈施，以色止色，以欲解欲。”\n\n說著，黃豐往前走去，來到她身前也沒蹲下，只站著道：“小子很好奇，宮主到底是怎麼想的，難不成真的被烏彧文廣玩弄得耽于其樂？”\n\n聽到黃豐一句句娓娓傳進耳中，蘇清璃頗為驚人的胸脯終究有了些許起伏，順著低領襟角處看去，深深的溝壑白肉宛作羊脂，接而她絳唇輕啟：\n\n“你就是與雲兒互換交流的那位歡喜寺弟子，年不滿十三四，便有這身修為，當真不耐。”\n\n黃豐面對這等假意盡顯的恭維，遂笑了下：“天下傳聞，劍仙上官玉合冷冽寒霜，女帝東方嵐桀驁至極，而你仙宮宮主蘇清璃從不入塵世，仙姿玉色，卻讓山下人絕色難求。你何時對外人，都裝出這副奉承模樣了？”\n\n笑罷，黃豐抬起右手，慢慢探向身前傾城仙容下頜，接而將她的臉抬起。\n\n刹那間，蘇清璃睜開了眉下剔透如清水的美目，被仰起的聖潔容態，哪怕是在當下場面，仍舊充滿了斷絕凡俗仙界般的割離感。\n\n看著身下這張臉投來的美態，哪怕是閱過上官玉合與女帝、國師的黃豐，都不由得感慨：\n\n“真是生得一幅絕美的臉蛋，倘若讓仙宮門人，讓你的侄兒曉得，這副臉蛋被人玩弄得豔紅如霏，這副絕美聖靈的身段，被人折弄褻玩出各種出奇羞赧的姿勢，又都會做何想法？”\n\n蘇清璃不語，又默默閉上了眼。\n\n黃豐觀著此狀，放在她下頜的手又漸漸撫向其耳畔：“據說，蘇宮主在仙宮修煉以來，一度有著無窮無盡的煉氣士，為得宮主一顧，悍死聞劍仙宮，可都是真的？”\n\n此刻，蘇清璃感受著耳畔下方，頸部傳來一陣陣酥麻，白壁無暇的仙姿聖容尚且波瀾未動，張開纖薄的絳唇，清聲道：“本宮從不關注山下事。”\n\n“是真不關注，還是暗自歡喜。”黃豐臉上充滿戲謔神色，又徐徐道：“可能只有宮主自己知道了吧？但有一事，小子卻清清楚楚知道。早在十幾年的涼幽大戰時，幽州仙宮洛素文隕道當場……”\n\n“……而你蘇清璃奉師遺命繼承宮主之位，那時候的蘇宮主從仙宮雲巔，踏空落凡，收割我蠻族士卒，救助幽州內因戰事而淪喪傷殘百姓的姿態，可結結實實地被我族修士用留影石記錄了下來……”\n\n“……因此，宮主是不知你當年破開我族軍中玄陣的仙法，淩空懸在幽蠻邊境，白裙飄飄，裸足玉麗的美態，得驚豔了多少蠻廷宗室子弟啊。”\n\n“只不過！！”\n\n黃豐說著，忽然頓住。\n\n他放在蘇清璃雪頸上的手緩緩往蘇清璃香肩滑落，方接著道：“小子不得不好奇，仙子經歷那麼多事情後，心中對蠻人看法是否有所改變？”\n\n蘇清璃未有動靜，就這麼靜靜讓歹人的手，慢慢玷污肉體。\n\n然正就待黃豐的手探入酥軟乳山，搓揉蓓蕾之時，蘇清璃月眉又驀地一蹙，挺起柔夷拍開了黃豐。\n\n見狀，黃豐諷笑了聲：“仙宮月牙冰玉潔，一睹傾人漁落雁，小子還以為宮主不會反抗呢。”\n\n遂再見黃豐悻悻然收回被打紅的手，沉聲道：“看來是住持沒能調教好你，這樣吧……”\n\n黃豐轉過身，擺出一幅要走模樣：“宮主那些在留影石中的淫穢記錄，小子孤芳自賞，也實在無趣。想必夏朝的百姓，修士應該很感興趣，你看要不？”\n\n聞言，蘇清璃依舊坐若冰山：“你覺得本宮會被此威脅？”\n\n黃豐側側回頭：“難道不會？”\n\n見之容色，似乎還真不會。\n\n不由際，黃豐掃眼瞥至仙宮宮主盤在蒲團的纖長美足上，其腳脖子系掛的一串銀鈴，安謐爾雅，純淨感秀氣之餘，又透著股蠢蠢欲動的妖媚。\n\n他笑了笑，繼而俯下身一把抓過，然後拉住蘇清璃的腿便往自己方向靠近：“左腳帶紅繩，此生不遇有心人。不知宮主帶著鈴鐺又是不是這意思？瞧你落落穆穆的樣子，似乎不是會對自己精於打扮的人嘛。”\n\n經此動作。\n\n蘇清璃捧在手間淨瓶差點掉落，好不容易騰出單手撐地穩住，可兩腿岔開被歹人架著的狀態，又讓她裸足粉趾蜷地一縮，清眸緩閉，仙容稍偏：“這與你有何干係？”\n\n“呵呵呵，無關無關。”黃豐瞧著蘇清璃神色，幽幽笑道。\n\n莞後他側首腳踝，再落眼至其緊張得蜷起的嫩白裸足處，觸摸指尖透著冰肌傳來蘇清璃膚下脈絡的急促跳動，露在空中的裸足如玉剔透，蜷縮的足趾，趾甲泛亮冰淩，纖塵不染。\n\n繼而，黃豐厚唇勾起，一笑而過。\n\n接著他冷不防伸出舌頭，舔在了蘇清璃嫩白腳背上，入口清潤軟香，著實上品。\n\n只是黃豐突然的動作，卻讓蘇清璃蜷起的足尖更甚地縮成一團，再見她欻而擰眉，投來憎惡視線：“你做甚？”\n\n“小子做什麼？”\n\n黃豐陰陰笑著，回頭道：“想來宮主腳踝鈴鐺背後，還有段故事。”\n\n蘇清璃聞言，清眸微睜：“本宮來此，不是和你耍這些小把戲的！”\n\n你管這只叫小把戲？\n\n黃豐呵呵笑笑：“蘇宮主，爾大夏書上說，人各任其能，竭其力，以得所欲。有一利必有一弊，借雞生蛋，也得有雞啊。”\n\n念罷，蘇清璃吸了口氣，柔夷漸放在了黃豐腰帶上，緩緩拉動。\n\n爾爾簌地一聲，長褲落地，蘇清璃月眉之下，眼中神韻隨之流溢，冰肌雪容，刹那被紅暈團團染緋。\n\n在她臉前，粗長九寸的陽根直撲入眼。\n\n蘇清璃瞳孔飛速劇震，嬌軀震震，清膩聲線已然發顫兒：“怎麼會？”\n\n黃豐見狀，嘴角歪斜問道：“怎麼會？會什麼？”\n\n蘇清璃不願回答他的問題，只是看著眼前巨物尺寸，哪個女子不驚奇，她並非沒有經歷過房事，只是眼前這根比見過的都更粗更長。\n\n若讓它進入自己體內，會是什麼感覺？\n\n蘇清璃想著，雙腿旋即繃緊，拼命地夾起。\n\n恰恰正因已有經歷，三十有餘的輕熟宮主少婦，可謂早食髓知味。\n\n但奈何，作為正道仙宮宮主，作為夏朝少有幾位女強者，她發自內心的尊嚴，完全不可能向其屈服。\n\n不過，黃豐卻不會給她拒絕的機會！！\n\n決然，見蘇清璃定住心神，沒有任何施為後。\n\n黃豐率把手舉起，悍而搭在蘇清璃腦髻，然後猛地拉動，粗長陽根隨即與那張雪容來上了次親密接觸。\n\n久違的刺激，蘇清璃鼻間頓時被陣陣腥臭充斥填滿，陽根貼在臉前，炙熱的溫度澆化了冰心。\n\n她的瞳孔居然止不禁迷離翻白，這味道很難聞，這陽根傳來的溫度很惡劣，但為何為何，明明自己已經放下了啊，難道不是嗎？\n\n緩緩過後，蘇清璃重回清靈神態，她握緊拳峰的柔夷，指甲透進皮肉，硬生生沁出血珠。\n\n“果然，蘇宮主還是需要小子來教啊！”\n\n“什麼？你……唔……”\n\n話語聲起，便將黃豐用手掐住那絳紅檀腮，陽根退至蘇清璃唇前，接繼往前猛懟而去。\n\n被掐出小口縫隙的仙宮宮主，豁然便被一根長物堵住了嘴，齒白唇紅交替，蘇清璃雪顏上的緋色變得更甚。\n\n隨著陽根每次抽插，黃豐茁壯的陰毛不停撞擊在她鼻前，九寸長的陽根按道理根本無法完全含吐。\n\n只是這時候的黃豐絲毫沒有憐人之意，火熱粗長的陽根，那碩大的龜帽玷污了她的唇峰，滑過銀齒，順著舌苔往下深深貫穿了她的喉嚨。\n\n作嘔反吐感奔襲而至，蘇清璃縷縷想吐，然黃豐很快又把陽根抽出，給於喘息，但喘息僅僅只是霎時，又會繼續猛猛插了進去。\n\n強烈的刺激與鼻中絮繞的氣味，讓蘇清璃一步步粉碎，又一步步迷失。\n\n她可以堂堂正正的反抗，可她沒有去做。\n\n為了心中事，蘇清璃必須堅持，她相信自己可以做到，就如那一天夜裡，只是再次接觸到此物，又當真還能灑脫嗎？\n\n性格本不染塵埃的仙宮宮主，香腮慢慢內凹，尤變馬臉，這是她自我欲望無法遮掩的事實。\n\n而其清眸中時刻展露出的狠意，何曾也不是被潤出的媚色所擊破，她張開的檀口根本無法拒絕前方歹人的抽插。\n\n在黃豐數百次深喉插弄下，蘇清璃美軀不斷繃緊，拒絕暗罵的話語到了嘴邊，就因快感化為一聲聲無力呻吟。\n\n緩見，她兩眼在黃豐陽根每一次衝刺中，一下下變得更加迷離。\n\n黃豐瞅著她憋屈的神色，發心嘲笑道：“宮主？哈哈哈，你以為脫離歡喜寺就成了自由身？說到底，你還不是成了一條被調教好的母狗！？”\n\n聞言，蘇清璃心火急升，只是她又能做些什麼？\n\n反抗？\n\n沒有人比她更清楚，反抗代表著什麼？\n\n在她離開歡喜寺的時候，她曾被尋木召喚，來到了歲月長河邊恢復心境道傷，而在那裡的她不僅僅能痊癒傷勢，更能依靠歲月長河流逝，觀摩眾生。\n\n起初蘇清璃只是觀望獨屬於自己的歲月溪流，然後是蘇家，再落眼至蘇雲身上。\n\n蘇雲，自己的這個小侄兒，從小機智聰慧，但不知是否由於被上官玉合一力帶大，缺乏了父輩的教養，還是他的本性註定仁善，往往遇事總少了幾分堅決。\n\n但無論如何，他的長相乃至他的性格，都像極了曾經兄長，以致于本就對兄長抱有些許禁忌情緒的蘇清璃，甚少會去接近蘇雲。\n\n畢竟那份對兄長感情，哪怕她已經在修行道路上忘懷了，還是會存在著一點點。\n\n可蘇雲終歸不是兄長，沒有人能代替兄長，蘇雲亦不是填補空缺的佐料，誰都是獨一無二的。\n\n可蘇清璃即便明白此道理，還是難免會關注這個少年。\n\n更別說，蘇雲還親眼目睹了自己被欺辱的經過。\n\n坐在歲月長河之中，有時真不知是她無意為之，還是尋木有意讓她觀望。\n\n蘇清璃便在長河中，看遍了蘇雲一生，從呱呱落地，到執劍修行，小傢伙平日裡多的是紅顏知己，但他似乎對上官嫂子，有別樣的想法。\n\n對此，蘇清璃也只是一笑帶過，人要喜歡誰，是個人的選擇，旁人沒有插嘴的權利。\n\n可，就在蘇清璃看到少年下山遠行歡喜寺，拜師柳舟月，歲月長河中雲兒的經歷後，所有事都開始變得跌宕起來，而事情源頭一切一切都源于黃豐，最後蘇清璃選擇把視野落到黃豐身上，看遍其生平。\n\n不過之後，蘇清璃仍舊毫無頭緒。\n\n黃豐為何入涼？\n\n直到蘇清璃把涉事所有人的經過均在歲月長河中，看罷。\n\n蘇清璃方才得出一個模糊大概，兄長和許攸的博弈。\n\n回顧往昔，她循著歲月再往前觀察，從上官玉合懷胎開始，兄長在未出世的雛嬰體內布下禁制，再到兄長于拘龍山上的逝世，許攸假死在涼幽大戰。\n\n原來這一局牽涉之遠，早已出現。\n\n自己的事，乃至上官玉合，女帝登基，黃豐入涼，所有人的路都更像註定一般發生，所有所有，都源自兄長可能預知過的伏殺，都源自兄長和許攸之間的大道之爭。\n\n到彼時，蘇清璃終於醒悟過來，即便她還弄不懂兄長和許攸在爭鬥什麼，但在兄長死後，天下人都成為了許攸的棋子。\n\n得知真相的蘇清璃，怎可讓許攸得願！\n\n然後，就當她打算離開尋木禁地，親自保護蘇雲，想殺害黃豐這顆棋子之時，尋木中出現的一道儒衫身影，卻讓蘇清璃頓住腳步。\n\n許攸的出現是猝不及防的，但他現身又並沒有對蘇清璃說些什麼，只是大手一揮，給蘇清璃看了一場，假若她強殺黃豐後，天下的變化。\n\n一場推演裡，被裹覆 壁能感受到過去的痕跡被抹去，再而便是穴房宮口的位置。\n\n曾經，她在老禿奴的調教下，曾被擺弄成某些姿勢後，被頂撞過的那個位置。\n\n可這一根陽根的長度，絲毫無須將她折辱成別的姿勢。\n\n僅僅只是尋常的體位，就那麼一下，龜帽便徹徹底底撞在了蘇清璃宮口花房之前。\n\n有那麼一刻，她感覺到自己的穴戶都像被撕裂插穿過去，痛楚與快感不斷交織，當下大腦便陷入一陣空白。\n\n“操，真他媽緊！”\n\n而待蘇清璃失神間隙，黃豐亦咬著牙，雙手掐住她的腰，開始瘋狂抽插起來，九寸巨蟒在她屄穴進進出出，撞得她嬌軀亂顫，每一次他都會頂到最深處，滋滋滋的水聲，混著她壓抑呻吟，在廂房裡久久回蕩。\n\n“不要……慢點……噢????太快了……我要……噢齁齁????????，慢點嗯嗯嗯????????……這樣不行……不行的嗯齁齁齁。”蘇清璃眼角淚花滑落，她仍舊反抗著，但身體不知怎麼的，就不由自主地迎合起黃豐的節奏。\n\n這根陽根在體內橫衝直撞，每一次撞擊都會讓自己感到一陣滅頂的快感，明明委曲求全，帶滿了屈辱。\n\n明明自己身為仙宮之主，九州洞虛強者之一，還需要妥協以爭取希期籌碼。\n\n然而她在這份屈辱中感到了愉悅，它就像毒藥一樣，讓自己越陷越深。\n\n春殘落蕊，誰教仙子墜碧霄，望雲弦斷，意滿空庭淚流珠。\n\n黃豐望著她，動作反而愈來愈快：“慢點？話說仙宮宮主不是自詡清高嗎？小子就是要把你肏成一條母狗，讓宮主一輩子都忘不了小子陽根的滋味！”\n\n說話間，黃豐抽插不停，還用另一隻手把住她胸前的一團酥乳，開始揉捏起來，玩弄成各種形狀。\n\n那邊廂，蘇清璃的呻吟止不禁越來越高亢，意識正在一點一滴崩潰。\n\n被壓在蒲團上的仙子玉人，不斷在體內翻江倒海的陽根，黃豐龜帽一次次撞擊著她敏感的花心，流出的淫水已經不受控制地噴湧而出，濕透了蒲團。\n\n在此刻，她雙腿被架在黃豐肩上，裸足腳趾蜷縮成一團，紅繩在踝間晃動的模樣，仿佛都在嘲笑著她的墮落。\n\n“爽不爽？騷貨，想不想要，說啊！”\n\n黃豐喘著粗氣，說話間猛地一記深插，再次頂得蘇清璃尖叫出聲。\n\n蘇清璃拼命搖頭，喉嚨因為體快感堆積，止不禁顫抖滾動回應著：“不……啊????……別嗯……沒有我……本宮沒有……哦有嗯????……不要嗯嗯????????。”\n\n可不管怎麼抗拒，宮口被抽插，陰蒂被撞擊的快感都讓她無法否認，自己的身體已經不屬於自己的了，她以為痊癒了心境道傷，就可以無礙地接受，然而黃豐每一次抽插都能使得她更接近崩潰的邊緣。\n\n尊嚴，作為洞虛作為仙宮宮主的尊嚴，心裡羞辱和穴壁的刺激足矣讓她徹底迷失。\n\n“不要？宮主你明明是爽得要死啊！”此刻黃豐笑著，又突然拔出陽根，帶出股股淫水。\n\n然後他猛地翻過她的身子，將她旋轉跪趴在蒲團上，再從後面抓住她的臀肉，狠狠一拍：“翹起來，這個姿勢比之前可還刺激呢，宮主！！”\n\n按照常理而言，陽根已經抽出體外，蘇清璃應當已經獲得了自由的能力。\n\n只是，無人知道的是，被肏得失神中的她，在黃豐離開自己體內後，蘇清璃感受到的，唯有強烈的騷癢和空虛。\n\n一直被深插貫滿的穴道，忽然失去了她的客人，羞恥淫汁潺潺流出，穴壁重新收縮後，迎來的只有陣陣饑渴性的痙攣，而一張一吐的穴瓣，更是昭顯了一切。\n\n導致出奇地，蘇清璃在黃豐這個動作後，亦不過微微闔上早已迷離的雙眸，九州仙宮之主居然乖乖自主地趴向蒲團，臀部有意無意地高高翹起，白嫩臀肉愉悅得就像變為了兩輪汪月，歡迎觀賞。\n\n黃豐見狀，嘴角不禁勾起。\n\n他知道這證明了什麼，念即他便扶著陽根，再一次對準她的穴口，好在此回他沒再粗暴地一插到底，而是以一種徐徐漸進的速度，緩緩將自己的陽根全數灌溉進她的騷穴之中。\n\n但恰恰就是這般動作，反使得蘇清璃身體陡然前傾，幾乎撲倒下去。\n\n不一樣的抽插，會連刺激得感知都不一樣。\n\n此番陽根從後面進入體內，角度更奇特，龜帽微微上揚的弧度會慢慢剮蹭自己的穴道上壁，陰肉不再和之前接受瘋狂的恥辱，反而是清晰地去接納黃豐陽根的形狀，已經被玩弄得春情遍佈的穴道，甚至能敏感地感受到他陽根血絡的跳動。\n\n直到最後撞擊到宮口時，蘇清璃兩眼已然無法受控地翻白，全身心被宮口的刺激所帶動。\n\n然而這一會，從後插入的姿勢，陽根明顯進入得更深，然後再進半寸，碩大的龜帽半捅進宮口花房的行徑，當即刺激到魂飛魄散。\n\n而在此之後，黃豐雙手摟把住她的腰，可不會忘記繼續玩弄這清高婦人幾近崩毀的小穴，胯部撞在她臀上發出的聲響，淫靡至極。\n\n“嗯齁????……”\n\n再即，隨著蘇清璃單獨的一聲呻吟發出，再也止不住的呻吟聲，開始再廂房此起彼伏地響起。\n\n黃豐見狀邊肏邊笑，汗水滴在她背上，玉白如琉璃的美背，又歡吟地呈住了所有，聚成氾濫汪洋：“蘇宮主，怎麼樣！小子要不再給 吟著，無暇琉璃仙體被肏得香汗淋漓，肉穴啪啪作響：\n\n“什麼都不管了，噢????齁齁齁，本宮已經被這根大陽根插得爽死了，嗯嗯????……哪還管得了那麼多，主人快給我，噢齁齁????????插得快裂開了，噢齁齁????????????不要那麼用力玩小騷貨的騷陰核，不行了，完全受不了嗯噢齁齁齁????????????????……”\n\n“……本仙宮宮主要給蠻族主人開宮受種了，爽死了！阿兄阿父，雲兒，清璃以後要給主人生野種了噢齁????????，小騷屄被肏得爽麻了了，噢不要我不行，我不要，但好想要，噢齁齁????????????真的要爽死了齁齁齁齁齁齁????????????????????！！”\n\n黃豐遂大力抽插道：“插死你個小騷貨，把臀再拉開點，主人要完完整整插進去給你受種！”\n\n蘇清璃已被刺激擾得沒了自我，跟著黃豐的話就用手乖乖扯開肉臀，好讓主人深插，道：“來了????，清璃騷貨要來了，噢齁齁齁????????????，求主人把精元射給小騷貨，肏我????，肏死我????????????！！”\n\n“要來了！騷貨！！”\n\n“受不了了，喔齁齁齁????????????，好燙好燙，本宮噢齁齁要受種了????????????????！！！”\n\n語中，黃豐拉緊了她的腰肢。\n\n漸漸地，蘇清璃眼中所有畫面都恍惚起來，雙足舒服得大大張開，隨後黃豐的陽根在她體內猛地一脹，一股滾燙的精液從內噴射而出，灌滿了她的穴道，射在宮口，射入了宮口內壁中。\n\n“肏，肏死你個小騷貨！”\n\n完事後的黃豐喘著粗氣，即便射完精漿還不忘多頂了數下，將輸精道中所有精液都全部射進她體內。\n\n而被得渾身顫顫，痙攣不止的蘇清璃，蜜穴內熱乎乎滾燙的感覺，直接便讓她崩潰暈死過去。\n\n黃豐這才拔出陽根，滿意地看著她密佈香汗的無暇肉體，啐笑了一聲：“什麼仙宮宮主，一下就不行了，還不是個反差賤貨。”\n\n說著，他看了看天色，該有一小刻鐘時間。\n\n見狀他扶舉著大陽根跪下，塞到了蘇清璃嘴邊：“張開。”\n\n暈睡中的仙子肉體，不知是不是鼻間聞到了濃郁的氣息，就此打開了檀唇，主動地把那根充滿了葷腥的陽器，含進了嘴裡，緩緩吸吮。\n\n昏暗的廂房內，肉身佈施的菩薩像，睨眼低掃。\n\n蒲團上的仙子，口含蠻根，無暇琉璃仙體雪白的肌膚，低劣的蠻族少年，形成了極致的反差。\n\n院外似有持劍白衣虛影，於夢幻虛空遁去，不聞人聲，殘存的。\n\n唯獨婦人吞咽精漿陽根的，淫迷之聲。\n\n—————————"}, {"title": "第二章 上官玉合", "content": "想著蘇雲便打算轉身離去，可就在瞬間，前方的房門吱呀一聲緩緩斜開。\n\n蘇雲聞聲回眸，然待門縫漸寬，蘇雲的目光不由得定住，進而瞳孔陡然一縮。\n\n前方開門之人，並不是當日自己闖門所見到的人，反而是一張再熟悉不過的臉，自己的師兄曹少悲。\n\n隨之即見門倚斜斜，曹少悲裸立面容，頭戴冠帽，開門便隨口喊話道：“誰啊！打攪我的好事！”\n\n然，讓蘇雲震驚的點，不是曹師兄裸著身體與自己面對面相對。\n\n反而是在他神前，一名身段極為豐盈白潤，同樣赤裸未衣的熟豔婦人正被他端摟在懷裡，三千青絲髮髻零散，不見挽簪，披散在肩頭。\n\n再迎出門後，熟婦背朝蘇雲的腰肢當即顫顫不停，即再見她雙手更為用力地環緊了青年的頸部，貼向青年前身的飽滿碩乳，隨即壓迫溢出一團團淫靡的乳肉，豔色流溢無止。\n\n如此兩人緊緊相抱，唯一將他們親密連接在一起的，唯有下身一個支點。\n\n繼而垂眼視下，一根表面戴有薄如蟬翼狀膜套，入眼粗壯有力的陽根，正深深插在婦人粉白無絨的恥穴之間，她陰唇倆瓣已然被它插得敞開攤軟，紅腴腴的穴戶大門堵得密不透風，又濕漉漉隨此一滴一滴落下晶瑩的淫水，從交合初順滴至廂房地面，沁暈出朵朵水花。\n\n且這越看，她的身段她的臀峰碩乳，還有欣長的腿部，怎麼度像極了娘親。\n\n只是比起娘親，她背部還有著一顆小痣，如果不是這一點，蘇雲恐怕在第一眼就已經把其認成了娘親，或者只是像了一點？\n\n但這名青年，恰恰還是自己的師兄，曹少悲啊！\n\n難道說！\n\n不絕對不可能！！\n\n娘親的背上沒有痣，沒有痣，而由於這淫蕩熟婦把臉死死埋在男子胸膛，蘇雲又不能目視探究出她的身份，若不是他本性溫潤，恪守禮化，但也已經當場想以靈識試探，婦人究竟是誰了！？\n\n目察此狀的蘇雲，腳步驚地都便是一退，張口咋舌：“師兄？！”\n\n這時候用功法變幻了模樣體型的黃豐，瞅見蘇雲刹那，便是一笑：“我瞧是誰，原來是師弟啊。”\n\n師兄怎麼在這裡，過去不到半個時辰，他已經練完劍了？\n\n還有，師兄懷裡的熟婦，為什麼會這麼像！\n\n瞧見蘇雲眉峰愈發攏立後，黃豐接著又道了句：“真沒想到，皇室給我換的房間，就在蘇師弟對面，還真是湊巧極了！”\n\n看來少琅兄，在得知自己無意闖門一事後，就已經換了對面的客人啊！\n\n換來的人，還是師兄！？\n\n蘇雲難免發疑，問道：“師兄在此地，你不是在練劍嗎，怎麼還不住在宗內於涼州租建的坊市院址？”\n\n“哎。”聽著，為了接觸蘇雲心中疑慮，黃豐歎笑起來，裝出一副無奈的樣子，說道：\n\n“都怪師兄劍法太糙，悟性太低，練了沒一陣，師娘就斥我離去了，至於為什麼出現在這，不住在院址裡頭，你也不想想院址那麼丁點大，駐守在涼州城坊市賣劍的外門弟子，就要占下不少房間……”\n\n“……這導致我和宗主師娘來了涼州城後，已經就剩下一個房間。你再瞧瞧，師兄我能和師娘住一起嗎？只好再讓皇室在舉辦大比的會場內，安排一間居住。一開始他們還說沒有了，等兩日夜啊，才給騰出這麼個地方來。”\n\n此言聽起來倒算合情合理，蘇雲的疑問淡了些許。\n\n蘇雲想著便點點頭，可目光還是忍不住移向師兄懷中的熟婦，也不知是不是感受到了自己的目光，她的身體仿佛都有所緊張地微微發顫。\n\n而見狀，黃豐嘴角一揚，笑著便放開端著熟婦腿畔的手，再朝著她如母狗般翹起，渾圓若明月的肉臀上拍了拍。\n\n啪——\n\n隨之而來的一聲脆響，熟婦飽滿白皙的臀肉上，瞬間浮現紅印。\n\n黃豐則笑眯眯道：“所幸終於有房間後，師兄我也不需要再住客棧了，這不！馬上就把她給帶過來溫熱溫熱，你說是不是啊？”\n\n如此話起間，掌肉悶響，未曾想這熟婦雖然豐腴，年紀想必也不少了，但其肌膚居然還保養得極為嬌嫩，白圓圓的肉臀瞬間就被拍得佈滿了紅印。\n\n而由於黃豐端盤著熟婦腿畔的手，忽然離開，也惹得熟婦兀失去了重心，酮體猛地一墜，那原本還有三寸留在穴外的陽根，更是又往裡紮進兩寸，淫水噗滋噗滋開始不停從中冒出，刺激得她連忙將岔在腰側的欣長玉柱，環疊繞緊夾住了黃豐的腰杆。\n\n有時候真的很難讓人想像，世上居然有人能夠讓這麼一位身段極佳的熟婦，心甘情願羞得環住他人腰杆，屄裡插著他人陽根！\n\n然別見她沒有抵觸，但熟婦雖為人母，多年又不經人事的屄穴，即便在經過黃豐一步步拓寬後，內裡源源不盡的飽漲感，足矣讓她為之神魂劇顫，可她依舊死死抿緊紅唇，柔夷把黃豐後背抓出道道血痕，都不願發出一聲動靜。\n\n甚至，在面對著黃豐的話時，熟婦都只是默默點了點頭。\n\n但看著眼前一幕，蘇雲仍舊不免皺眉，即便師兄為人本就有點坦蕩率性，可之前天遁牌的舉措，當下又當著自己臉前，肆無忌憚地玩弄女婦，出關後的他怎變得如此荒唐，實在讓蘇雲深感不適！\n\n只是倘若，蘇雲能窺見熟婦面容的話，恐怕會更加驚慫。\n\n畢竟這麼一位淫蕩的熟婦，她埋在黃豐胸膛處，那黛染的長眉，高挺的瓊鼻，其冷冽眸光此刻既有著擔憂又有說不完羞恥的仙姿絕顏，赫然便是蘇雲的娘親。\n\n堂堂九州第一劍仙，上官玉合！！\n\n對此，雖懷著非禮勿視之心，但還是無法避免望向前方的蘇雲，搖頭直道：“師兄，你怎麼……怎麼，哎！”\n\n蘇雲莫名歎了口氣，再說道：“非仁無為也，非禮無行也！師兄知不知道在如今在做什麼？你而今做的事，傳揚出去，傳到我娘耳裡！劍閣聲譽何在？淫亂荒唐的行徑，娘甚至會把你逐出師門，你曉得嗎？”\n\n屆時上官玉合聽到雲兒的話，心中便是一緊。\n\n同刻黃豐瞬間感覺到自己陽根都要被夾的精來，暢然著一笑，道：“師弟怕是誤會了。”\n\n“誤會？”蘇雲擰眉偏頭過來。\n\n黃豐自然不會跟蘇雲說明懷裡尤物的身份，賤兮兮笑著：“這位其實不是我的什麼道侶，所以還是讓師兄給你介紹一下吧，她姓白，曾經呢是一名三流宗門的宗主，只是不巧在幾年前途經涼州，被蠻族虜了去，最終被人以藥物硬生生把境界抬到了化蘊，成為了爐鼎……\n\n“……雖然後來脫困，但境界已成了無用之身，多年後宗門又不接受她的回歸，更是將其視為恥辱，而師弟你應該知道爐鼎代表著什麼吧？最終就在師兄我來涼州城後不久，便遇到了她，所以就將她買了下來，只是一日爐鼎終身為爐鼎，至於為什麼這麼做……”\n\n“……哎，追究起來，還是因為師兄閉關後境界非升反跌，只能想想用雙修之法能不能破境了，不過關於這件事，師弟能不能稍微幫我保密，師弟你放心，即便她仍為爐鼎之身，但我絕對不會虧待她的，況且她也是自願的，甚至還十分喜歡我呢，你說是不是啊，白！宗主！！”\n\n爐鼎？\n\n聽著這話，蘇雲眸中方才淡淡湧出氣機，以觀氣術落在熟婦身上，化蘊境浮動的修為，的確也如師兄所言一般，是爐鼎具備的情況，並且這氣機的顏色，漆黑如墨，與娘親冷淡如冰的銀藍之色，也完全不相似。\n\n然待話音落下，黃豐最後兩字咬得極重。\n\n語中意味落在上官玉合耳中，更嚇得她蓮足藕趾蜷縮，穴內的陽根被她夾得更緊，潮意莫名高漲，淫水不受控制地淌出，羞恥得幾乎要暈過去，又只能死死抱緊黃豐，使勁控制住自己的反應。\n\n但上官玉合曉得黃豐胡編亂造的目的，是讓雲兒不懷疑她的身份，而只要雲兒不發現，她便還能維持最後一點尊嚴。\n\n所以話後，上官玉合就微微點了點頭，紅唇漸起，以靈氣改變了聲線，嗯了一聲。\n\n只是再怎麼說，她依舊不敢直接仰起頭。\n\n另一邊黃豐注意到上官玉合名器的反應，則不禁感慨，上官玉合，作為七大名器之首的落葵神闕，真的太過玄妙，任由自己幾乎已經全插到深處，居然都還未碰觸到宮口，甚至其幾乎兼備其他所有名器特點的穴道，更是時時刻刻侵擾他的心神。\n\n如果不是避子套的阻礙，讓他直接插進穴裡，恐怕眨眼又得瀉出精元。\n\n若不是還要在蘇雲面前裝下去，他真想好好回房，狠狠肏弄這個冷冽孤豔，實際悶騷至極的劍仙騷娘。\n\n只是經過此舉，黃豐更加確認了蘇雲在上官玉合內心中的地位。\n\n這所謂的劍仙對於自己的兒子，絕對不止普通的母子情分，如此接下來就更有趣了。\n\n很可惜啊，黃豐緩緩望向蘇雲的目光中，多上了不少悲憫。\n\n瞧瞧，你多好的娘親啊，居然在自己身邊這麼多年，你還悟不透她的本性，想想看，她具備這麼獨特的體質，更有七大名器之首在身。\n\n怎麼可能單單是位冷若雪山的劍仙呢，當雪山融化時，那可有滔滔不盡的潮水，你娘實際悶騷反差得很呢，偏偏不懂得爭取，到頭來栽到他手裡。\n\n當下再有和你感情的緣由，真是讓人期待，日後被調教完成的她，漸漸會變成什麼模樣？\n\n思忖著，黃豐在蘇雲面前，放在上官玉合飽滿豐臀上的手，有意無意地就搓了搓，肉感十足的豐臀甚至能將他的手指均陷進去，而稍微被扯開的恥穴花瓣，經此又再度噗呲噗呲往外吐露潮水。\n\n不過，黃豐眼角望著她一點點逐漸迷離，唇峰愈來愈咬緊的神態，便是一笑：“來嘛，宗主！動兩下，否則我蘇雲師弟還不相信你是自願的，還喜歡我呢！”\n\n聞言後，上官玉合黛染長眉一陣蹙立，劍眸斜斜刮向滿帶醜笑望過來的黃豐。\n\n一個醜陋得不可堪的狗蠻子，誰會喜歡你！\n\n只是！！只是！！！\n\n雲兒就在身後看著，如果不順從他的話，甚至讓雲兒懷疑的話，那自己付出的一切，就遠不止徒勞無功，彼時不僅貞節沒了，所有所有都會失去。\n\n居於此，上官玉合也只好搖緊銀牙，腰肢漸漸發力，進而當著雲兒的面，緩緩將肉臀向上抬起，又慢慢壓了回去，莫大的羞辱感，無窮的背德感瞬間沖刷進她的內心。\n\n明明雲兒就在身後，可娘親居然，居然還讓別人插著穴，甚至還得自己動起來，表現出一副騷媚模樣！！\n\n對不起雲兒，對不起，只要再給娘一點時間，娘一定會解決完一切，回到你身邊的。\n\n只是這樣的娘，還配回到你身邊嗎？\n\n上官玉合內心的話語，如雨落在心海，蘇雲不得而知。\n\n所有的懷疑在上官玉合抬起肉臀瞬間，均數彌散，她的身段和娘親雖然很像，但背上顯然多出一顆痣，修為和氣也不一樣，甚至聲音都是如此，雖不排除有偽裝的可能。\n\n但娘親怎麼可能會和師兄在一起？\n\n而且會自己抬臀送穴，不，怎麼可能，娘親絕不會騙自己，絕不對！\n\n畢竟那可是娘啊，娘是誰，九州第一劍仙，上官玉合！\n\n所以蘇雲唯一能瞧見的，只有師兄和自己的爐鼎，在自己目前苟且。\n\n可無論如何，對於師兄的改變以及爐鼎的事，他無法替他隱瞞。\n\n這所謂爐鼎，期間自古除遠荒母系時代以外，到如今都以男子為尊，直到女帝登基，情形才有所緩解，但在修行界，大道漫長孤索，爐鼎在煉氣士中註定是最底層，她們或許境界會被藥物堆砌很高，其實能力遠沒有低階修士強大。\n\n此爐鼎生存，要還妄想能繼續享受修士的待遇，唯有依附強者乃至尋常修士，且幾乎沒有脫離身份的一天，她們的地位與山下妓院裡的賣笑女相當。\n\n而早在很久之前，劍閣已明令宗門內部弟子，畜養爐鼎進行雙修，只是對外門來說，由於爐鼎雙修的快捷，以及修行界潛移默化的規矩，依舊無法斷絕。\n\n不過既然師兄是內門弟子，他便要有作為劍修的傲氣，依靠外物修行，得來的終不是強大，反是一味的孱弱。\n\n故而，哪怕這名身段都快能和娘親相比較的熟婦，甘心成為爐鼎，也是劍閣門規所不能容的。\n\n蘇雲望著他們，默默提劍，拱手：“抱歉師兄！或是師弟孟浪了，但此事蘇雲必須告知娘親，畢竟這是門規所限，誰都不能違逆，可若師兄與她真心共對，師弟亦會爭取讓娘親網開一面，而到時師兄與她究竟會如何，還是待娘親發落吧。”\n\n聽到這裡，黃豐心中閃過一絲晦暗諷刺的想法，他揚起嘴角，問道：“難道就沒有回轉的餘地？門規有那麼重要，誰都不能違逆？那你呢，那宗主呢？”\n\n蘇雲當即搖頭：“即便是我，娘親同樣如此。”\n\n聞言，黃豐馬上歎了口氣：“如此，便只好聽宗主師娘發落了，就怕這爐鼎已經離不開我了。”\n\n正說著，黃豐便又抬起手，拍了拍上官玉合的肉臀，同刻上官玉合渾身都在微顫，體質和神闕被抽插，加之雲兒就在目前，背德和羞辱無窮放大了所有刺激，以致一直隱忍著的她，絳唇都快被她咬出血來。\n\n所幸的是，雲兒沒有在倆人面前久留的想法。\n\n在與師兄告明自己無法徇私後，蘇雲便提起劍，轉身打開了自己房間，走了進去。\n\n隨著啪地一聲門戶關閉，彼時上官玉合方才敢抬起頭，冉冉扭頭望去，雲兒的背影在她眼中緩緩消失，那對平日冷冽的劍眸，終是默默流下一行淚水，輕輕哀喘：“雲兒……”\n\n只是蘇雲離開了甬道，回到房間，心中卻依舊五味雜陳。\n\n他無法理解師兄為何會變成這般模樣，更無法接受他與一名爐鼎女子如此放蕩的行為，儘管蘇雲心中對師兄抱有同門情誼，但礙於門規，蘇雲必須得告知娘親，讓她來裁決此事。\n\n遂待入房後，蘇雲邁著沉重的步伐，走至桌案旁，拿出天遁牌深吸一口氣，再按動聯繫娘親的符文。\n\n天遁牌水幕漸漸浮動。\n\n與此同時，在另一邊廂房。\n\n黃豐已抱著上官玉合回到了內裡，越過山河屏風，他沒有抱著她走到床前，只是同樣選擇坐到了一方桌案側，其陽根尚且深埋在上官玉合的體內，沒有拔出，但身體已經從曹少悲一點點變回原本模樣。\n\n而此刻娘親玉背上由幻相生成的痣，也開始消散，甚至由她自己潛藏變化的氣和境界都慢慢回復，可她的身體還在微微顫抖。\n\n方才在雲兒面前的刺激讓她幾乎無法自持，但她強忍著沒有發出任何聲音，才算順利度過一劫。\n\n見狀，黃豐反在她耳邊低語，笑了笑：“沒想到宗主夫人還挺能忍的，堅持到當下真能一聲不吭，只是你又能堅持多久？使用過刮骨柔情後你的身體敏感程度，早勝以往，想必其實在蘇雲面前被我插弄，你一定很刺激吧，否則也不會夾得這麼緊？”\n\n聽聞言，上官玉合劍眸中泛起一絲冷怒和羞恥，但她無法反駁。\n\n她的體內雖然已經沒有了媚毒，可的的確確因其變得更加異常和敏感，尤其是在雲兒視線下，她幾乎好幾次在沒有動作，僅僅只是被黃豐插著，都快達到高潮。\n\n然不管如何，上官玉合忍著體內因體質波動的潮意，名器神闕穴壁情不自禁的攣癢，還是鬆開了環住黃豐脖頸的手，冷道：“你的時間可不多！”\n\n“呵呵。”聽著上官玉合的話，黃豐知道她在提醒什麼，上官玉合願意妥協，主要還是要自己釋放裴皖，將蘇雲的若木天命牌子交出來，以及還有將蠻族即將攻城的計畫全盤告知於她。\n\n而為了裴皖，為了涼州，為了雲兒的性命之憂，她必須這樣做！\n\n只是相對的，上官玉合得被他肏上一回。\n\n不過嘛其中還有著一項條件，那就是，如果期間上官玉合一聲不吭，面對自己抽插，不會高潮瀉身的話，黃豐還必須以天道起誓，和她去往建木，放棄天命人命格與九州大地氣運的聯繫。\n\n對於上官玉合一反常態的，放棄作為劍仙的孤高，甘願與自己行房，黃豐順理成章樂此不疲，心裡更是一陣竊喜。\n\n俗話說得對，這些所謂的熟婦，所謂的仙子劍仙，身份是當媽的，氣質是冷傲的，年齡是徐娘風韻的，上半身欲欲躍出的，下半身是玉柱欣長的，胸乳是西瓜大的，屄穴是白虎的，吃陽根是能吸成馬臉的，全身是敏感即墮的，淫水是無窮無盡的。\n\n甚至露胸，露腿，隔著衣料都看見乳凸，一拍肉臀切換母豬狀態，刷新噗呲噗呲，然後潮吹後還能獲得喋喋不休潮水痙攣，一捅進去就噢噢噢齁齁齁齁，喊著要哦去要去的。\n\n而就在黃豐思忖著，兩人再度爭鋒相對時，一塊擱置在地板上的天遁牌忽然顫抖，亮了起來。\n\n上官玉合劍眸迅速撇了過去，眼中閃出慌亂之色，雲兒找來了！\n\n黃豐也注意到了天遁牌水幕亮光，他嘴角勾起一抹邪笑：“哦？看來是蘇雲，你要接嗎？”\n\n上官玉合，感受著穴中被陽根撐住的腫脹，搖了搖頭，聲音微顫：“不……不能接。”\n\n“為什麼不接呢？”黃豐故意問道：“要不接的話，能完全瞞住他？而且這可是你最寶貴的兒子，甚至為此夫人都願意獻身了，難道你就不想再聽聽他的聲音？”\n\n上官玉合掃了黃豐一眼，又闔起眸，試圖平復內心的波瀾，和神闕穴的刺激，冷冷道：“我……我不能和他說話。”\n\n“為什麼？”\n\n繼而，上官玉合睜開眼，死死勾住黃豐：“為什麼，難道還需要本宗說嗎？”\n\n“哈哈哈哈哈！”黃豐大笑起來，揉在上官玉合肉臀上一隻手，緩緩摟過側身，最後探向銷魂洞，拂過無絨泉穴，被陽根狠狠深插的神闕寶穴，陰蒂忘情般腫立，潺潺液體從兩人交合處源源往外流出，他諷說道：\n\n“我當然知道，劍仙如今已經快受不了吧，其實只要你淫叫出來，什麼都好說。當然不願叫也可以，但你總得回答小子吧？我要問的也不多，就三個問題怎麼樣，第一個嘛我想想！例如，夫人的白虎騷屄這麼緊這麼嫩，到底和誰做過幾回幾次啊，咋這麼不中用？”\n\n聞語，上官玉合緊繃著嘴唇，閉口不言，顯然一副絕不承讓的模樣。\n\n黃豐瞧著，遂輕笑一聲，騰出手吸起天遁牌：“既然不願意說，那就讓小子去問問蘇雲吧！”\n\n“不！”\n\n見狀，上官玉合恐地睜大劍眸，伸手抓住了黃豐持有天遁牌，然後柔夷偏轉奪回了天遁牌，只是水幕閃動，而今的自己的確不能不接通雲兒，但自己赤裸的模樣，還騎坐在黃豐這個蠻人身上，雙腿攤開，股間一片狼藉，那交合淫液從那紅腫的白虎恥穴間流出之態。\n\n要再接通天遁牌後，黃豐抽插起自己，自己一個手抖讓雲兒看見了！\n\n上官玉合胸脯起伏，豐滿碩乳隨著她呼吸上下顫動，乳尖蓓蕾一凹，一凸挺立，仿佛都在訴說起她邊再隱忍，又有點受不住刺激快感的姿態。\n\n“所以夫人替小子解解惑，只要你說了，我保准我待會絕不會動，如何？”黃豐瞧見上官玉合猶豫的樣子，笑著附耳道：“可要是你不說的話，那麼……”\n\n說著，黃豐迅速摟緊了上官玉合腰肢，接著稍稍將她抬起，插進她神闕寶穴的陽根，緩緩往外退，進而又猛地插了回去。\n\n同刻隨著動作，上官玉合臉上迅速爬起抹抹紅暈，咬著壓止不住向黃豐身上倒落，而黃豐也爽得喘起粗氣。\n\n所謂名器之首的落葵神闕，不僅有著可自我升宮降宮，宮口開合全憑心意的神異，就連帶穴道都擁有其餘所有名器的特點，比如白玉觀音的無毛白虎外觀，金城湯池的淫水狂吹，九環玉壺的穴壁九層疊，一層一關，一關一雷劫外。\n\n還有著，冰魄寒酥以及傲鳳凰吟，在交合時由於心境變化，宮口乃至整個穴道的變化，最後便是洛神逢春般，記住插入者的形狀，且不能恢復的奇效。\n\n神闕一開，稱君為主。\n\n如今黃豐當然沒有把上官玉合肏得宮口大降，闕宮打開，認主的地步。\n\n可黃豐九寸的大陽根，蟒首龜帽瘋狂深入，要緊的是，雖然上官玉合神闕有著如九環玉壺的效果，但她的九環並不是完全與九環玉壺一致，她的九環並沒有後者的抵禦手段，只有被突破後自發包裹蠕動，乃至電麻般的刺激升起。\n\n而以黃豐陽根的長度，刺激無疑一步步襲來，每插入一環都會帶來瀉身的爽感，假若不是她神志堅定，一直死死忍受，換了旁人早已經張開紅唇忘我歡呼了！\n\n至於黃豐為什麼也爽得喘氣，道理很簡單，那就是神闕穴之所以作為七器之首，肏弄它的體驗無疑是遠超所有名器的，九環的緊致，如湯池般不斷湧出潮水，甚至在抽插期間，上官玉合心境的變化，從起初冷冷的穴道，隨著插入慢慢變暖，直到插入深處的炙熱。\n\n偶爾由於上官玉合反感著他，甚至上一刻還是無比炙熱，陡然又像把陽根插進融化的雪泥裡一般，忽冷忽熱，你永遠想像不到上官玉合什麼時候會刺激得熱辣高漲，又想像不到她什麼時候會因為厭惡而變得冰冷至極。\n\n哪怕隨著他數次插入，已經將上官玉合的穴道稍微打磨出屬於他的形狀，可神闕穴的變化依舊無窮無盡。\n\n但當下要緊之事，還是怎麼接通雲兒的天遁牌。\n\n對於此，上官玉合只好強忍著刺激感，挺起身，並且一手鎖住了黃豐頸部，一手提起天遁牌：“畜生，給我停下！不要動！！”\n\n黃豐黝黑的醜臉，隨而漲紅，但他還是挑了挑眉：“宗主拒絕呻吟，小子已經隨你意了。只要上官宗主再願意解惑一下，小子當然什麼都聽你的。”\n\n旋即，上官玉合感受著恥穴被陽根撕裂般深深插入，又痛又爽的感覺，深吸了口氣，回應起黃豐來：“本宗只和蘇青山做過一次，到雲兒出生，本宗身為未亡遺孀，從未有過任何逾矩。”\n\n“只有一次？”\n\n黃豐聽到回答，乖巧地放開雙手，搭在腦後笑道：“沒想到，但也難怪。可宗主已是作為人母年紀，還能這麼緊，而是才一次就生了個兒子，不愧是名器。”\n\n話畢，黃豐又挑了挑眉，示意：“接通吧，我不會動。”\n\n聽著此言，上官玉合依舊死死抓住黃豐脖頸不變，然後體內靈氣綳發而出，在整個房間頓化為一片森林的幻境，並且口中念動古老法訣，生出了一位與自己幾乎一模一樣的身外化身後，方才按下了天遁牌。\n\n這個秘法與女帝的身外化身相似，但不同的是，女帝是由本體分裂出化身，而上官玉合的方式，則類似於從天地聚攏法身，最後寄託進神念，雖然身體一樣會互相影響，可相對的卻沒有反噬。\n\n只是上官玉合的身外化身，境界是遠不如本體的，和女帝那種兩者修為幾乎均衡，倒是不一。\n\n然唯一能論道的便是，這等秘法她還是頭一回使用，哪怕是雲兒亦未曾見過和得知。\n\n“娘親，娘親。”天遁牌內聲音傳來。\n\n出現在森林幻境中的上官玉合化身，隨即接過了本體手裡的天遁牌，劍眸浮出母性祥和：“雲兒。”\n\n在另一個房間中，蘇雲天遁牌水幕亦出現了娘親站在森林中之景，不知為何，蘇雲暗暗松了口氣，溫聲道：“娘，你這是在哪？”\n\n而望著上官玉合施展出如此神奇手段的黃豐，眼中未免一驚，遂傳聲入密進上官玉合腦海：“未曾想，夫人還有這等手段，看來這樣就不會影響我們了，要不小子再讓你舒服舒服？”\n\n說著，上官玉合本體抓住黃豐的柔夷，乍然出力，傳聲回去：“讓雲兒發現了，我就與你同歸與盡！！”\n\n噢！\n\n黃豐聽著，憋得發青的臉笑了笑，傳身道：“那麼不被發現，是不是就可以。”\n\n聽著此言的上官玉合，素面朝天的仙姿，容顏浮出絲絲淡如胭脂的紅霞，立馬怒瞪向黃豐：“閉嘴！”\n\n跟著，黃豐很識趣地暫時沒動，畢竟時下瞅著這身外法身之術，他對此很有興趣。\n\n接而在上官玉合心跳愈來愈快的情況下，法身漸漸張開絳唇：“涼州北地，橫斷之森邊緣。”\n\n原來娘親去了橫斷之森，蘇雲默默點頭，再次抬頭望向天遁牌水幕：“娘怎麼去橫斷之森了？你不觀禮了？”\n\n“宗門內煉丹需要一些稀缺的靈草，所以娘既然在涼州，便順道來此地取一下了，況且你師兄的比試已經結束，也不需要娘為其擔憂了，嗯……？”上官玉合化身如此說著，可到了後頭，語氣便越來越慢，甚至在話尾還止不住地輕嗯了聲，繼而兩腿無法避免地顫抖。\n\n而在另一邊，上官玉合本體的狀況同樣不容樂觀，雖然她已經極力克制著神闕穴壁的刺激與痙攣，但黃豐雖未大肆抽插，卻開始小幅度抽動，陽根在她穴內緩緩摩擦，撐得她的唇瓣外翻，穴壁因此痙攣，淫水不停淌出。\n\n間隙，上官玉合很快也控制住了體內的潮意，她抓向黃豐脖頸的手，指甲已經在皮膚刮出血痕，撓進肉裡，冷傳聲道：“還動？”\n\n黃豐管中窺豹，總算得知了身外化身的一些奧秘，又再度傳聲進上官玉合腦海：“第二個問題，身外化身之法是否彼此神思，體感，所有傳遞都是共用的？”\n\n聞言之後，上官玉合本體迅速掃了眼黃豐，劍眸內神色憧憧，她隱隱猜測到了黃豐的想法，遂傳身過去：“你先安分一點！”\n\n黃豐聽著，停下了小幅度抽插上官玉合騷穴的動作：“遵命，我的劍仙大夫人。”\n\n隨後，上官玉合本體與化身相互對視了一眼。\n\n再見兩者同時回應。\n\n本體闔起劍眸，傳聲悠悠：“無論是哪種身外化身術法，最終都需要神思共鳴控制，不過化身都會先行抽離出一個歲月節軌中本體的神念，兩者會分享所有想法，同樣可以隱藏部分想法，只是化體感由於是本體神識作為主導，就算再怎麼克制，兩者皆會有同互相傳遞。”\n\n另一邊化身則笑了笑，柔聲道：“沒什麼，只是天上飛過一隻掉了毛的火鳳，覺得有趣。”\n\n掉了毛的鳳凰？\n\n蘇雲聞之，道：“獸族居然還有鳳凰？”\n\n上官玉合化身回過眸來，道：“當然沒有，不過血脈相近，姑且算得上是鳳而已。”\n\n原來如此。\n\n話語間，蘇雲與黃豐二人居然前後點了點頭，前者的想法，是在肯定娘親的話，而後者則是得出了不少玄機，看來對付女帝，倒是有新法子了。\n\n屆時，瞧著雲兒放下了所有疑慮，上官玉合化身遂開口問道：\n\n“雲兒尋娘，是又有什麼事？”\n\n“沒，呵呵！呃……只是這點。”聽到娘親發問，蘇雲稍微撓了撓頭道：“雲兒不知該說不該說。”\n\n化身望著天遁牌：“說。”\n\n蘇雲清雋的臉龐隨即露出幾分尷尬，遂再見他開始將前一刻所見所聞，簡略說了出來後，再詢問向娘親：“不知師兄與此名爐鼎女子的事，娘怎麼看。”\n\n只是蘇雲沒有發現的是，就在自己訴述時，天遁牌內娘親挺翹的鼻翼，都驀生出不少密小汗珠，繼而整個人的膚質都白裡透著暈紅，好幾次還搖搖晃晃的，險些失態又立刻恢復回原樣。\n\n不過要解釋為何會如此。\n\n蓋還是因，懷抱著上官玉合本體的黃豐。\n\n別看他只是暫時聽從上官玉合的話，但這個人他是一刻都沒有休停的，畢竟美玉在懷，還能坐懷不亂的，黃豐都得視他為蠻神。\n\n就在得到關於化身術法的隱秘後，黃豐即便停下了抽插，可他的手反而從下往上，攀上了乳山，作為曾經哺育過蘇雲的聖物，就這麼被他攬進手間。\n\n不過勝在上官玉合的乳團哪怕常年裹胸，都未見縮水，單單用一手大小，顯然是無法將乳團完全揉握的，然而恰恰就是規模不小，反而又讓他握住了乳盤底部，再將兩隻碩乳，分別抓立起來。\n\n原本上官玉合豐滿的乳房，形狀是類似玉碗水滴吊墜在胸口的，可經此一役，就成了兩團被掐出奶水般的水袋，鼓鼓囊囊地仿佛隨時都要炸開一般，白膩的軟肉從黃豐指縫間溢了出來。\n\n且他做完這些還沒完，黃豐抓住亮團乳球的手指還不忘伸出，一根順著她右邊立起的乳間，不停劃圈挑逗蓓蕾，而另一根在劃動的同時，又連連輕扣她凹陷的乳尖，剮蹭起她敏感的位置。\n\n上官玉合極力抗拒著，可在這個時候，她既不能開口斥駡黃豐，又不能抽身離開，畢竟陽根離體摩挲穴壁的刺激感，哪怕她能忍受得住，但難防就快抽出是，黃豐會不會突然作妖，讓自己在雲兒面前不小心發出什麼奇怪的聲音。\n\n甚至在雲兒長篇大論，訴述爐鼎一事時。\n\n黃豐把玩她乳房的動作，便越來越放肆，最終就在上官玉合被刺激得一時鬆懈，雲兒即將話畢前，他居然不顧被死死拿捏的頸部，強行將自己的頭用力俯了下去。\n\n轉瞬，堂堂劍仙玉體一僵，宛若受精般叫了聲，再垂眸而落，那張無論怎麼看都醜陋至極的嘴臉，竟張開嘴含住了她左邊乳房，徐徐用力往外吸吮，舌頭伸進凹陷的乳尖，瘋狂快速地上下舔動。\n\n片刻間，上官玉合喘息都加重了幾分，一股按捺不住的暖流從穴道深處流溢噴灑出來。\n\n他怎麼可以！\n\n從來沒經歷過這種事的上官玉合，在身體本來就因為潮汐體質過度敏感下，更 陽根，把上官玉合推至窗沿，順帶還將她轉了個身，然後壓著她的臀峰，岔開她的腿，自己再踮起腳尖將陽根狠狠插了進去。\n\n說起來，本來身高就矮小的黃豐，從背後插入上官玉合的姿態，由燭火倒映在山河屏風上，看上去有多奇怪便有多奇怪。\n\n可恰恰就是這份奇怪，更是將黃豐那份卑劣和上官玉合無上的孤傲，糅合在了一起，反差至極。\n\n然而以這個姿態匍匐在窗沿的上官玉合，她的實力足矣目視傳過窗紗，覽盡廊道外的所有，莫名地她就強行撐起手臂，冷聲怒絕道：“不行，不可以在這！”\n\n“為什麼不可以！”黃豐當即反駁，說著兩手就從下更大幅度地分開上官玉合岔立的長腿，然後抓住她的肉臀，陽根猛地插了又插，撞得上官玉合全身抽搐。\n\n“是不是在這容易看到自己兒子，再想到自己背著他，被我肏弄，感覺特別刺激！我的大賤仙，你她娘的可還騷，你瞧瞧一說到蘇雲，你的騷屄又更緊了，夾得我好爽，知道嗎？”\n\n上官玉合顧後冷冷盯著他，此時候的她，氣息居然驀而出現了喘息之意，唇起道：“早晚我都會親手殺了你！”\n\n“哈哈哈哈哈！”\n\n黃豐大笑，陽根猛地抽插，龜帽一層層剮蹭上官玉合肉環給予快感：“殺我？你們每個人都這麼說，可你們殺了嗎，動手啊我的大劍仙！來！殺我！！此刻你殺我，你最愛的雲兒還不是要給我陪葬？你還殺不了我，只能在他的隔壁被我肏，瞞著他被我肏得像母狗一樣！不是嗎？”\n\n聽著黃豐的話，上官玉合絕顏的冷色越來越重，可她的內心冒出的羞恥感和愧疚感，引得穴壁在被抽插時，就是忍不住痙攣發顫。\n\n甚至慢慢地，她岔開的兩腿都開始為之綳緊，足尖翹立在地板上，藕足蜷縮扣地。\n\n不是的，不是這樣的，娘怎麼會被他肏爽了呢！\n\n雲兒，娘不是這樣的人！！\n\n愧疚感沖唰著心海，上官玉合默默轉臉，不再望黃豐，紅唇無法抗拒地抿咬，螓首垂下劍眸掃向窗紗之外，絕不可以不可以讓雲兒知道這一切，就算是死！都不可以！！\n\n但她此刻身體想躲開黃豐噁心的侵犯，卻是很難。\n\n在黃豐知道上官玉合的弱點後，更是不停辱駡，將她肏得癱軟在窗臺：“肏你娘的騷賤仙，你兒子還把你當成是什麼冷傲大劍仙呢，肏你娘的，瞧瞧你現在的模樣，你的乳點一舔一咬就硬，被我肏得腿都快站不住了，你兒子知道嗎！我肏你娘的！！真他娘是個騷貨！！！”\n\n如此邊說著，黃豐粗糙黝黑的手還不忘掐住她白嫩如脂的臀肉，大力拍打出片片腫紅。\n\n上官玉合的意識在臀部被拍打，在羞恥與痛苦中不斷掙扎，她嘗試著不看窗外，閉上眼睛。\n\n可在黃豐的話語不斷湧入耳中時，腦海裡浮現的，唯有雲兒那張沖著自己溫笑的清俊臉龐，瞬間便心如刀絞般痛苦。\n\n娘真的沒用，娘對不起你，對不起劍閣！！\n\n該死，真該死！！！\n\n隨後每一次抽插，啪啪啪的肉體撞擊聲，上官玉合神闕穴內淫水噗滋噗滋狂湧，順著她欣長玉柱淌下，在被黃豐辱駡聲中，而今的她著實沒了半點劍仙的影子，反而更像一頭被肏得迷離的騷婦，乳浪翻滾，臀肉顫顫。\n\n瞧見上官玉合狀態愈發迷離，穴道痙攣的次數越來越多，溫度炙熱的頻率增高，黃豐則更加暢快切猛猛肏幹怒駡：“騷賤仙，你哪是什麼劍仙，依我看你壓根就是個賤仙，賤人的賤，你說是不是！”\n\n上官玉合聽著，隔著兩片紗窗和廊道，雲兒就在數步可達的位置，而自己的九環肉壁被一層層撞開穴道，已經被拓寬成了屬於黃豐的形狀，還瘋狂痙攣地夾緊那威脅在的粗長陽根，快感如雷劫電擊般劈入她的魂還。\n\n她只能用力咬緊了紅唇，壓抑著喉嚨間的呻吟，只是這種下賤、愧疚的快感，已經像媚藥般侵蝕著上官玉合的神識。\n\n黃豐一下下的肏弄抽插都是對她最大的折辱，亦是對劍仙尊嚴的踐踏。\n\n慢慢的，黃豐都開始被征服欲和終於得到上官玉合的暢快感中，忘記了身高不足，進而居然俯下身雙手探抓在上官玉合垂下的乳山處，然後整個人猛地一躍，騎在了上官玉合臀背上。\n\n乳肉在指縫間衣櫥，上官玉合動欲而凸立的蓓蕾被其插得嫣紅似血，這種姿勢真的像極了騎在了一頭母狗身上，也唯獨黃豐這種瘦矮之人，還擁有粗長陽根，才能施展出這等姿勢。\n\n肏弄間黃豐低聲不停嘶吼：“肏死你，肏死你這個不知廉恥的騷娘，說！你是不是很早就想像過被我肏了，你個母狗！！”\n\n聽著這句話，上官玉合迷離刻，驀然想起了曾經的那個夢。\n\n旋即上官玉合甩了甩豔容，忍著呻吟欲望，冷斥了聲：“卑鄙下作！仗勢欺人之徒！！”\n\n“嘿嘿嘿。”面對上官玉合的話，黃豐只認為是對自己莫大的誇張，在這個姿勢下，他的陽根能插得更深，每一下幾乎都已經快捅到上官玉合穴道最深處，甚至隔著避子套，他的龜帽都感覺自己刮蹭到了一處穴道軟肉異常凸粒的位置。\n\n肏過不少女人的他，當即明白這個位置意味著什麼，意味著上官玉合因為刺激，她的穴道已經一步步被自己所改變，如今陽根能抽插到的位置，已經來到了她穴道內，除宮口外最敏感的位置。\n\n黃豐賤笑著，就更為用力聳動陽根，用龜帽不停撞擊剮蹭那個有凸粒的敏感位置。\n\n上官玉合只能默默忍受著，她已經感覺到體內的潮意被刺激到了峰值，神闕穴具備湯池名器的特點，動欲後她穴道內壁愈發變得潤滑，交合出的淫液與潮吹時噴出的湯泉，止不住地往外濺射。\n\n這身體怎麼越來越奇怪了，雖然自己早就知道特殊，可為什麼會變得越來越熱！\n\n如果，如果當年青山也能做到這樣的話，自己是不是，如果雲兒也，雲兒也……那自己在此時此刻是不是能少受些折辱。\n\n可想及雲兒，她瞞著雲兒做了此時的羞恥和愧疚，又再一度衝擊出新的快感，而今的她已到了崩潰墮落的邊緣。\n\n猝不及防地！\n\n就在兩人正在慢慢走向欲望之巔時，廊道外一聲門響，人影攢動的熟悉背影，赫然嚇得上官玉合長腿綳得站直，蓮足藕趾玩命掂起，她的手使勁抵在黃豐抽插向自己的臀後，試圖減緩黃豐抽插的節奏。\n\n但本就溢發高漲的瀉意，在蘇雲背影出現間，顯然化為了一道催命符。\n\n所有羞恥都莫過於在雲兒身邊被人狠狠肏幹，恐懼快速攀上心頭，又下穴戶，隨著瀉意和潮汐體質的迸起，上官玉合竟然開始無法抑制宮口的高度，導致黃豐的龜頭都已經一下接著一下，從一點點到一片片，直到身影閃過窗前，最終撞擊在了宮口處。\n\n上官玉合如山河般豔美的容顏，黛眉隨之而蹙成一線，連至冷冽的劍眸都隱隱有了上翻之意，彼時她的柔夷已經捂在了嘴前，可見1光看意識的壓制難以再壓制喘息的聲音，而在哪怕隔著避子套的情況下，她甚至也還能清晰感受到黃豐龜帽，試圖撞開自己宮口的行徑。\n\n只是蘇雲離開房間，再度路過的身影，除了上官玉合，黃豐同樣能夠目視。\n\n而在察覺到上官玉合身體，因為人影驚慌顫抖後，他的嘴角便勾起一抹邪笑：“哦？看來蘇雲要出去了？要不要小子抱你出去，當著你兒子的面，肏爛你這賤仙騷屄！！”\n\n上官玉合聞言，冷驚地一回頭：“你說什麼？”\n\n“我說。”黃豐話語隨之落下，便從上官玉合背臀處躍了下來，然後雙手迅速勾住她的腿畔，矮小的身高端抱起了絕對比他高挑豐潤的熟婦，笑道：“讓你兒子親眼看看，自己的騷娘是怎麼被我幹的！”\n\n宮口早就有所下垂的上官玉合，在這個動作下，可以說整個葵宮都已經降了下去，黃豐的龜帽也已經不是撞在了上方，反而更像是她自己親往了黃豐的龜帽。\n\n一步步走著，瀉意狂襲。\n\n上官玉合被黃豐以這個小孩端尿的姿勢，肏得上下起伏，飽滿碩乳無規則甩動，淫水濺射不休，宛如水線。\n\n不行，必須阻止他！\n\n上官玉合的神識極為強悍，哪怕如此，她依舊還是能強忍著體內高漲快感，在黃豐沒走出兩步後，她體內靈氣迅速湧現，壓在黃豐身上：“不要在往前走了！！”\n\n“不走？”黃豐呵呵笑道，上官玉合洞虛威壓作用在身上，能夠讓他寸步難行，可這只是在他從未動用自身底牌的情況，什麼時候！\n\n他黃豐親口說過，自己怕過洞虛！\n\n隨見，黃豐挽住上官玉合腿畔的手，往屏風上擺佈的衣服揮了揮，一根常常攜帶在他腰間的玉如意騰空被他吸在手中，如意表面三顆舍利寶石，再即發出璀璨光芒，所有威壓頓時消散。\n\n黃豐端肏上官玉合前往門口的腳步，重新抬起。\n\n上官玉合凝了凝眉，劍眸落在如意上，有出奇，也有更多的是驚慌失措，紅唇漸開：“半神器！不你停下！給本宗停下！不要，不要開門！！給我停下，停下！我求求你，不要！！！”\n\n上官玉合的冷斥，在瘋狂掙扎中不斷發出，到最後居然變成了哀求。\n\n怎麼會，他憑藉這個器具使出的氣，甚至在這麼短短一瞬間，有了和自己旗鼓相當的勢頭！\n\n當然，如果再給她一點時間的話，上官玉合定然能反撲壓制住這半神器的威能，但是說時遲那時快，思想的時間可以很漫長，黃豐從抱起她，到開門的距離，實際不過眨眨眼就能辦到的事情。\n\n這麼短的時間，壓制著內裡藏有三名洞虛威能舍利的如意，別說是上官玉合，就算換了女帝與她同在場內，都只能打個平手。\n\n一步踏出，黃豐的氣機已經拉動了門戶。\n\n上官玉合同樣使出滔天氣機壓制著，可舍利賣命的發出光芒，那道本應死死關緊的門戶還是偏偏斜開了一條縫隙，眼看著就要打了開來。\n\n此刻，上官玉合心顫的快炸開，她甚至都能感受到雲兒在廊道外的氣息了！\n\n完全無法想像，如果讓雲兒看到自己如今這般模樣，如今這般渾身裸露，再加上方才的欺騙，雲兒該會陷進什麼樣的絕望之中。\n\n頓時，瞧著門戶斜開，光線開始從外跑進。\n\n上官玉合首次在黃豐面前徹徹底底變得恛惶無措，她著急的抬起手，捂在了臉前，距離之近逼得她淚水都含在了淚框中。\n\n但黃豐此刻，卻更加變本加厲地深深插懟向她宮口位置，猛地一頂又一頂。\n\n門戶即將打開，自己馬上就要被雲兒瞧見了，怎麼辦怎麼辦？\n\n被抽插的快意強烈刺激著她，上官玉合已然沒有了控制神闕的念頭，她只想著下一刻，單純在下一刻瞧見雲兒的時候，她開始驚地鼻間喘息不停，被端起的兩腿使出狠勁地扭動，試圖從黃豐身上跳下。\n\n但隨著她的動作，也加劇了宮口的下垂。\n\n雙方的接觸，即便隔著避子套，上官玉合都能感受到他腫大龜帽的隆重，如果讓他闖進神闕宮口，那她的穴道就真真正正回不去了。\n\n“不……不要不行！！”\n\n望著木門慢慢打開，上官玉合的淚水劃過豔容，酮體腰肢猛地顫抖，潮意瀉欲的快感，被黃豐抽插到了極致。\n\n黃豐興奮的感覺著龜帽隔著避子套，插在宮口前的觸感，像極了內裡還有一張小口在不斷吸吮自己，他暢快著嘲笑：“騷賤仙，被肏爽了吧，放心很快門就開了，蘇雲就要當面看到你在被我肏了！”\n\n黃豐的話入耳，恐懼和快感交雜，廊道燈光出現在了上官玉合眼前，那張平日冷豔孤傲的絕世容顏，已變得滿是淚水和紅潮，絳唇欲張欲合，喘息急促。\n\n“蘇雲，來啊！看看你的劍仙娘親是怎麼墮落的，被肏得多爽！！是怎麼變成一個蕩婦的！！”再隨著黃豐一聲聲喧嘩，門戶大開的響動，落進上官玉合耳內。\n\n她已經不敢睜開眼去看，黃豐陽根的深插宮口，讓她腰肢止不禁顫抖，一想到雲兒站在門前看到她的景象，上官玉合的意識便往崩潰墜去，愧疚帶來的快感和瀉意徹底衝破了她所有的防線。\n\n“啊……不不要，雲兒嗯????……哦齁不要看????????????！！！”\n\n隨著上官玉合的尖呼，喉嚨裡壓制呻吟亦同步升騰，終是忍不住透出半息。\n\n再見她整個人莫名開始抽搐，宮口被深深插著，神闕穴高潮後傳來刺激和夾擊，使得黃豐沒再控制得了精門，磅礴的精漿迅而噴灑在避子套內，又再穴道中膨脹，精漿炙熱的溫度通過穴肉傳遞，上官玉合又是再發出半聲爽到極致的呻吟。\n\n從她屄穴深處湧出的潮水宛如尿尿般，穿過門戶噴濺到了廊道上，如此瀉身的同時，上官玉合又再被黃豐射精在套內的炙熱，迎來了更大的高潮，連綿不休的丟身之感，爽得讓她在飛天般快感中搖搖欲墜，屄穴在濺射處一道液線後，又有數道液線噴出，直至慢慢孱弱。\n\n她癱軟倒在了黃豐懷中，柔夷再也無力捂住容顏，漸漸垂下，此時九州第一劍仙孤高冷豔絕容，其冷冽劍眸忍不住往上翻白，紅唇在呼喊後張開，舌頭微微伸出，毫無尊嚴可言。\n\n不知過去了多久，可能是半響，也可能是半盞茶半炷香。\n\n黃豐被吸幹了精的陽根變軟，緩緩從屄穴退了出來，再望著劍仙泥濘的唇瓣，神闕白虎騷穴又很快合成一條縫隙，只是縫隙間夾緊的避子套口，滴落的白精，仍在宣示著無休止的淫蕩靡迷。\n\n待緩過進後，黃豐方才將嘴附到上官玉合耳邊，輕輕吹氣，道：“別怕嘛，我的劍仙宗主，蘇雲早走了，根本沒看見。”\n\n此時再聽到黃豐話語的上官玉合，迷離劍眸徐徐劃下，空蕩蕩的廊道映入眼中。\n\n她沒有回應黃豐，只是癡癡地望著前方，任由眼角淚水滑落，還有那紅潤豐唇冉冉勾起的，一抹淡淡的弧度。\n\n此抹弧度，既微妙又複雜，或由著釋然亦或是慶倖，難以道明。\n\n她沒有見到雲兒，正如蘇雲並沒有發現她。\n\n作為劍仙她已不配，作為人母她也不恥，但至少最後，她還有著那麼一點點尊嚴保全在心中，而更大的，則跟著那半聲接著半聲的喘息，泯沒在了潮水之前。\n\n從此，此間是否還有劍仙上官玉合。\n\n未知。\n\n唯獨能夠知曉，是蘇雲不經意間，悄然失去的，墮落的冷豔劍仙娘親。\n\n—————————"}, {"title": "第三章 女帝", "content": "女帝不為所動。\n\n黃豐見狀，手停在某處三寸前，默然道：“不過按照賭約，陛下的確不能夠與小子偷行房事啊，這可如何是好？”\n\n旋即，女帝發首裝點的華美簪飾品蕩了蕩，鳳眸自上而下，冷地刮來：“琅兒與你私下有聯繫！”\n\n“陛下也掌握不了所有事，你兒子可老想被我給，嘿嘿嘿。”黃豐賤兮兮笑著，彼時院外便傳來了扣門聲。\n\n女官瞿竹的聲音傳了進來：\n\n“陛下，楚王殿下求見。”\n\n在聽到通報聲後，女帝鳳眸眯眯，再見著黃豐似有意收起手時，紅唇驀張：“宣。”\n\n接既，女帝刮掃向黃豐：“不准動，否則……”\n\n正說著，女帝笑了笑：“閹了你。”\n\n要論殺論斬，對黃豐來說，都不過一條爛命。\n\n可這一句閹了，還當真斬到了黃豐要害，他的手驟而停在了女帝腿畔上，不敢往前攀，亦不敢離開。\n\n就在此無人敢於有任何動作下，大夏楚王姬少琅的腳步，漸漸變得清晰。\n\n直到一身紅蟒暗黑華服，步入女帝下榻院落。\n\n走入院中的姬少琅，遠遠便見著秋千上臥躺的紅衣。\n\n然而，秋千斜側有欄杆作為遮蔽，起初少琅並沒有瞧見黃豐的身影，然等到他轉身正臉面見母后時，視野中的畫面，反讓他心神震顫。\n\n大夏的女帝，自己的母后。\n\n躺在秋千上的美影，絕代芳華，可偏偏在美影一側，一隻醜陋的蠻族少年，一黝黑小手正穿過了母后的裙袂，探進了內裡。\n\n甚至於母后，母后居然還真的如黃豐所眼，又穿上了那間扉黑長襪，而且瞧著那衣襟領口，她還穿上了那條金鏈，難道說這不是母后本體，本體並不在這？\n\n可姬少琅對於此，只能忍住心中的波瀾，將一抹言不明半喜半恨的神色藏進眼神中，低頭跪服：“兒臣參見母后，母后千歲萬歲萬萬歲。”\n\n“起來。”女帝東方嵐的話語聲，酥酥麻麻腔調不高，然落在誰的耳中都帶滿赫赫威嚴。\n\n姬少琅聽命站起身，低垂眼，眸子死死往上瞪住那探裙醜手。\n\n再即，女帝又道：“抬起頭來。”\n\n姬少琅楞了楞，母后是玩哪一出？\n\n想著，少琅未敢直接抬頭，只道了聲：“母后。”\n\n“朕說了，讓你抬起頭來。”\n\n聽著這不可違逆的命令，姬少琅牙關稍緊，慢慢抬頭。\n\n而就在姬少琅抬頭同時，躺握在秋千上的女帝也有了動作，可卻不是坐起，亦不是打掉黃豐摸在腿畔上的手，反而是鬆開了自己雙腿，更加愜意地把腿伸向了黃豐，然後居然還親自舉起柔夷，把黃豐的手，更往內裡挪去。\n\n而挪至位置，不是傻子都看得出。\n\n那恰恰就是女子私處，女帝母儀天下的生殖寶穴。\n\n僅僅如此還沒完，女帝偏偏還在繼續舉手，先是挑起絲縷散落在美肩上的碎片，然後柔夷裝作不小心地撥過鳳袍肩帶，裹足傲乳的鳳袍衣襟隨踵掉落。\n\n而在袍後，女帝此番未著任何小衣，兩顆乳尖蓓蕾環叩金鏈，整體充滿彈性美美的半球美乳，晃蕩地一下跳動出空氣中。\n\n望見此幕，姬少琅呼吸都凝重起來。可當少琅視線掃到母后眉間若隱若現的一記火花印記，終是再度一跪：\n\n“兒臣給陛下問安！！”\n\n說著此話時，姬少琅瞳孔微震，是本體是本體的母后，但為什麼母后會？\n\n為什麼？\n\n“哼。”聽聞語，女帝目視著他，唇峰漸勾：“琅兒如今見朕，可真算安好？”\n\n黃豐坐在一旁，手指杵在穴門前，大夏女帝鳳穴穴瓣無時無刻不勾引著人，但仍由美穴軟嫩，還是眼前的戲碼，更讓他不明覺厲。\n\n只見姬少琅聞言，供起手以臣禮相待：“陛下貴為九州之主，安與不安，又怎能由兒臣一言定之。”\n\n話落之後，女帝眼中少了些許警惕之意，可換來的又變為了絲絲淡淡驕慢蔑視的神色。\n\n窩囊廢！\n\n女帝腦海中莫名飄過一串字眼，再即她又睨向少琅：“能把與九州之主定下的賭約，隨意透露給外人。琅兒，你還有什麼是不敢一言以定之的？”\n\n女帝的話語輕飄飄落下。\n\n姬少琅是聽得一陣驚悚，隨即他稍微撣了眼黃豐，瞅著黃豐一臉無辜表情後，陡然跪下：“兒臣知罪。兒臣再也不敢了。”\n\n“不敢？”\n\n姬少琅低下了頭，表情晦暗。\n\n而這時黃豐望著姬少琅模樣，反顯露出忌憚神色，然忌憚同時，又有更多的嗤之以鼻。\n\n未曾想，就在姬少琅與黃豐二人都在擔憂女帝，是否會狠心發變，收拾掉姬少琅手中權勢時，女帝紅唇反玩味地勾勒起來，悠悠道：“說起來，朕對此倒有點忘了，要不琅兒在此把那份賭約再說說，如何？”\n\n在這裡？\n\n再說一遍？\n\n姬少琅內心頓時跑過千匹來自于青青草原的肥羊，他目光狐疑抬起：“在這？”\n\n女帝見之，語氣淡淡：“不然呢。”\n\n呃……姬少琅望著母后輕視自己的模樣，莫名有點酸澀，而且宣讀那份賭約，更像公開對他處於極刑，可他不說又過得去嗎？\n\n姬少琅只好低下頭，緩緩回顧道：“為了試探我對於母后被蠻人玷污會不會興奮，母后可以稍微主動去接觸那廝，期限暫定在涼州大比期間，並約下三條規矩。”\n\n“其一、若是琅兒不喜，或是母后不喜可隨意叫停。”\n\n“其二、在這場新的測試中，斷不能將個人私事牽引夏蠻的正事之中。”\n\n“其三……母后的尺度必須要把握在笫之前，若是中途實在無法忍耐，必須告知兒臣。”\n\n聽完約定後的女帝，鳳眸中閃過刹那詫異，轉而又將充滿鄙夷神色的眼刮掃向黃豐，再即望著他道：“真是有趣。可琅兒，你應該都看到了，還不喊停，而且……”\n\n正說著，女帝仰臉微偏，冷冷道：“就在當下，你口中的蠻人在做什麼？你知道嗎？”\n\n姬少琅尚且不敢抬眼直視，低頭應道：“兒臣不知。”\n\n女帝聽後，冷笑了下：“他啊，那手可一點都不安分，已經有兩根手指插進母后屄戶裡了，事到如今，琅兒又怎麼看？”\n\n待女帝話落，姬少琅面色一黑，感覺心房都被人重重錘了一拳。\n\n作為旁觀者的黃豐，卻驚呆了地撇眼察看起身邊的華貴女帝，雖然說水潤的都是熟婦，俗語亦有女人三十如狼四十如虎的說法，但眼前這位真真正正的妙齡大熟婦，你可不要瞎說啊，他小小黃豐還被你喝住，一動都不敢動，哪裡伸手指了！\n\n污蔑，純純的污蔑，黃豐幾乎都想立馬沖到姬少琅身邊，告訴少琅。\n\n她誹謗我啊，她在誹謗我呀！！\n\n只是念頭憧憧，黃豐又開始感覺到自己放在女帝恥穴前的手背，居然淺淺地，慢慢地，接觸到點點涼意。\n\n黃豐隨即扭轉視線，瞧了下去，啊這……\n\n出水了？\n\n我勒個燒娘！\n\n你你你，黃豐嘴巴長大，卻見女帝
